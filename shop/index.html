<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RYZIN SHOP — 토스 라이브 쇼핑</title>
  <meta name="description" content="라이진 라이브 커머스 — 토스 스타일 프리미엄 뷰티 & 라이프스타일">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/supabase_config.js"></script>

  <style>
    :root {
      --bg: #121316;
      --surface: #1c1d22;
      --surface-card: #22232a;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent-red: #ff3b30;
      --accent-blue: #3b82f6;
      --accent-yellow: #f59e0b;
      --border: #272832;
      --chip-navy: #1e293b;
      --chip-burgundy: #3f1d24;
      --chip-dark: #262626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000000;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding-bottom: 70px;
      position: relative;
    }

    /* ── HEADER ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(18, 19, 22, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }

    .hdr-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      padding: 4px;
    }

    .hdr-icon-btn svg {
      width: 24px;
      height: 24px;
      stroke: #ffffff;
      stroke-width: 2;
      fill: none;
    }

    .hdr-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ── HERO PROMO BANNER ── */
    .hero-banner-wrap {
      padding: 8px 16px 16px;
    }

    .hero-promo-card {
      width: 100%;
      background: #f8fafc;
      border-radius: 20px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .hero-promo-text h2 {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .hero-promo-text p {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
    }

    .hero-promo-img {
      width: 100px;
      height: 70px;
      object-fit: contain;
    }

    /* ── SUB NAV TABS ── */
    .sub-tabs {
      display: flex;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      gap: 24px;
    }

    .sub-tab {
      padding: 12px 0 14px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      position: relative;
      transition: color 0.15s;
    }

    .sub-tab.active {
      color: #ffffff;
      font-weight: 700;
    }

    .sub-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: #ffffff;
      border-radius: 2px;
    }

    /* ── SECTIONS ── */
    .section {
      padding: 24px 16px;
      border-bottom: 8px solid #000000;
    }

    .sec-header-wrap {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .sec-title-group h3 {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }

    .sec-title-group p {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .sec-timer-badge {
      background: #272832;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 14px;
      font-family: monospace;
    }

    /* ── TOSS PRODUCT CARDS (HORIZONTAL SCROLL / GRID) ── */
    .toss-prod-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-padding: 0 16px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      margin: 0 -16px;
      padding: 0 16px 8px;
    }

    .toss-prod-scroll::-webkit-scrollbar { display: none; }

    .toss-card {
      flex: 0 0 160px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .toss-img-box {
      width: 160px;
      height: 160px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: #2a2b32;
    }

    .toss-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .toss-discount-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--accent-red);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      z-index: 2;
    }

    .toss-wish-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      border: none;
      cursor: pointer;
      z-index: 2;
    }

    .toss-wish-btn svg {
      width: 16px;
      height: 16px;
      stroke: #ffffff;
      stroke-width: 2;
      fill: none;
    }

    .toss-info {
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .toss-brand-title {
      font-size: 13px;
      color: #e2e8f0;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 35px;
    }

    .toss-price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 2px;
    }

    .toss-sale-price {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
    }

    .toss-origin-price {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .toss-unit-price {
      font-size: 11px;
      color: var(--text-muted);
    }

    .toss-rating-row {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .toss-rating-row span.star-icon {
      color: var(--accent-yellow);
    }

    .toss-chip-row {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .toss-chip {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .chip-ship { background: #1e293b; color: #60a5fa; }
    .chip-guarantee { background: #3f1d24; color: #f87171; }
    .chip-best { background: #262626; color: #d1d5db; }

    /* ── TOSS MORE BUTTON ── */
    .toss-more-btn {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      background: #1e293b;
      color: #60a5fa;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .toss-more-btn:active {
      background: #334155;
    }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: rgba(18, 19, 22, 0.98);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      z-index: 300;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--text-muted);
      text-decoration: none;
      position: relative;
    }

    .nav-item.active {
      color: #ffffff;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .nav-item span {
      font-size: 11px;
      font-weight: 600;
    }

    .nav-dot-badge {
      position: absolute;
      top: 0;
      right: 12px;
      width: 6px;
      height: 6px;
      background: var(--accent-red);
      border-radius: 50%;
    }
  </style>
</head>

    },
    {
      id: 'toss_09',
      brandTitle: '뷰티영 코노피 리프팅 크림 10ml 단독세트',
      salePrice: '33,400원',
      originPrice: '59,900원',
      discount: '44% 특가',
      rating: '4.8',
      reviews: '150',
      chips: [{ text: '오늘출발', class: 'chip-ship' }],
      img: 'https://images.unsplash.com/photo-1512290900673-700204739190?auto=format&fit=crop&w=400&q=85'
    }
  ];

  function renderTossScroll(containerId, list) {
    const el = document.getElementById(containerId);
    if (!el) return;

    el.innerHTML = list.map(item => `
      <div class="toss-card" onclick="window.location.href='/shop/product.html?id=${item.id}'">
        <div class="toss-img-box">
          <img src="${item.img}" alt="${item.brandTitle}">
          <span class="toss-discount-tag">${item.discount}</span>
          <button class="toss-wish-btn" onclick="event.stopPropagation(); toggleWish(this)">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </button>
        </div>
        <div class="toss-info">
          <div class="toss-brand-title">${item.brandTitle}</div>
          <div class="toss-price-row">
            <span class="toss-sale-price">${item.salePrice}</span>
            <span class="toss-origin-price">${item.originPrice}</span>
          </div>
          ${item.unitPrice ? `<div class="toss-unit-price">${item.unitPrice}</div>` : ''}
          <div class="toss-rating-row">
            <span class="star-icon">★</span>
            <span>${item.rating} (${item.reviews})</span>
          </div>
          <div class="toss-chip-row">
            ${item.chips.map(c => `<span class="toss-chip ${c.class}">${c.text}</span>`).join('')}
          </div>
        </div>
      </div>
    `).join('');
  }

  function toggleWish(btn) {
    const svg = btn.querySelector('svg');
    const isFilled = svg.getAttribute('fill') === '#ff3b30';
    if (isFilled) {
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', '#ffffff');
      showToast('위시리스트에서 삭제되었습니다.');
    } else {
      svg.setAttribute('fill', '#ff3b30');
      svg.setAttribute('stroke', '#ff3b30');
      showToast('위시리스트에 담겼습니다! ❤️');
    }
  }

  function switchSubTab(el, tabName) {
    document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    showToast(`'${el.textContent}' 탭으로 이동했습니다.`);
  }

  function switchNav(el) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = msg;
    toast.style.transform = 'translateX(-50%) translateY(0)';
    setTimeout(() => {
      toast.style.transform = 'translateX(-50%) translateY(-100px)';
    }, 2200);
  }

  // Init
  document.addEventListener('DOMContentLoaded', () => {
    renderTossScroll('scroll-section-1', PRODUCTS_SET_1);
    renderTossScroll('scroll-section-2', PRODUCTS_SET_2);
    renderTossScroll('scroll-section-3', PRODUCTS_SET_3);
  });
</script>
</body>
</html>
