<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RYZIN SHOP — 라이브 커머스</title>
  <meta name="description" content="라이진 라이브 커머스 — 프리미엄 뷰티 & 라이프스타일 모바일 쇼핑몰">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/supabase_config.js"></script>

  <style>
    :root {
      --primary: #ef4444;
      --text-main: #111827;
      --text-sub: #374151;
      --text-muted: #9ca3af;
      --surface: #fff;
      --bg: #f3f4f6;
      --border: #e5e7eb;
      --border-light: #f9fafb;
      --header-h: 100px; /* logo-row + tab-row */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      padding-bottom: 68px;
      position: relative;
    }

    /* ─────────────────────────────────────────────────────────
       HEADER
    ───────────────────────────────────────────────────────── */
    .header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    /* 로고 row */
    .header-logo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px 8px;
    }

    /* 로고 — 다크 배경에 흰 반전 */
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
    }

    .logo-img-wrap {
      background: #111827;
      border-radius: 8px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      height: 34px;
    }

    .logo-img-wrap img {
      height: 18px;
      width: auto;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .logo-text-fallback {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #fff;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hdr-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f3f4f6;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .hdr-btn:active { background: #e5e7eb; }

    .hdr-btn svg {
      width: 18px;
      height: 18px;
      stroke: #111827;
      stroke-width: 2;
      fill: none;
    }

    /* 탑 네비 탭 row */
    .top-nav {
      display: flex;
      border-top: 1px solid var(--border-light);
    }

    .top-nav-tab {
      flex: 1;
      padding: 9px 0 8px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #9ca3af;
      cursor: pointer;
      position: relative;
      transition: color 0.15s;
      letter-spacing: -0.01em;
    }

    .top-nav-tab.active {
      color: var(--text-main);
      font-weight: 800;
    }

    .top-nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 10%; right: 10%;
      height: 2.5px;
      background: var(--text-main);
      border-radius: 2px;
    }

    /* ─────────────────────────────────────────────────────────
       TAB VIEWS
    ───────────────────────────────────────────────────────── */
    .tab-view { display: none; }
    .tab-view.active { display: block; }

    /* 공통 섹션 */
    .section {
      padding: 22px 0 20px;
      border-bottom: 6px solid var(--bg);
    }

    .section:last-child { border-bottom: none; }

    .sec-header {
      padding: 0 18px 14px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .sec-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.03em;
    }

    .sec-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ─────────────────────────────────────────────────────────
       LIVE CAROUSEL  (ON AIR / 예정 포스터 카드)
    ───────────────────────────────────────────────────────── */
    .live-scroll {
      display: flex;
      gap: 10px;
      padding: 0 18px 2px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .live-scroll::-webkit-scrollbar { display: none; }

    .live-card {
      flex: 0 0 188px;
      height: 300px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      scroll-snap-align: start;
      cursor: pointer;
      background: #0f172a;
    }

    .live-card img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .live-card:active img { transform: scale(1.03); }

    .live-card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.25) 0%,
        transparent 42%,
        rgba(0,0,0,0.82) 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    /* 상태 뱃지 */
    .live-status-badge {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 30px;
      letter-spacing: 0.03em;
    }

    .badge-live {
      background: #ef4444;
      color: #fff;
    }

    .badge-upcoming {
      background: rgba(0,0,0,0.6);
      color: rgba(255,255,255,0.95);
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(8px);
    }

    .pulse-dot {
      width: 5px; height: 5px;
      background: #fff;
      border-radius: 50%;
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    .live-card-body { color: #fff; }

    .live-card-title {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    .live-card-btn {
      width: 100%;
      padding: 7px 0;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.18);
      color: #fff;
      cursor: pointer;
      text-align: center;
      backdrop-filter: blur(10px);
      transition: background 0.2s, color 0.2s;
    }

    .live-card-btn.notified {
      background: #fff;
      color: var(--text-main);
      border-color: #fff;
    }

    /* ─────────────────────────────────────────────────────────
       VOD 기획 다시보기
    ───────────────────────────────────────────────────────── */
    .pill-scroll {
      display: flex;
      gap: 6px;
      padding: 0 18px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .pill-scroll::-webkit-scrollbar { display: none; }

    .pill {
      white-space: nowrap;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      background: #f3f4f6;
      padding: 5px 13px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.15s;
      border: 1.5px solid transparent;
    }

    .pill.active {
      color: var(--text-main);
      background: #fff;
      border-color: var(--text-main);
      font-weight: 800;
    }

    .vod-scroll {
      display: flex;
      gap: 10px;
      padding: 0 18px 2px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .vod-scroll::-webkit-scrollbar { display: none; }

    .vod-card {
      flex: 0 0 148px;
      scroll-snap-align: start;
      cursor: pointer;
    }

    .vod-thumb {
      width: 100%;
      height: 210px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background: #111;
    }

    .vod-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .vod-card:active .vod-thumb img { transform: scale(1.04); }

    .vod-meta {
      position: absolute;
      top: 8px; left: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .vod-badge {
      font-size: 9px;
      font-weight: 900;
      background: rgba(0,0,0,0.82);
      color: #fff;
      padding: 2px 5px;
      border-radius: 4px;
      letter-spacing: 0.06em;
    }

    .vod-views {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    /* 상품 칩 */
    .product-chip {
      position: absolute;
      bottom: 7px; left: 5px; right: 5px;
      background: rgba(255,255,255,0.97);
      border-radius: 9px;
      padding: 5px 7px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }

    .product-chip img {
      width: 28px; height: 28px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .chip-info { flex: 1; min-width: 0; }

    .chip-name {
      font-size: 10px;
      font-weight: 600;
      color: #374151;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .chip-price {
      font-size: 12px;
      font-weight: 900;
      color: #111827;
      line-height: 1.2;
    }

    .vod-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 7px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ─────────────────────────────────────────────────────────
       상품 그리드 (홈 랭킹 / 오늘의딜)
    ───────────────────────────────────────────────────────── */
    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 18px;
    }

    .prod-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .prod-img-wrap {
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      background: #f3f4f6;
      position: relative;
    }

    .prod-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .prod-card:active .prod-img-wrap img { transform: scale(1.03); }

    .rank-num {
      position: absolute;
      top: 7px; left: 7px;
      width: 20px; height: 20px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rank-num.gold { background: #f59e0b; }
    .rank-num.silver { background: #6b7280; }

    .exclusive-badge {
      position: absolute;
      top: 7px; right: 7px;
      background: #111827;
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .discount-badge {
      position: absolute;
      top: 7px; right: 7px;
      background: #ef4444;
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .prod-info {
      padding: 8px 2px 4px;
    }

    .prod-brand {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
    }

    .prod-brand-arrow {
      font-size: 10px;
      color: var(--text-muted);
      margin-left: 2px;
    }

    .prod-name {
      font-size: 12px;
      font-weight: 500;
      color: #374151;
      margin: 3px 0 5px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .prod-price {
      font-size: 15px;
      font-weight: 900;
      color: var(--text-main);
    }

    .prod-benefit {
      font-size: 11px;
      font-weight: 700;
      color: #ef4444;
      margin-top: 1px;
    }

    .prod-origin {
      font-size: 11px;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .chip-row {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .chip-tag {
      font-size: 10px;
      font-weight: 600;
      color: #6b7280;
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .chip-tag.red { color: #ef4444; background: #fee2e2; }
    .chip-tag.blue { color: #2563eb; background: #dbeafe; }

    /* ─────────────────────────────────────────────────────────
       홈 탭: 배너 슬라이더 영역
    ───────────────────────────────────────────────────────── */
    .home-banner {
      margin: 0 0 0;
      padding: 16px 18px 0;
    }

    .banner-card {
      width: 100%;
      height: 130px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .banner-card img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .banner-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.65) 0%, transparent 60%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 20px;
    }

    .banner-subtitle {
      font-size: 10px;
      font-weight: 700;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .banner-title {
      font-size: 17px;
      font-weight: 900;
      color: #fff;
      line-height: 1.25;
    }

    .banner-cta {
      margin-top: 8px;
      display: inline-block;
      background: #fff;
      color: #111;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* ─────────────────────────────────────────────────────────
       체험단 전용 카드
    ───────────────────────────────────────────────────────── */
    .trial-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 18px;
    }

    .trial-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .trial-img-wrap {
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background: #f3f4f6;
    }

    .trial-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .trial-spots-badge {
      position: absolute;
      top: 7px; left: 7px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .trial-free-badge {
      position: absolute;
      top: 7px; right: 7px;
      background: #22c55e;
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .trial-info {
      padding: 8px 2px 4px;
    }

    .trial-brand {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
    }

    .trial-name {
      font-size: 12px;
      font-weight: 500;
      color: #374151;
      margin: 3px 0 5px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .trial-deadline {
      font-size: 10px;
      font-weight: 700;
      color: #ef4444;
    }

    /* ─────────────────────────────────────────────────────────
       BOTTOM NAV
    ───────────────────────────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: 60px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 200;
    }

    .bnav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-decoration: none;
      color: #9ca3af;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s;
    }

    .bnav-item.active { color: var(--text-main); font-weight: 800; }

    .bnav-item svg {
      width: 20px; height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    /* ─────────────────────────────────────────────────────────
       MODAL (라이브 시청)
    ───────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(16px);
      z-index: 500;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 430px;
      height: 96vh;      /* 세로 더 길게 */
      background: #000;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 12px; right: 12px;
      width: 30px; height: 30px;
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-iframe {
      width: 100%; height: 100%;
      border: none;
    }

    /* ─────────────────────────────────────────────────────────
       TOAST
    ───────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      top: 18px; left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #111827;
      color: #fff;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      z-index: 600;
      white-space: nowrap;
      transition: transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>

<body>
<div class="app">

  <!-- ───── HEADER ───── -->
  <header class="header">
    <!-- 로고 row -->
    <div class="header-logo-row">
      <a class="logo-wrap" href="/shop/">
        <div class="logo-img-wrap">
          <img
            src="https://ryzincorp.com/assets/logo.png"
            alt="RYZIN"
            onerror="this.outerHTML='<span class=\'logo-text-fallback\'>RYZIN</span>'"
          >
        </div>
      </a>
      <div class="header-icons">
        <button class="hdr-btn" onclick="showToast('검색 기능을 준비 중입니다.')">
          <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </button>
        <button class="hdr-btn" onclick="showToast('장바구니가 비어있습니다.')">
          <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        </button>
      </div>
    </div>
    <!-- 탑 네비 row -->
    <nav class="top-nav">
      <div class="top-nav-tab" data-tab="home" onclick="switchTab('home')">홈</div>
      <div class="top-nav-tab active" data-tab="live" onclick="switchTab('live')">라이브</div>
      <div class="top-nav-tab" data-tab="deal" onclick="switchTab('deal')">오늘의딜</div>
      <div class="top-nav-tab" data-tab="group" onclick="switchTab('group')">공동구매</div>
      <div class="top-nav-tab" data-tab="trial" onclick="switchTab('trial')">체험단</div>
    </nav>
  </header>

  <!-- ───── MAIN ───── -->
  <main>

    <!-- ── 탭: 홈 ── -->

  function showToast(msg) {
    const el = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  function openLive(id) {
    const modal = document.getElementById('live-modal');
    const iframe = document.getElementById('modal-iframe');
    const base = location.origin.includes('localhost') ? 'http://localhost:8080/live/' : '/live/';
    iframe.src = base + '?id=' + id;
    modal.classList.add('open');
  }

  function closeModal() {
    document.getElementById('live-modal').classList.remove('open');
    document.getElementById('modal-iframe').src = 'about:blank';
  }

  /* 탭 전환 */
  function switchTab(name) {
    document.querySelectorAll('.top-nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`[data-tab="${name}"]`)?.classList.add('active');

    document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + name)?.classList.add('active');

    document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
    const navMap = { home: 0, live: 1, deal: 2, group: 3 };
    if (navMap[name] !== undefined) {
      document.querySelectorAll('.bnav-item')[navMap[name]]?.classList.add('active');
    }
  }

  /* ──────────────────────────────────────────
     렌더링 함수
  ────────────────────────────────────────── */
  function renderLiveCards(list) {
    const el = document.getElementById('live-carousel');
    el.innerHTML = list.map(item => `
      <div class="live-card" onclick="openLive('${item.id}')">
        <img src="${item.img}" alt="${item.title}">
        <div class="live-card-overlay">
          <div class="live-status-badge ${item.isLive ? 'badge-live' : 'badge-upcoming'}">
            ${item.isLive ? `<span class="pulse-dot"></span>LIVE` : item.time}
          </div>
          <div class="live-card-body">
            <div class="live-card-title">${item.title}</div>
            <button class="live-card-btn" onclick="event.stopPropagation();${item.isLive ? `openLive('${item.id}')` : `notifyMe(this,'${item.title}')`}">
              ${item.isLive ? '지금 시청하기' : '알림 신청'}
            </button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function notifyMe(btn, title) {
    btn.classList.toggle('notified');
    if (btn.classList.contains('notified')) {
      btn.textContent = '알림 신청 완료';
      showToast(`방송 알림이 신청되었습니다.`);
    } else {
      btn.textContent = '알림 신청';
      showToast('알림 신청이 해제되었습니다.');
    }
  }

  function renderVod(list) {
    const el = document.getElementById('vod-list');
    el.innerHTML = list.map(item => `
      <div class="vod-card" onclick="openLive('${item.id}')">
        <div class="vod-thumb">
          <img src="${item.img}" alt="${item.title}">
          <div class="vod-meta">
            <span class="vod-badge">VOD</span>
            <span class="vod-views">${item.views}</span>
          </div>
          <div class="product-chip">
            <img src="${item.product.img}" alt="${item.product.name}">
            <div class="chip-info">
              <div class="chip-name">${item.product.name}</div>
              <div class="chip-price">${item.product.price}</div>
            </div>
          </div>
        </div>
        <div class="vod-title">${item.title}</div>
      </div>
    `).join('');
  }

  function filterVod(tag, btn) {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const filtered = tag === '뷰티레시피' ? VODS : VODS.filter(v => v.tag === tag);
    renderVod(filtered.length ? filtered : VODS);
  }

        <div class="prod-card" onclick="showToast('${p.brand} 상품 페이지로 이동합니다.')">
          <div class="prod-img-wrap">
            <img src="${p.img}" alt="${p.name}">
            <span class="rank-num ${rankClass}">${p.rank}</span>
            ${p.exclusive ? '<span class="exclusive-badge">단독</span>' : ''}
          </div>
          <div class="prod-info">
            <div class="prod-brand">${p.brand}<span class="prod-brand-arrow"> ›</span></div>

            <div class="prod-price">${p.price}</div>
            ${p.benefit ? `<div class="prod-benefit">${p.benefit}</div>` : ''}
            <div class="chip-row">${p.tags.map(t => `<span class="chip-tag">${t}</span>`).join('')}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderGroupBuys() {
    const el = document.getElementById('group-grid');
    el.innerHTML = GROUP_BUYS.map((p, i) => `
      <div class="prod-card" onclick="showToast('${p.brand} 공동구매 참여가 완료되었습니다.')">

  function renderTrials() {
    const el = document.getElementById('trial-grid');

  /* ──────────────────────────────────────────
     초기화
  ────────────────────────────────────────── */
  async function init() {
    renderVod(VODS);
    renderRanking();
    renderDeals();
    renderGroupBuys();
    renderTrials();

    let livesToShow = [...LIVES];

    // Supabase 라이브 데이터 연동
    if (typeof window.supabaseClient !== 'undefined' && window.supabaseClient) {
      try {
        const { data, error } = await window.supabaseClient
          .from('live_control')
          .select('*')
          .order('updated_at', { ascending: false });

        if (!error && data?.length) {
          const remotes = data.map(row => ({
            id: row.live_id,
            title: row.title || '라이브 방송',
            time: 'ON AIR',
            isLive: row.status === 'ON',
            img: row.thumbnail_url || (row.profile_image?.replace('#nosplash','')) || LIVES[0].img
          }));
          livesToShow = [...remotes, ...LIVES];
        }
      } catch (e) {
        console.warn('Supabase 오류:', e);
      }
    }

    renderLiveCards(livesToShow);
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
