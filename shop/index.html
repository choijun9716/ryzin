<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SHOP — 라이브 커머스</title>
  <meta name="description" content="라이브 커머스 모바일 쇼핑몰">
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Supabase Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/supabase_config.js"></script>

  <style>
    :root {
      --primary: #ef4444;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --bg-body: #f8fafc;
      --surface: #ffffff;
      --border-color: #e2e8f0;
      --border-light: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f1f5f9;
      color: var(--text-main);
      line-height: 1.4;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 모바일 가상 컨테이너 */
    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--surface);
      min-height: 100vh;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: 64px;
    }

    /* ── 상단 헤더 (아이콘/이모티콘 완전 제거, 미니멀) ──────────── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
    }

    .header-top {
      height: 48px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 로고 자리 완전 비워놓음 */
    .logo-empty-slot {
      width: 100px;
      height: 24px;
    }

    /* ── 스티키 카테고리 탭 ────────────────────────────────── */
    .category-nav {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding: 4px 18px 10px;
      gap: 20px;
      scrollbar-width: none;
    }

    .category-nav::-webkit-scrollbar {
      display: none;
    }

    .nav-tab {
      white-space: nowrap;
      font-size: 15px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      position: relative;
      padding-bottom: 6px;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav-tab.active {
      color: #0f172a;
      font-weight: 800;
      font-size: 16px;
    }

    .nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      background-color: #0f172a;
      border-radius: 2px;
    }

    .nav-tag-badge {
      font-size: 9px;
      font-weight: 800;
      color: #ef4444;
      margin-bottom: -1px;
      line-height: 1;
    }

    /* ── 메인 섹션 ─────────────────────────────────────────── */
    .section {
      padding: 24px 0;
      border-bottom: 8px solid #f8fafc;
    }

    .section-header {
      padding: 0 20px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.03em;
    }

    .section-more {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
    }

    /* ── 섹션 1: 라이브 메인 카러셀 ────────────────────────────── */
    .live-carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 12px;
      padding: 0 20px 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .live-carousel::-webkit-scrollbar {
      display: none;
    }

    .live-card-hero {
      flex: 0 0 210px;
      height: 320px;
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      scroll-snap-align: start;
      cursor: pointer;
      background-color: #0f172a;
    }

    .live-card-hero img.hero-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.05) 45%, rgba(0,0,0,0.85) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
    }

    .hero-top-badge {
      align-self: flex-start;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .badge-onair {
      background: #ef4444 !important;
      color: #fff !important;
      font-weight: 900 !important;
    }

    .dot-red {
      width: 6px;
      height: 6px;
      background-color: #fff;
      border-radius: 50%;
      display: inline-block;
    }

    .hero-bottom-info {
      color: #fff;
    }

    .hero-brand-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-action-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 0;
      border-radius: 20px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .hero-action-btn.subscribed {
      background: #ffffff;
      color: #0f172a;
      border-color: #ffffff;
    }

    /* ── 섹션 2: 기획 라이브 다시보기 (이미지 1 참조) ─────────────── */
    .sub-filter-scroll {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 0 20px 14px;
      scrollbar-width: none;
    }

    .sub-filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .pill-tab {
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      background-color: #f1f5f9;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-tab.active {
      color: #0f172a;
      background-color: #e2e8f0;
      font-weight: 800;
    }

    .vod-grid-scroll {
      display: flex;
      overflow-x: auto;
      gap: 12px;
      padding: 0 20px 4px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .vod-grid-scroll::-webkit-scrollbar {
      display: none;
    }

    .vod-card {
      flex: 0 0 155px;
      scroll-snap-align: start;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .vod-thumb-box {
      width: 100%;
      height: 220px;
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      background-color: #000;
    }

    .vod-thumb-box img.thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .vod-top-info {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .badge-vod {
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .vod-views {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    /* VOD 카드 내부 하단 상품 칩 (이미지 1 100% 동일) */
    .vod-product-chip {
      position: absolute;
      bottom: 8px;
      left: 6px;
      right: 6px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 8px;
      padding: 5px 7px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      z-index: 2;
    }

    .vod-product-chip img {
      width: 30px;
      height: 30px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .vod-product-details {
      flex: 1;
      min-width: 0;
    }

    .vod-product-name {
      font-size: 10px;
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .vod-product-price {
      font-size: 12px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.2;
    }

    .vod-card-title {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      margin-top: 8px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── 섹션 3: 라이브 혜택 핫딜 상품 ────────────────────────── */
    .deal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 20px;
    }

    .deal-item {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .deal-img-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
      overflow: hidden;
      background-color: #f8fafc;
    }

    .deal-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .deal-discount-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .deal-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .deal-brand {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .deal-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin: 2px 0 6px;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .deal-price-box {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-top: auto;
    }

    .deal-price {
      font-size: 15px;
      font-weight: 900;
      color: var(--text-main);
    }

    .deal-origin-price {
      font-size: 11px;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    /* ── 하단 바텀 네비게이션 ──────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 56px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 150;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      height: 100%;
    }

    .nav-item.active {
      color: #0f172a;
      font-weight: 800;
    }

    /* ── 비디오 모달 팝업 ─────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 400px;
      height: 85vh;
      max-height: 720px;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .modal-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      border: none;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ── 미니멀 토스트 ───────────────────────────────────────── */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #0f172a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      z-index: 300;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- ── 상단 헤더 (로고/우측아이콘 모두 제거, 깔끔한 스티키) ── -->
    <header class="header">
      <div class="header-top">
        <div class="logo-empty-slot"></div>
        <div></div>
      </div>

      <!-- ── 스티키 카테고리 탭 (이미지 2 참조) ── -->
      <nav class="category-nav">
        <div class="nav-tab active">라이브</div>
        <div class="nav-tab">홈</div>
        <div class="nav-tab">베스트</div>
        <div class="nav-tab">
          <span class="nav-tag-badge">4,900원</span>
          슈퍼마리오
        </div>
        <div class="nav-tab">
          <span class="nav-tag-badge">더블 페이백</span>
          멤버십위크
        </div>
        <div class="nav-tab">선물하기</div>
        <div class="nav-tab">이벤트</div>
      </nav>
    </header>

    <!-- ── 메인 컨텐츠 ── -->
    <main>

      <!-- ── 섹션 1: 라이브 메인 / 방송 예정 카러셀 (이미지 2 참조) ── -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">지금 ON AIR & 방송 예정</h2>
          <a href="#" class="section-more" onclick="showToast('전체 라이브 목록입니다.'); return false;">전체보기 ›</a>
        </div>

        <div class="live-carousel" id="hero-live-carousel">
          <!-- Dynamic Supabase & Live Items -->
        </div>
      </section>

      <!-- ── 섹션 2: 기획 라이브 다시보기 (이미지 1 참조) ── -->
      <section class="section">
        <div class="section-header" style="padding-bottom: 8px;">
          <h2 class="section-title">기획 라이브 다시보기</h2>
        </div>

        <!-- 서브 필터 탭 (이미지 1 필터 참조) -->
        <div class="sub-filter-scroll">
          <div class="pill-tab active" onclick="filterVod('all', this)">뷰티레시피</div>
          <div class="pill-tab" onclick="filterVod('같이살래', this)">같이살래</div>
          <div class="pill-tab" onclick="filterVod('박사임당', this)">박사임당</div>
          <div class="pill-tab" onclick="filterVod('뷰티데스크', this)">뷰티데스크</div>
          <div class="pill-tab" onclick="filterVod('세상예쁜것들', this)">세상예쁜것들</div>
          <div class="pill-tab" onclick="filterVod('뷰티극장', this)">뷰티극장</div>
        </div>

        <!-- VOD 카드 가로 스크롤 리스트 (이미지 1 참조) -->
        <div class="vod-grid-scroll" id="vod-cards-container">
          <!-- Dynamic VOD Cards -->
        </div>
      </section>

      <!-- ── 섹션 3: 라이브 혜택 핫딜 상품 리스트 ── -->
      <section class="section" style="border-bottom: none;">
        <div class="section-header">
          <h2 class="section-title">라이브 혜택 핫딜</h2>
          <a href="#" class="section-more" onclick="showToast('전체 상품입니다.'); return false;">전체보기 ›</a>
        </div>

        <div class="deal-grid" id="deal-products-container">
          <!-- Dynamic Deal Items -->
        </div>
      </section>

    </main>

    <!-- ── 하단 바텀 네비게이션 (깔끔 텍스트) ── -->
    <nav class="bottom-nav">
      <a href="/shop/" class="nav-item">
        <span>홈</span>
      </a>
      <a href="/shop/" class="nav-item active">
        <span>라이브</span>
      </a>
      <a href="#" class="nav-item" onclick="showToast('카테고리 메뉴입니다.'); return false;">
        <span>카테고리</span>
      </a>
      <a href="/admin" class="nav-item">
        <span>MY / 어드민</span>
      </a>
    </nav>

  </div>

  <!-- ── VOD / 라이브 재생 모달 ── -->
  <div class="modal-overlay" id="video-modal">
    <div class="modal-content">
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      <iframe id="modal-player-iframe" class="modal-iframe" src="about:blank" allow="autoplay; fullscreen"></iframe>
    </div>
  </div>

  <!-- ── 깔끔 토스트 ── -->
  <div class="toast" id="toast-msg">
    <span id="toast-text">알림 내용</span>
  </div>

  <!-- ── 로직 ── -->
  <script>
    const HERO_LIVES = [
      {
        id: 'live_demo_1',
        title: '에이피뷰티 에어리 선 세럼 X RYZIN',

        time: '07.24 (금) 11:00',
        image: 'https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?auto=format&fit=crop&w=600&q=80',

      },
      {

        time: '07.24 (금) 15:00',
        image: 'https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=600&q=80',
        isLive: false,
        viewers: '0'
      },
      {
        id: 'live_demo_4',

    function showToast(msg) {
      const toast = document.getElementById('toast-msg');
      const toastText = document.getElementById('toast-text');
      toastText.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    function toggleNotify(btn, title) {
      btn.classList.toggle('subscribed');
      if (btn.classList.contains('subscribed')) {
        btn.textContent = '알림신청 완료';
        showToast(`방송 알림이 신청되었습니다.`);
      } else {
        btn.textContent = '알림신청';
        showToast('알림 신청이 해제되었습니다.');
      }
    }

    function openLiveModal(liveId) {
      const modal = document.getElementById('video-modal');
      const iframe = document.getElementById('modal-player-iframe');
      const isLocal = window.location.origin.includes('localhost:5173');
      const baseUrl = isLocal ? 'http://localhost:8080/live/' : '/live/';
      iframe.src = `${baseUrl}?id=${liveId}`;
      modal.classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('video-modal');
      const iframe = document.getElementById('modal-player-iframe');
      iframe.src = 'about:blank';
      modal.classList.remove('active');
    }

    async function initShopPage() {
      let remoteLives = [];
      if (typeof window.supabaseClient !== 'undefined' && window.supabaseClient) {
        try {
          const { data, error } = await window.supabaseClient
            .from('live_control')
            .select('*')
            .order('updated_at', { ascending: false });
          if (!error && data && data.length > 0) {
            remoteLives = data;
          }
        } catch (e) {
          console.warn('Supabase fetch failed:', e);
        }
      }

      const heroContainer = document.getElementById('hero-live-carousel');
      let heroHtml = '';

      if (remoteLives.length > 0) {
        remoteLives.forEach(row => {
          const isLive = row.status === 'ON';
          const bgImg = row.profile_image ? row.profile_image.replace('#nosplash', '') : 'https://images.unsplash.com/photo-1608248597263-00079e965874?auto=format&fit=crop&w=600&q=80';
          const title = row.title || '라이브 방송';
          const timeBadge = isLive ? '<span class="badge-onair"><span class="dot-red"></span>ON AIR</span>' : `<span>${row.start_time ? new Date(row.start_time).toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'}) : '방송 준비 중'}</span>`;
          
          heroHtml += `
            <div class="live-card-hero" onclick="openLiveModal('${row.live_id}')">
              <img class="hero-bg" src="${bgImg}" alt="${title}">
              <div class="hero-overlay">
                <div class="hero-top-badge ${isLive ? 'badge-onair' : ''}">
                  ${timeBadge}
                </div>
                <div class="hero-bottom-info">
                  <div class="hero-brand-title">${title}</div>
                  <button class="hero-action-btn" onclick="event.stopPropagation(); ${isLive ? `openLiveModal('${row.live_id}')` : `toggleNotify(this, '${title}')`}">
                    ${isLive ? '라이브 시청하기' : '알림신청'}
                  </button>
                </div>
              </div>
            </div>
          `;
        });
      }

      HERO_LIVES.forEach(item => {
        heroHtml += `
          <div class="live-card-hero" onclick="openLiveModal('${item.id}')">
            <img class="hero-bg" src="${item.image}" alt="${item.title}">
            <div class="hero-overlay">
              <div class="hero-top-badge ${item.isLive ? 'badge-onair' : ''}">
                ${item.isLive ? '<span class="dot-red"></span>ON AIR' : item.time}
              </div>
              <div class="hero-bottom-info">
                <div class="hero-brand-title">${item.title}</div>
                <button class="hero-action-btn" onclick="event.stopPropagation(); ${item.isLive ? `openLiveModal('${item.id}')` : `toggleNotify(this, '${item.title}')`}">
                  ${item.isLive ? '라이브 시청하기' : '알림신청'}
                </button>
              </div>
            </div>
          </div>
        `;
      });
      heroContainer.innerHTML = heroHtml;

      renderVodCards(VOD_REPLAYS);

      const dealContainer = document.getElementById('deal-products-container');
      dealContainer.innerHTML = DEAL_PRODUCTS.map(p => `
        <div class="deal-item" onclick="showToast('${p.title} 상품 페이지로 이동합니다.')">
          <div class="deal-img-box">
            <img src="${p.image}" alt="${p.title}">
            <span class="deal-discount-badge">${p.discount}</span>
          </div>
          <div class="deal-info">
            <span class="deal-brand">${p.brand}</span>
            <div class="deal-title">${p.title}</div>
            <div class="deal-price-box">
              <span class="deal-price">${p.price}</span>
              <span class="deal-origin-price">${p.originPrice}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderVodCards(list) {
      const vodContainer = document.getElementById('vod-cards-container');
      vodContainer.innerHTML = list.map(item => `
        <div class="vod-card" onclick="openLiveModal('${item.id}')">
          <div class="vod-thumb-box">
            <img class="thumb-img" src="${item.bgImage}" alt="${item.title}">
            <div class="vod-top-info">
              <span class="badge-vod">VOD</span>
              <span class="vod-views">${item.views}</span>
            </div>
            <!-- 카드 하단 수평 상품 칩 (이미지 1 참조) -->
            <div class="vod-product-chip">
              <img src="${item.product.image}" alt="${item.product.name}">
              <div class="vod-product-details">
                <div class="vod-product-name">${item.product.name}</div>
                <div class="vod-product-price">${item.product.price}</div>
              </div>
            </div>
          </div>
          <div class="vod-card-title">${item.title}</div>
        </div>
      `).join('');
    }

    function filterVod(tag, btn) {
      document.querySelectorAll('.pill-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (tag === 'all') {
        renderVodCards(VOD_REPLAYS);
      } else {
        const filtered = VOD_REPLAYS.filter(v => v.tag === tag);
        renderVodCards(filtered.length > 0 ? filtered : VOD_REPLAYS);
      }
    }

    document.addEventListener('DOMContentLoaded', initShopPage);
