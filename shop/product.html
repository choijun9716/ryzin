<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>상품 상세 — RYZIN SHOP</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/supabase_config.js"></script>

  <style>
    :root {
      --bg: #0c0d10;
      --surface: #14151a;
      --surface-card: #1c1d24;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent: #ffffff;
      --accent-highlight: #FF8730;
      --border: #232530;
      --chip-dark: #22232a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000000;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: var(--bg);
      min-height: 100vh;
      padding-bottom: 110px;
      position: relative;
    }

    /* ── 상단 프로스테드 글래스 네비게이션 ── */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 200;
      height: 52px;
      background: rgba(12, 13, 16, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tb-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .tb-icon-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .tb-icon-btn svg {
      width: 18px;
      height: 18px;
      stroke: #ffffff;
      stroke-width: 2.2;
      fill: none;
    }

    .tb-icons { display: flex; gap: 8px; }

    /* ── 상품 이미지 갤러리 ── */
    .gallery {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #16171d;
      overflow: hidden;
    }

    .gallery-slides {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .gallery-slides::-webkit-scrollbar { display: none; }

    .gallery-slide {
      flex: 0 0 100%;
      scroll-snap-align: start;
    }

    .gallery-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-count {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(12, 13, 16, 0.75);
      backdrop-filter: blur(10px);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    /* ── 미니멀 상품 기본 정보 ── */
    .product-info {
      padding: 20px 18px;
      border-bottom: 8px solid #000000;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .brand-name {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-sub);
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }

    .wish-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.2s;
    }

    .wish-btn.active svg {
      fill: var(--accent-highlight);
      stroke: var(--accent-highlight);
    }

    .wish-btn svg {
      width: 14px;
      height: 14px;
      stroke: #ffffff;
      stroke-width: 2.2;
      fill: none;
    }

    .product-name {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .product-sub {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 16px;
      font-weight: 500;
    }

    /* MD 추천 코멘트 카드 */
    .md-pick-box {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .md-pick-badge {
      background: #ffffff;
      color: #000000;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 7px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .md-pick-text {
      font-size: 12.5px;
      color: rgba(255,255,255,0.9);
      font-weight: 600;
      line-height: 1.3;
    }

    /* 가격 블록 */
    .price-block {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 16px;
    }

    .discount-rate {
      font-size: 26px;
      font-weight: 900;
      color: var(--accent-highlight);
      letter-spacing: -0.03em;
    }

    .sale-price {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.03em;
    }

    .origin-price {
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: line-through;
      font-weight: 500;
      margin-left: 4px;
    }

    /* 평점 및 리뷰 */
    .rating-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-sub);
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .star-icon { color: #fbbf24; font-size: 14px; }

    /* ── 미니멀 옵션 & 수량 선택 ── */
    .options-section {
      padding: 20px 18px;
      border-bottom: 8px solid #000000;
    }

    .sec-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .option-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-card);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .option-item.selected {
      border-color: #ffffff;
      background: #232530;
    }

    .option-title { font-size: 13.5px; font-weight: 700; color: #fff; }
    .option-val { font-size: 13.5px; font-weight: 800; color: #fff; }

    /* 수량 조절 */
    .qty-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .qty-control {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface-card);
    }

    .qty-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .qty-num {
      width: 38px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      line-height: 34px;
    }

    /* ── 상세 정보 탭 ── */
    .detail-section {
      padding: 24px 18px;
    }

    .detail-img-box {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      margin-top: 16px;
      border: 1px solid var(--border);
    }
    .detail-img-box img {
      width: 100%;
      display: block;
    }

    /* ── 하단 플로팅 구매 바 ── */
    .bottom-cta-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: rgba(12, 13, 16, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      z-index: 300;
      display: flex;
      gap: 10px;
    }

    .cta-cart-btn {
      flex: 1;
      height: 48px;
      border-radius: 12px;
      background: var(--surface-card);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .cta-buy-btn {
      flex: 2;
      height: 48px;
      border-radius: 12px;
      background: #ffffff;
      border: none;
      color: #000000;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .cta-buy-btn:active {
      opacity: 0.9;
    }

    /* 토스트 메시지 */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(30,41,59,0.95);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      z-index: 999;
      transition: transform 0.3s ease;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>

<body>
<div class="app">

  <!-- ── 상단 네비 ── -->
  <nav class="top-bar">
    <button class="tb-icon-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="tb-icons">
      <button class="tb-icon-btn" onclick="copyLink()">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
      </button>
      <button class="tb-icon-btn" onclick="window.location.href='/shop/cart.html'">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
      </button>
    </div>
  </nav>

  <!-- ── 이미지 갤러리 ── -->
  <div class="gallery">
    <div class="gallery-slides" id="gallery-slides">
      <div class="gallery-slide">
        <img id="p-main-img" src="https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=800&q=85" alt="상품 메인 이미지">
      </div>
    </div>
    <div class="gallery-count">1 / 1</div>
  </div>

  <!-- ── 상품 정보 ── -->
  <div class="product-info">
    <div class="brand-row">
      <span class="brand-name" id="p-brand">RYZIN LUXURY</span>
      <button class="wish-btn" id="wish-btn" onclick="toggleWish(this)">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span>좋아요</span>
      </button>
    </div>

    <h1 class="product-name" id="p-title">프리미엄 뷰티 세럼 컬렉션</h1>
    <p class="product-sub" id="p-sub">피부 본연의 빛을 되찾아주는 수분 광채 솔루션</p>

    <!-- MD 한마디 추천 -->
    <div class="md-pick-box" id="md-box">
      <span class="md-pick-badge">MD PICK</span>
      <span class="md-pick-text" id="p-md-comment">MD 강력 추천! 뷰티 어워드 1위 선정 상품</span>
    </div>

    <!-- 가격 -->
    <div class="price-block">
      <span class="discount-rate" id="p-discount">50%</span>
      <div>
        <span class="sale-price" id="p-sale">49,000원</span>
        <span class="origin-price" id="p-origin">98,000원</span>
      </div>
    </div>

    <!-- 평점 -->
    <div class="rating-row">
      <span class="star-icon">★</span>
      <span style="font-weight:800; color:#fff;" id="p-rating">4.9</span>
      <span id="p-reviews">(리뷰 428개)</span>
      <span style="margin-left:auto; color:#2563eb; font-weight:700;">무료배송 보장</span>
    </div>
  </div>

  <!-- ── 옵션 & 수량 ── -->
  <div class="options-section">
    <div class="sec-label">상품 옵션 선택</div>
    <div class="option-item selected">
      <div>
        <div class="option-title" id="opt-title">단품 기본 세트</div>
        <div style="font-size:11.5px; color:var(--text-sub); margin-top:2px;">단독 특가 할인가 적용</div>
      </div>
      <div class="option-val" id="opt-price">49,000원</div>
    </div>

    <div class="qty-row">
      <span style="font-size:14px; font-weight:700;">구매 수량</span>
      <div class="qty-control">
        <button class="qty-btn" onclick="changeQty(-1)">-</button>
        <div class="qty-num" id="qty-count">1</div>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>
  </div>

  <!-- ── 상세 스펙 ── -->
  <div class="detail-section">
    <div class="sec-label">상품 상세 설명</div>
    <p style="font-size:13.5px; color:var(--text-sub); line-height:1.6; font-weight:500;">
      RYZIN 엄선 큐레이션으로 제공되는 단독 특가 상품입니다.<br>
      피부 자극 테스트 완료, 100% 정품 보장 및 당일 출고 서비스를 지원합니다.
    </p>
    <div class="detail-img-box">
      <img id="p-detail-img" src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=800&q=85" alt="상세 설명">
    </div>
  </div>

  <!-- ── 하단 플로팅 구매 바 ── -->
  <div class="bottom-cta-bar">
    <button class="cta-cart-btn" onclick="addToCart()">장바구니 담기</button>
    <button class="cta-buy-btn" onclick="buyNow()">지금 바로 구매</button>
  </div>

  <!-- 토스트 -->
  <div id="toast"></div>

</div>

<script>
  const SB_URL = 'https://vybrnhyaeugfwezbygdt.supabase.co';
  const SB_KEY = 'sb_publishable_FxH6HGkUaKfcJD9by_TLFQ_0PJk80J9';
  const SB_H = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` };

  let currentQty = 1;
  let currentProduct = null;

  async function sbGet(table, params = '') {
    try {
      const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, { headers: SB_H });
      return r.ok ? r.json() : [];
    } catch { return []; }
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = msg;
    toast.style.transform = 'translateX(-50%) translateY(0)';
    setTimeout(() => {
      toast.style.transform = 'translateX(-50%) translateY(-100px)';
    }, 2200);
  }

  function copyLink() {
    navigator.clipboard.writeText(window.location.href);
    showToast('상품 링크가 복사되었습니다.');
  }

  function toggleWish(btn) {
    btn.classList.toggle('active');
    if (btn.classList.contains('active')) {
      showToast('위시리스트에 담겼습니다.');
    } else {
      showToast('위시리스트에서 제외되었습니다.');
    }
  }

  function changeQty(delta) {
    currentQty = Math.max(1, currentQty + delta);
    document.getElementById('qty-count').textContent = currentQty;
  }

  function addToCart() {
    showToast(`장바구니에 ${currentQty}개 담겼습니다.`);
  }

  function buyNow() {
    alert(`[${currentProduct ? (currentProduct.product_title || currentProduct.brand_title) : '상품'}] 구매 수량 ${currentQty}개 결제 페이지로 이동합니다.`);
  }

  async function loadProductDetail() {
    const params = new URLSearchParams(window.location.search);
    const prodId = params.get('id');

    let prod = null;
    if (prodId) {
      const dbRes = await sbGet('shop_products', `select=*&id=eq.${prodId}`);
      if (dbRes && dbRes.length) {
        prod = dbRes[0];
      } else {
        const pCodeRes = await sbGet('shop_products', `select=*&product_code=eq.${prodId}`);
        if (pCodeRes && pCodeRes.length) prod = pCodeRes[0];
      }
    }

    if (!prod) {
      prod = {
        brand_name: '설화수',
        product_title: '자음수 리미티드 90ml 세트',
        brand_title: '설화수 자음수 리미티드 90ml 세트',
        sale_price: '49,000원',
        origin_price: '98,000원',
        discount: '50% OFF',
        rating: '4.9',
        reviews: '428',
        md_comment: 'MD 강력 추천! 자음수 단독 한정 기획세트',
        img_url: 'https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=800&q=85'
      };
    }

    currentProduct = prod;

    let bName = prod.brand_name || '';
    let pTitle = prod.product_title || '';
    if (!bName && prod.brand_title) {
      const parts = prod.brand_title.split(' ');
      if (parts.length > 1) {
        bName = parts[0];
        pTitle = parts.slice(1).join(' ');
      } else {
        pTitle = prod.brand_title;
      }
    }

    document.getElementById('p-main-img').src = prod.img_url || 'https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=800&q=85';
    document.getElementById('p-detail-img').src = prod.img_url || 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=800&q=85';
    
    document.getElementById('p-brand').textContent = bName || 'RYZIN SELECT';
    document.getElementById('p-title').textContent = pTitle || prod.brand_title;
    document.getElementById('p-sub').textContent = `${bName || 'RYZIN'} 공식 인증 단독 혜택가`;
    
    document.getElementById('p-discount').textContent = prod.discount || '특가';
    document.getElementById('p-sale').textContent = prod.sale_price || '';
    document.getElementById('p-origin').textContent = prod.origin_price || '';
    document.getElementById('opt-price').textContent = prod.sale_price || '';
    document.getElementById('opt-title').textContent = `${pTitle || '단품 세트'}`;

    if (prod.md_comment) {
      document.getElementById('p-md-comment').textContent = prod.md_comment;
    }

    if (prod.rating) {
      document.getElementById('p-rating').textContent = prod.rating;
    }
    if (prod.reviews) {
      document.getElementById('p-reviews').textContent = `(리뷰 ${prod.reviews}개)`;
    }
  }

  document.addEventListener('DOMContentLoaded', loadProductDetail);
</script>
</body>
</html>
