<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>장바구니 — RYZIN SHOP</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c0d10;
      --surface: #14151a;
      --surface-card: #1c1d24;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #3b82f6;
      --accent-orange: #FF8730;
      --border: #232530;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000000;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding-bottom: 120px;
      position: relative;
    }

    /* ── HEADER ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 200;
      height: 52px;
      background: rgba(12, 13, 16, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tb-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tb-icon-btn svg {
      width: 18px;
      height: 18px;
      stroke: #ffffff;
      stroke-width: 2;
      fill: none;
    }

    .hdr-title {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
    }

    /* ── SUB TABS ── */
    .cart-sub-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .cart-sub-tab {
      flex: 1;
      text-align: center;
      padding: 14px 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      position: relative;
    }

    .cart-sub-tab.active {
      color: #ffffff;
      font-weight: 800;
    }

    .cart-sub-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 15%;
      width: 70%;
      height: 2px;
      background: #ffffff;
    }

    /* ── CONTENT AREA ── */
    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 1. 전체선택 & 선택삭제 행 */
    .select-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .check-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
    }

    .custom-check {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .custom-check.checked {
      background: var(--accent-orange);
      border-color: var(--accent-orange);
    }

    .custom-check svg {
      width: 13px; height: 13px; stroke: #fff; stroke-width: 3; fill: none; display: none;
    }

    .custom-check.checked svg {
      display: block;
    }

    .del-btn {
      padding: 5px 12px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 2. 장바구니 상품 리스트 */
    .cart-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .cart-item-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .item-top {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      align-items: flex-start;
    }

    .item-img {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      object-fit: cover;
      background: #1e2028;
      flex-shrink: 0;
    }

    .item-info { flex: 1; }

    .item-brand {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .item-name {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .item-price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .item-price {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
    }

    .item-origin {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    /* 수량 컨트롤러 */
    .item-bottom {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 12px;
    }

    .qty-control {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255,255,255,0.04);
    }

    .qty-btn {
      width: 32px; height: 32px;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .qty-num {
      width: 36px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      line-height: 32px;
    }

    .item-calc-box {
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      padding: 10px 14px;
      text-align: center;
      font-size: 12.5px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .item-calc-box strong {
      font-size: 14px;
      font-weight: 900;
      color: #ffffff;
      margin-left: 4px;
    }

    /* 3. 영수증 결제 금액 요약 카드 */
    .receipt-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 16px;
    }

    .receipt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .receipt-row.highlight .val {
      color: var(--accent-orange);
      font-weight: 800;
    }

    .receipt-divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 14px 0;
    }

    .receipt-total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .receipt-total-row .label {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
    }

    .receipt-total-row .val {
      font-size: 20px;
      font-weight: 900;
      color: var(--accent-orange);
    }

    .receipt-tip {
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 4. 멤버십 비교 칩 */
    .mem-compare-wrap {
      position: relative;
      margin-top: 6px;
    }

    .mem-tooltip {
      position: absolute;
      top: -24px;
      left: 12px;
      background: #334155;
      color: #ffffff;
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
    }

    .mem-compare-box {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;
      gap: 4px;
    }

    .mem-comp-col {
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .mem-comp-col.active {
      background: rgba(255, 135, 48, 0.12);
      border: 1px solid rgba(255, 135, 48, 0.4);
    }

    .mem-comp-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-orange);
      margin-bottom: 2px;
    }

    .mem-comp-price {
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
    }

    /* ── FLOATING TRANSLUCENT APPLE UI BOTTOM NAV (MASTER UNIFIED SPEC) ── */
    .bottom-nav-wrap {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 390px;
      z-index: 400;
    }

    .bottom-nav {
      width: 100%;
      height: 64px;
      border-radius: 40px;
      background: rgba(22, 23, 28, 0.78);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.45);
      text-decoration: none;
      position: relative;
      transition: color 0.15s;
      flex: 1;
      height: 100%;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .nav-item span {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .nav-item.active {
      color: var(--accent-orange);
    }

    .nav-badge-count {
      position: absolute;
      top: 4px;
      right: 12px;
      background: var(--accent-orange);
      color: #ffffff;
      font-size: 9px;
      font-weight: 900;
      min-width: 15px;
      height: 15px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
    }

    /* ── 하단 고정 CTA 버튼 ── */
    .bottom-cta-wrap {
      position: fixed;
      bottom: calc(92px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      padding: 0 16px;
      z-index: 300;
    }

    .cta-pay-btn {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      background: var(--accent-orange);
      border: none;
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 135, 48, 0.4);
    }
    }

    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(30,41,59,0.95);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      z-index: 999;
      transition: transform 0.3s ease;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>

<body>
<div class="app">

  <!-- ── 헤더 ── -->
  <header class="header">
    <button class="tb-icon-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="hdr-title">장바구니</div>
    <button class="tb-icon-btn" onclick="window.location.href='/shop/index.html'">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
    </button>
  </header>

  <!-- ── 3종 서브 탭 ── -->
  <div class="cart-sub-tabs">
    <div class="cart-sub-tab active">담은 상품</div>
  </div>

  <!-- ── 바디 영역 ── -->
  <div class="content">

    <!-- 1. 전체선택 / 선택삭제 -->
    <div class="select-bar">
      <div class="check-wrap" onclick="toggleSelectAllItems()">
        <div class="custom-check checked" id="all-check-box">
          <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
        </div>
        <span>전체선택</span>
      </div>
      <button class="del-btn" onclick="deleteSelected()">선택삭제</button>
    </div>

    <!-- 2. 동적 장바구니 상품 리스트 -->
    <div class="cart-list" id="cart-item-list">
      <!-- JS Rendered -->
    </div>

    <!-- 3. 결제 예상 금액 영수증 카드 -->
    <div class="receipt-card">
      <div class="receipt-row">
        <span>선택 상품 금액</span>
        <span id="rc-origin">0원</span>
      </div>
      <div class="receipt-row highlight">
        <span>할인 예상 금액</span>
        <span id="rc-discount">- 0원</span>
      </div>
      <div class="receipt-row">
        <span>배송비</span>
        <span id="rc-shipping">+ 3,000원</span>
      </div>
      
      <div class="receipt-divider"></div>

      <div class="receipt-total-row">
        <span class="label">예상 결제 금액</span>
        <span class="val" id="total-val">0원</span>
      </div>

      <div class="receipt-tip">
        쿠폰/포인트는 결제 페이지에서 사용할 수 있어요
      </div>
    </div>

    <!-- 4. 멤버십 회원이용 토글 카드 -->
    <div class="mem-compare-wrap">
      <div class="mem-tooltip">100원으로 이용 가능 ?</div>
      <div class="mem-compare-box">
        <div class="mem-comp-col active">
          <div class="mem-comp-label">멤버십 회원가</div>
          <div class="mem-comp-price" id="mem-price">0원</div>
        </div>
        <div class="mem-comp-col">
          <div class="mem-comp-label" style="color:var(--text-muted);">일반가</div>
          <div class="mem-comp-price" id="normal-price" style="color:var(--text-sub);">0원</div>
        </div>
      </div>
    </div>

  </div>

  <!-- ── 하단 결제 CTA 버튼 ── -->
  <div class="bottom-cta-wrap">
    <button class="cta-pay-btn" id="pay-btn" onclick="doCheckout()">0원 결제하기</button>
  </div>

  <!-- ── FLOATING TRANSLUCENT APPLE UI BOTTOM NAV ── -->
  <div class="bottom-nav-wrap">
    <nav class="bottom-nav">
      <div class="nav-item" onclick="window.location.href='/shop/index.html'">
        <svg viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h14v-8h3L12 3z"/></svg>
        <span>홈</span>
      </div>
      <div class="nav-item" onclick="window.location.href='/shop/live_teaser.html'">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        <span>라이브</span>
      </div>
      <div class="nav-item" onclick="window.location.href='/shop/group_buy.html'">
        <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        <span>공동구매</span>
      </div>
      <div class="nav-item active" onclick="window.location.href='/shop/cart.html'">
        <span class="nav-badge-count">2</span>
        <svg viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h6v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/></svg>
        <span>장바구니</span>
      </div>
      <div class="nav-item" onclick="window.location.href='/shop/profile.html'">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>내정보</span>
      </div>
    </nav>
  </div>

  <!-- 토스트 -->
  <div id="toast"></div>

</div>

<script type="module">
  import { 
    getCartItems, 
    updateCartQty, 
    toggleCartSelect, 
    toggleAllCartSelect, 
    deleteCartItem, 
    deleteSelectedCartItems,
    updateGlobalCartBadge
  } from './user_store.js';

  let cartData = [];

  function showToast(msg) {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = msg;
    toast.style.transform = 'translateX(-50%) translateY(0)';
    setTimeout(() => {
      toast.style.transform = 'translateX(-50%) translateY(-100px)';
    }, 2200);
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function updateGlobalCartBadge() {
    const badge = document.getElementById('cart-badge');
    if (!badge) return;
    const count = cartData.length;
    badge.textContent = count;
    badge.style.display = count > 0 ? 'flex' : 'none';
  }

  async function loadCart() {
    cartData = await getCartItems();
    renderCartList();
  }

  function renderCartList() {
    const container = document.getElementById('cart-items-container');
    const ctaWrap = document.querySelector('.bottom-cta-wrap');

    if (!cartData || cartData.length === 0) {
      container.innerHTML = `
        <div style="text-align:center; padding:60px 20px 40px; background:var(--surface-card); border-radius:18px; border:1px solid var(--border); margin-bottom:20px;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" style="margin-bottom:16px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z"/>
          </svg>
          <div style="font-size:16px; font-weight:800; color:#fff; margin-bottom:6px;">장바구니에 담긴 상품이 없습니다</div>
          <div style="font-size:13px; color:var(--text-sub); margin-bottom:24px;">RYZIN만의 단독 기획 특가 상품을 만나보세요!</div>
          <button onclick="window.location.href='/shop/index.html'" style="padding:12px 24px; background:var(--accent-orange); color:#fff; border:none; border-radius:24px; font-size:14px; font-weight:800; cursor:pointer;">인기 상품 둘러보기</button>
        </div>
      `;
      if (ctaWrap) ctaWrap.style.display = 'none';
      recalcSummary();
      updateGlobalCartBadge();
      return;
    }

    if (ctaWrap) ctaWrap.style.display = 'block';

    container.innerHTML = cartData.map(item => {
      const isChecked = item.selected !== false;
      const originP = item.origin_price || (item.price * 2);
      const totalP = (item.price * item.qty) + (isChecked ? 3000 : 0);

      return `
        <div class="cart-item-card" id="card-${item.id}">
          <div class="item-top">
            <div class="custom-check ${isChecked ? 'checked' : ''}" onclick="toggleItemSelect('${item.id}')" style="margin-top:2px; flex-shrink:0;">
              <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
            </div>
            <img class="item-img" src="${item.img_url}" alt="${esc(item.product_name)}">
            <div class="item-info">
              <div class="item-brand">${esc(item.brand_name || 'RYZIN')}</div>
              <div class="item-name">${esc(item.product_name)}</div>
              <div class="item-price-row">
                <span class="item-price">${item.price.toLocaleString()}원</span>
                ${originP ? `<span class="item-origin">${originP.toLocaleString()}원</span>` : ''}
              </div>
            </div>
            <button onclick="removeItem('${item.id}')" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:16px;">&times;</button>
          </div>
          <div class="item-bottom">
            <div class="qty-control">
              <button class="qty-btn" onclick="changeQty('${item.id}', -1)">-</button>
              <div class="qty-num">${item.qty}</div>
              <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
            </div>
          </div>
          <div class="item-calc-box">
            상품 ${(item.price * item.qty).toLocaleString()}원 + 배송비 ${isChecked ? '3,000원' : '0원'} = <strong>${totalP.toLocaleString()}원</strong>
          </div>
        </div>
      `;
    }).join('');

    recalcSummary();
    updateGlobalCartBadge();
  }

  window.toggleItemSelect = async (id) => {
    const item = cartData.find(x => x.id === id);
    if (!item) return;
    item.selected = !item.selected;
    await toggleCartSelect(id, item.selected);
    renderCartList();
  };

  window.toggleSelectAllItems = async () => {
    const allChecked = cartData.every(x => x.selected !== false);
    const nextState = !allChecked;
    cartData.forEach(x => x.selected = nextState);
    
    document.getElementById('all-check-box').classList.toggle('checked', nextState);
    await toggleAllCartSelect(nextState);
    renderCartList();
  };

  window.changeQty = async (id, delta) => {
    const item = cartData.find(x => x.id === id);
    if (!item) return;
    item.qty = Math.max(1, item.qty + delta);
    await updateCartQty(id, item.qty);
    renderCartList();
  };

  window.removeItem = async (id) => {
    cartData = cartData.filter(x => x.id !== id);
    await deleteCartItem(id);
    showToast('상품이 장바구니에서 삭제되었습니다.');
    renderCartList();
    await updateGlobalCartBadge();
  };

  window.deleteSelected = async () => {
    const selectedIds = cartData.filter(x => x.selected !== false).map(x => x.id);
    if (!selectedIds.length) {
      showToast('선택된 상품이 없습니다.');
      return;
    }
    cartData = cartData.filter(x => x.selected === false);
    await deleteSelectedCartItems(selectedIds);
    showToast('선택한 상품이 삭제되었습니다.');
    renderCartList();
  };

  function recalcSummary() {
    const selectedItems = cartData.filter(x => x.selected !== false);
    let rawOriginSum = 0;
    let saleSum = 0;

    selectedItems.forEach(item => {
      const orig = item.origin_price || (item.price * 2);
      rawOriginSum += (orig * item.qty);
      saleSum += (item.price * item.qty);
    });

    const shipping = selectedItems.length ? 3000 : 0;
    const discount = Math.max(0, rawOriginSum - saleSum);
    const finalTotal = saleSum + shipping;
    const normalTotal = rawOriginSum + shipping;

    document.getElementById('rc-origin').textContent = rawOriginSum.toLocaleString() + '원';
    document.getElementById('rc-discount').textContent = '- ' + discount.toLocaleString() + '원';
    document.getElementById('rc-shipping').textContent = '+ ' + shipping.toLocaleString() + '원';
    document.getElementById('total-val').textContent = finalTotal.toLocaleString() + '원';
    document.getElementById('mem-price').textContent = finalTotal.toLocaleString() + '원';
    document.getElementById('normal-price').textContent = normalTotal.toLocaleString() + '원';

    document.getElementById('pay-btn').textContent = `${finalTotal.toLocaleString()}원 결제하기`;
    document.getElementById('all-check-box').classList.toggle('checked', cartData.length > 0 && cartData.every(x => x.selected !== false));
  }

  window.doCheckout = () => {
    const total = document.getElementById('total-val').textContent;
    alert(`총 ${total} 결제 창으로 이동합니다.`);
  };

  document.addEventListener('DOMContentLoaded', loadCart);
</script>
</body>
</html>
