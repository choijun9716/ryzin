<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>내 정보 — RYZIN SHOP</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c0d10;
      --surface: #14151a;
      --surface-card: #1c1d24;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #2563eb;
      --accent-orange: #FF8730;
      --border: #232530;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000000;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding-bottom: 100px;
      position: relative;
    }

    /* ── HEADER ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 200;
      height: 52px;
      background: rgba(12, 13, 16, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hdr-user-title {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
    }

    .hdr-right { display: flex; gap: 8px; }

    .tb-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .tb-icon-btn svg {
      width: 18px;
      height: 18px;
      stroke: #ffffff;
      stroke-width: 1.6;
      fill: none;
    }

    .nav-badge-count {
      position: absolute;
      top: 4px; right: 4px;
      background: #ef4444;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      width: 15px; height: 15px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── BODY CONTENT ── */
    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 1. 멤버십 절약 안내 블루 배너 (첨부 1번 스크린샷 100% 매칭) */
    .membership-banner {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
    }

    .membership-banner-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .mem-badge {
      background: #ffffff;
      color: #2563eb;
      font-size: 11px;
      font-weight: 900;
      width: 22px; height: 22px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }

    /* 2. 주문/리뷰/관심상품 3종 퀵 카드 + 포인트/쿠폰 */
    .profile-main-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 16px 14px;
    }

    .quick-3-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .quick-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .quick-item svg {
      width: 22px; height: 22px;
      stroke: #ffffff;
      stroke-width: 1.6;
      fill: none;
    }

    .quick-item span {
      font-size: 12.5px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
    }

    .point-coupon-row {
      display: flex;
      align-items: center;
      padding-top: 14px;
    }

    .pc-col {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      cursor: pointer;
    }

    .pc-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .pc-val {
      font-size: 13.5px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .pc-divider {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,0.1);
    }

    /* 3. 메뉴 리스트 그룹 카드 */
    .menu-group-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .menu-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: background 0.15s;
    }
    .menu-row:last-child { border-bottom: none; }
    .menu-row:active { background: rgba(255,255,255,0.05); }

    .menu-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .menu-left svg {
      width: 18px;
      height: 18px;
      stroke: var(--text-sub);
      stroke-width: 1.8;
      fill: none;
    }

    .chevron svg {
      width: 16px; height: 16px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
    }

    /* 토스트 */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(30,41,59,0.95);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      z-index: 999;
      transition: transform 0.3s ease;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>

<body>
<div class="app">

  <!-- ── 상단 헤더 ── -->
  <header class="header">
    <div class="hdr-user-title" onclick="showToast('프로필 정보 설정')">
      <span>채이준님</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
    </div>
    <div class="hdr-right">
      <button class="tb-icon-btn" onclick="showToast('검색 화면으로 이동합니다.')">
        <svg viewBox="0 0 24 24"><path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
      </button>
      <button class="tb-icon-btn" onclick="window.location.href='/shop/cart.html'">
        <span class="nav-badge-count">2</span>
        <svg viewBox="0 0 24 24"><path d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z"/></svg>
      </button>
    </div>
  </header>

  <!-- ── 바디 영역 ── -->
  <div class="content">

    <!-- 1. 멤버십 절약 배너 -->
    <div class="membership-banner" onclick="showToast('멤버십 혜택 페이지로 이동합니다.')">
      <div class="membership-banner-left">
        <span class="mem-badge">W</span>
        <span>멤버 회원은 평균 월 8만원 이상 절약 중이에요</span>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <!-- 2. 주요 3종 퀵 카드 + 포인트/쿠폰 -->
    <div class="profile-main-card">
      <div class="quick-3-grid">
        <div class="quick-item" onclick="showToast('주문·배송 내역 페이지로 이동합니다.')">
          <svg viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span>주문·배송내역</span>
        </div>
        <div class="quick-item" onclick="showToast('나의 작성 리뷰 모아보기')">
          <svg viewBox="0 0 24 24"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          <span>리뷰</span>
        </div>
        <div class="quick-item" onclick="showToast('관심 상품(찜 목록)으로 이동합니다.')">
          <svg viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
          <span>관심 상품</span>
        </div>
      </div>

      <div class="point-coupon-row">
        <div class="pc-col" onclick="showToast('포인트 내역 확인')">
          <span class="pc-label">포인트</span>
          <span class="pc-val">0원 <svg width="12" height="12" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
        <div class="pc-divider"></div>
        <div class="pc-col" onclick="showToast('쿠폰함 확인')">
          <span class="pc-label">쿠폰</span>
          <span class="pc-val">0장 <svg width="12" height="12" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M9 18l6-6-6-6"/></svg></span>
        </div>
      </div>
    </div>

    <!-- 3. 서비스 관리 그룹 1 -->
    <div class="menu-group-card">
      <div class="menu-row" onclick="showToast('배송지 관리 설정')">
        <div class="menu-left">
          <svg viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span>배송지 관리</span>
        </div>
        <div class="chevron"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
      <div class="menu-row" onclick="showToast('결제수단 관리 설정')">
        <div class="menu-left">
          <svg viewBox="0 0 24 24"><path d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span>결제수단 관리</span>
        </div>
        <div class="chevron"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
      <div class="menu-row" onclick="showToast('라이진 멤버십 안내')">
        <div class="menu-left">
          <span style="font-weight:900; font-size:15px; color:#2563eb; width:18px; text-align:center;">W</span>
          <span>와이즐리 멤버십</span>
        </div>
        <div class="chevron"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
    </div>

    <!-- 4. 알림 설정 그룹 2 -->
    <div class="menu-group-card">
      <div class="menu-row" onclick="showToast('재입고·출시 알림 설정')">
        <div class="menu-left">
          <svg viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span>재입고·출시 알림</span>
        </div>
        <div class="chevron"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
      <div class="menu-row" onclick="showToast('알림 설정 페이지')">
        <div class="menu-left">
          <svg viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span>알림 설정</span>
        </div>
        <div class="chevron"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
    </div>

    <!-- 5. 고객센터 그룹 3 -->
    <div class="menu-group-card">
      <div class="menu-row" onclick="showToast('고객센터 연결')">
        <div class="menu-left">
          <svg viewBox="0 0 24 24"><path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
          <span>고객센터</span>
        </div>
        <div class="chevron"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
      <div class="menu-row" onclick="showToast('공지사항 확인')">
        <div class="menu-left">
          <svg viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>공지사항</span>
        </div>
        <div class="chevron"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
    </div>

    <!-- 6. 계정 로그아웃 그룹 4 -->
    <div class="menu-group-card">
      <div class="menu-row" onclick="showToast('로그아웃 되었습니다.')">
        <div class="menu-left">
          <svg viewBox="0 0 24 24"><path d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
          <span style="color:var(--text-sub);">로그아웃</span>
        </div>
      </div>
    </div>

  </div>

  <!-- ── FLOATING TRANSLUCENT APPLE UI BOTTOM NAV ── -->
  <div class="bottom-nav-wrap">
    <nav class="bottom-nav">
      <div class="nav-item" onclick="window.location.href='/shop/index.html'">
        <svg viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h14v-8h3L12 3z"/></svg>
        <span>홈</span>
      </div>
      <div class="nav-item" onclick="window.location.href='/shop/live_teaser.html'">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        <span>라이브</span>
      </div>
      <div class="nav-item" onclick="window.location.href='/shop/group_buy.html'">
        <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        <span>공동구매</span>
      </div>
      <div class="nav-item" onclick="window.location.href='/shop/cart.html'">
        <span class="nav-badge-count">2</span>
        <svg viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h6v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/></svg>
        <span>장바구니</span>
      </div>
      <div class="nav-item active" onclick="window.location.href='/shop/profile.html'">
        <svg viewBox="0 0 24 24"><text x="50%" y="68%" text-anchor="middle" font-size="13" font-weight="800" font-family="'Pretendard', sans-serif" fill="currentColor">MY</text></svg>
        <span>내정보</span>
      </div>
    </nav>
  </div>

  <!-- 토스트 -->
  <div id="toast"></div>

</div>

<script>
  function showToast(msg) {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = msg;
    toast.style.transform = 'translateX(-50%) translateY(0)';
    setTimeout(() => {
      toast.style.transform = 'translateX(-50%) translateY(-100px)';
    }, 2200);
  }
</script>
</body>
</html>
