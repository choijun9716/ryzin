<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>라이진 크리에이터 원데이 클래스 | Ryzin Class</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="누구나 무작정 따라하는 크리에이터 원데이 클래스! 라이진 클래스에서 새로운 크리에이터의 길을 시작하세요.">
  <meta property="og:title" content="라이진 크리에이터 원데이 클래스 | Ryzin Class">
  <meta property="og:description" content="누구나 무작정 따라하는 크리에이터 원데이 클래스! 라이진 클래스에서 새로운 크리에이터의 길을 시작하세요.">
  <meta property="og:image" content="../assets/ryzinclass_banner.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0052ff;
      --primary-hover: #0041cc;
      --accent: #ff2a5f;
      --accent-hover: #e01b4c;
      --bg-dark: #0f172a;
      --bg-light: #f1f5f9;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-light: #f8fafc;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --radius-sm: 8px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --font-primary: 'Inter', 'Noto Sans KR', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-light);
      font-family: var(--font-primary);
      color: var(--text-dark);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Mobile Outer Wrapper: 모바일 전용 뷰 고정 */
    .mobile-wrapper {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: #ffffff;
      box-shadow: 0 0 32px rgba(0, 0, 0, 0.05);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: 84px; /* Sticky Footer Bar Space */
    }

    /* Navigation Header */
    .header-nav {
      position: sticky;
      top: 0;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      width: 100%;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    .nav-logo {
      font-size: 18px;
      font-weight: 900;
      color: var(--primary);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    /* Detail Image Area (본문 전체를 대체하는 통 상세 이미지) */
    .detail-image-container {
      width: 100%;
      flex-grow: 1;
      background-color: #0c152b; /* 배너 이미지 백그라운드 */
    }

    .detail-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Sticky Floating Bar */
    .floating-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #1e293b;
      color: #ffffff;
      z-index: 90;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .floating-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
    }

    .floating-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .floating-dday {
      font-size: 11px;
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .floating-title {
      font-size: 15px;
      font-weight: 700;
    }

    .floating-action-btn {
      background-color: var(--accent);
      color: #ffffff;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .floating-action-btn:hover {
      background-color: var(--accent-hover);
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      align-items: flex-end; /* 모바일형 바텀 시트 연출 */
      justify-content: center;
      z-index: 1000;
    }

    .modal-card {
      background-color: var(--card-bg);
      border-top-left-radius: var(--radius);
      border-top-right-radius: var(--radius);
      max-width: 480px;
      width: 100%;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border-top: 1px solid var(--border);
      animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    @keyframes modalSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .modal-close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .form-select,
    .form-input,
    .form-textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background-color: #f8fafc;
      color: var(--text-dark);
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-select:focus,
    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 82, 255, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* File Input Styling */
    .file-input-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file-input-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #f1f5f9;
      color: #475569;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-input-btn:hover {
      background-color: #e2e8f0;
      border-color: #94a3b8;
    }

    .file-preview {
      display: none;
      width: 100%;
      max-height: 150px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    .modal-footer {
      padding: 16px 20px;
      background-color: #f8fafc;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #334155;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary:disabled {
      background-color: var(--text-muted);
      cursor: not-allowed;
    }

    /* Success Popup */
    .success-popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 1100;
      padding: 20px;
    }

    .success-content {
      background-color: var(--card-bg);
      padding: 28px;
      border-radius: var(--radius);
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }

    .success-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .success-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="mobile-wrapper">
    <!-- Header Nav -->
    <header class="header-nav">
      <a href="#" class="nav-logo">RYZIN CLASS</a>
    </header>

    <!-- Detail Image Area (통 상세 이미지) -->
    <div class="detail-image-container">
      <img src="../assets/ryzinclass_banner.png" alt="크리에이터 원데이 클래스 상세 정보" class="detail-image">
    </div>

    <!-- Sticky Floating Bar -->
    <div class="floating-bar">
      <div class="floating-container">
        <div class="floating-info">
          <span class="floating-dday">마감까지 D-3</span>
          <span class="floating-title">크리에이터 원데이 클래스</span>
        </div>
        <button class="floating-action-btn" id="btnOpenApplyModal">수강신청</button>
      </div>
    </div>
  </div>

  <!-- Application Modal Sheet (Bottom Sheet style for mobile) -->
  <div class="modal-overlay" id="applyModalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">원데이 클래스 수강 신청</h2>
        <button class="modal-close-btn" id="btnCloseApplyModal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="applyForm">
        <div class="modal-body">
          <!-- Class Date -->
          <div class="form-group">
            <label class="form-label" for="classDate">수강 기수 선택</label>
            <select class="form-select" id="classDate" required>
              <option value="" disabled selected>기수 및 일정을 선택해 주세요</option>
              <option value="1기 - 2026년 8월 10일 (월) 19:00">1기 - 2026년 8월 10일 (월) 19:00</option>
              <option value="2기 - 2026년 8월 17일 (월) 19:00">2기 - 2026년 8월 17일 (월) 19:00</option>
              <option value="3기 - 2026년 8월 24일 (월) 19:00">3기 - 2026년 8월 24일 (월) 19:00</option>
              <option value="4기 - 2026년 8월 31일 (월) 19:00">4기 - 2026년 8월 31일 (월) 19:00</option>
            </select>
          </div>

          <!-- Name -->
          <div class="form-group">
            <label class="form-label" for="applicantName">이름</label>
            <input type="text" class="form-input" id="applicantName" placeholder="실명을 입력해 주세요" required>
          </div>

          <!-- Phone -->
          <div class="form-group">
            <label class="form-label" for="applicantPhone">전화번호</label>
            <input type="tel" class="form-input" id="applicantPhone" placeholder="010-0000-0000" maxlength="13" required>
          </div>

          <!-- Reason -->
          <div class="form-group">
            <label class="form-label" for="applyReason">크리에이터가 되고 싶은 이유</label>
            <textarea class="form-textarea" id="applyReason" placeholder="구체적인 이유와 목표를 상세히 적어주세요." required></textarea>
          </div>

          <!-- Photo Attachment -->
          <div class="form-group">
            <label class="form-label">사진 첨부</label>
            <div class="file-input-wrapper">
              <label class="file-input-btn" for="applicantPhotoFile">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <span>사진 선택하기 (선택 사항)</span>
              </label>
              <input type="file" id="applicantPhotoFile" accept="image/*" style="display: none;">
              <img id="photoPreview" class="file-preview" alt="선택된 사진 미리보기">
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btnCancelApply">취소</button>
          <button type="submit" class="btn btn-primary" id="btnSubmit">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">수강 신청 완료</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Success Popup -->
  <div class="success-popup" id="successPopup">
    <div class="success-content">
      <h2 class="success-title">수강신청 완료</h2>
      <p class="success-desc">신청서 작성이 성공적으로 완료되었습니다. 확인 후 곧 연락드리겠습니다.</p>
      <button class="btn btn-primary" style="width: 100%; justify-content: center;" id="btnCloseSuccessPopup">확인</button>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://vybrnhyaeugfwezbygdt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FxH6HGkUaKfcJD9by_TLFQ_0PJk80J9';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Modal Control
    const applyModalOverlay = document.getElementById('applyModalOverlay');
    const btnOpenApplyModal = document.getElementById('btnOpenApplyModal');
    const btnCloseApplyModal = document.getElementById('btnCloseApplyModal');
    const btnCancelApply = document.getElementById('btnCancelApply');
    const phoneInput = document.getElementById('applicantPhone');
    const photoFileInput = document.getElementById('applicantPhotoFile');
    const photoPreview = document.getElementById('photoPreview');

    const openModalFunc = () => {
      applyModalOverlay.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    };

    const closeModalFunc = () => {
      applyModalOverlay.style.display = 'none';
      document.body.style.overflow = '';
    };

    btnOpenApplyModal.addEventListener('click', openModalFunc);
    btnCloseApplyModal.addEventListener('click', closeModalFunc);
    btnCancelApply.addEventListener('click', closeModalFunc);

    applyModalOverlay.addEventListener('click', (e) => {
      if (e.target === applyModalOverlay) closeModalFunc();
    });

    // File Preview Handler
    photoFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          photoPreview.src = event.target.result;
          photoPreview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        photoPreview.src = '';
        photoPreview.style.display = 'none';
      }
    });

    // Phone Auto-hyphen
    phoneInput.addEventListener('input', (e) => {
      let val = e.target.value.replace(/[^0-9]/g, '');
      if (val.length > 3 && val.length <= 7) {
        val = val.slice(0, 3) + '-' + val.slice(3);
      } else if (val.length > 7) {
        val = val.slice(0, 3) + '-' + val.slice(3, 7) + '-' + val.slice(7, 11);
      }
      e.target.value = val;
    });

    // Form Submit
    const form = document.getElementById('applyForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const successPopup = document.getElementById('successPopup');
    const btnCloseSuccessPopup = document.getElementById('btnCloseSuccessPopup');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const classDate = document.getElementById('classDate').value;
      const name = document.getElementById('applicantName').value.trim();
      const phone = phoneInput.value.trim();
      const reason = document.getElementById('applyReason').value.trim();
      const photoFile = photoFileInput.files[0];

      if (!classDate || !name || !phone || !reason) {
        alert('모든 필수 항목을 입력해 주세요.');
        return;
      }

      btnSubmit.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = '제출 중...';

      try {
        let photoUrl = '';

        // 1. Upload Photo File to Supabase Storage if attached
        if (photoFile) {
          const fileExt = photoFile.name.split('.').pop();
          // Clean file name
          const cleanFileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
          const filePath = `${cleanFileName}`;

          const { data: uploadData, error: uploadError } = await supabaseClient
            .storage
            .from('class_applications')
            .upload(filePath, photoFile);

          if (uploadError) {
            throw new Error('사진 업로드 실패: ' + uploadError.message);
          }

          // Get Public URL
          const { data: urlData } = supabaseClient
            .storage
            .from('class_applications')
            .getPublicUrl(filePath);

          photoUrl = urlData.publicUrl;
        }

        // 2. Insert Application Record into Database
        const { data, error } = await supabaseClient
          .from('ryzin_class_applications')
          .insert([
            { 
              name: name, 
              phone: phone, 
              class_date: classDate, 
              reason: reason,
              photo_url: photoUrl
            }
          ]);

        if (error) throw error;

        closeModalFunc();
        successPopup.style.display = 'flex';
        form.reset();
        photoPreview.style.display = 'none';

      } catch (err) {
        console.error('신청 에러:', err);
        alert('신청 접수 중 문제가 발생했습니다: ' + err.message);
      } finally {
        btnSubmit.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = '수강 신청 완료';
      }
    });

    btnCloseSuccessPopup.addEventListener('click', () => {
      successPopup.style.display = 'none';
    });
  </script>
</body>
</html>
