<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>라이진 크리에이터 원데이 클래스 | Ryzin Class</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="누구나 무작정 따라하는 크리에이터 원데이 클래스! 라이진 클래스에서 새로운 크리에이터의 길을 시작하세요.">
  <meta property="og:title" content="라이진 크리에이터 원데이 클래스 | Ryzin Class">
  <meta property="og:description" content="누구나 무작정 따라하는 크리에이터 원데이 클래스! 라이진 클래스에서 새로운 크리에이터의 길을 시작하세요.">
  <meta property="og:image" content="https://vybrnhyaeugfwezbygdt.supabase.co/storage/v1/object/public/class_applications/class_detail_banner.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0052ff;
      --primary-hover: #0041cc;
      --accent: #ff2a5f;
      --accent-hover: #e01b4c;
      --bg-dark: #0f172a;
      --bg-light: #f1f5f9;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-light: #f8fafc;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --radius-sm: 8px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --font-primary: 'Inter', 'Noto Sans KR', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-light);
      font-family: var(--font-primary);
      color: var(--text-dark);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .mobile-wrapper {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: #ffffff;
      box-shadow: 0 0 32px rgba(0, 0, 0, 0.05);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: 84px;
    }

    .header-nav {
      position: sticky;
      top: 0;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      width: 100%;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    .nav-logo {
      font-size: 18px;
      font-weight: 900;
      color: #000000;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .detail-image-container {
      width: 100%;
      flex-grow: 1;
      background-color: #0c152b;
    }

    .detail-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .floating-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      max-width: 480px;
      width: 100%;
      background-color: #1e293b;
      color: #ffffff;
      z-index: 90;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .floating-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
    }

    .floating-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .floating-dday {
      font-size: 11px;
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .floating-title {
      font-size: 15px;
      font-weight: 700;
    }

    .floating-action-btn {
      background-color: var(--accent);
      color: #ffffff;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .floating-action-btn:hover {
      background-color: var(--accent-hover);
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }

    .modal-card {
      background-color: var(--card-bg);
      border-top-left-radius: var(--radius);
      border-top-right-radius: var(--radius);
      max-width: 480px;
      width: 100%;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border-top: 1px solid var(--border);
      animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    @keyframes modalSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .modal-close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Step Progress Indicator */
    .step-indicator {
      display: flex;
      padding: 12px 20px 0 20px;
      gap: 8px;
    }

    .step-dot {
      flex: 1;
      height: 4px;
      background-color: var(--border);
      border-radius: 2px;
      transition: background-color 0.3s ease;
    }

    .step-dot.active {
      background-color: var(--primary);
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
    }

    .date-select-btn {
      width: 100%;
      padding: 14px 16px;
      text-align: left;
      background-color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 14px;
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .date-select-btn:hover {
      border-color: var(--primary);
      background-color: #f0f5ff;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .form-select,
    .form-input,
    .form-textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background-color: #f8fafc;
      color: var(--text-dark);
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-select:focus,
    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 82, 255, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .file-input-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file-input-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #f1f5f9;
      color: #475569;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-input-btn:hover {
      background-color: #e2e8f0;
      border-color: #94a3b8;
    }

    .file-preview {
      display: none;
      width: 100%;
      max-height: 150px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    .modal-footer {
      padding: 16px 20px;
      background-color: #f8fafc;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .btn {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #334155;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary:disabled {
      background-color: var(--text-muted);
      cursor: not-allowed;
    }

    .success-popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 1100;
      padding: 20px;
    }

    .success-content {
      background-color: var(--card-bg);
      padding: 28px;
      border-radius: var(--radius);
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }

    .success-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .success-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="mobile-wrapper">
    <!-- Header Nav -->
    <header class="header-nav">
      <a href="#" class="nav-logo">RYZIN CLASS</a>
    </header>

    <!-- Detail Image Area -->
    <div class="detail-image-container">
      <img id="class-detail-banner-img" src="../assets/ryzinclass_banner.png" alt="크리에이터 원데이 클래스 상세 정보" class="detail-image">
    </div>

    <!-- Sticky Floating Bar -->
    <div class="floating-bar">
      <div class="floating-container">
        <div class="floating-info">
          <span class="floating-dday">마감까지 D-3</span>
          <span class="floating-title">크리에이터 원데이 클래스</span>
        </div>
        <button class="floating-action-btn" id="btnOpenApplyModal">수강신청</button>
      </div>
    </div>
  </div>

  <!-- Application Modal Sheet -->
  <div class="modal-overlay" id="applyModalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="applyModalTitle">수강 일정 선택 (1/3)</h2>
        <button class="modal-close-btn" id="btnCloseApplyModal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- 진행 단계 바 -->
      <div class="step-indicator">
        <div class="step-dot active" id="dot-step1"></div>
        <div class="step-dot" id="dot-step2"></div>
        <div class="step-dot" id="dot-step3"></div>
      </div>

      <form id="applyForm">
        <div class="modal-body">
          <!-- 1단계: 일정(기수) 선택 -->
          <div id="step1-area">
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">수강하실 기수 및 일정을 선택해 주세요.</p>
            <div id="date-list-container">
              <p style="text-align:center; color:var(--text-muted); font-size:13px; padding: 20px;">일정을 불러오는 중...</p>
            </div>
          </div>

          <!-- 2단계: 인적사항 입력 (이름, 전화번호, 이메일 등) -->
          <div id="step2-area" style="display: none;">
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">기본 인적사항을 입력해 주세요.</p>
            <div id="personal-fields-container"></div>
          </div>

          <!-- 3단계: 추가 질문 답변 (이유, 사진 첨부 등) -->
          <div id="step3-area" style="display: none;">
            <!-- 선택한 기수 요약 바 -->
            <div style="background-color:#f1f5f9; padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:16px; font-size:12px; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <span style="font-size:10px; color:var(--primary); font-weight:800; display:block;">선택 일정</span>
                <span id="selected-date-badge" style="font-weight:700;">기수 정보</span>
              </div>
            </div>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">마지막 추가 설문에 답변해 주세요.</p>
            <div id="additional-fields-container"></div>
          </div>
        </div>

        <!-- 하단 푸터 (2단계부터 노출) -->
        <div class="modal-footer" id="modal-footer" style="display: none;">
          <button type="button" class="btn btn-secondary" id="btnPrevStep">이전</button>
          <button type="button" class="btn btn-primary" id="btnNextStep">다음 단계</button>
          <button type="submit" class="btn btn-primary" id="btnSubmit" style="display: none;">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">수강 신청 완료</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Success Popup -->
  <div class="success-popup" id="successPopup">
    <div class="success-content">
      <h2 class="success-title">수강신청 완료</h2>
      <p class="success-desc">신청서 작성이 성공적으로 완료되었습니다. 확인 후 곧 연락드리겠습니다.</p>
      <button class="btn btn-primary" style="width: 100%; justify-content: center;" id="btnCloseSuccessPopup">확인</button>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://vybrnhyaeugfwezbygdt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FxH6HGkUaKfcJD9by_TLFQ_0PJk80J9';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let surveyQuestions = [];
    let currentStep = 1;
    let selectedDateValue = '';
    let dateQuestionLabel = '';

    // 1. 배너 이미지 로드 (캐시방지)
    function loadBannerImage() {
      const bannerImg = document.getElementById('class-detail-banner-img');
      const storageUrl = `${SUPABASE_URL}/storage/v1/object/public/class_applications/class_detail_banner.png?t=${Date.now()}`;
      
      bannerImg.src = storageUrl;
      bannerImg.onerror = () => {
        bannerImg.onerror = null;
        bannerImg.src = '../assets/ryzinclass_banner.png';
      };
    }

    // 2. 질문 데이터 로드 및 파싱
    async function loadSurveyQuestions() {
      const dateListContainer = document.getElementById('date-list-container');
      
      // 상태 초기화
      currentStep = 1;
      selectedDateValue = '';
      dateQuestionLabel = '';
      updateStepUI();

      try {
        const { data, error } = await supabaseClient
          .from('ryzin_class_survey_questions')
          .select('*')
          .order('sort_order', { ascending: true });

        if (error) throw error;
        
        surveyQuestions = data || [];

        // 1단계: 날짜 기수 문항 감지 (type === 'select' 이거나 라벨에 기수/날짜 포함)
        const dateQ = surveyQuestions.find(q => q.type === 'select' || q.label.includes('기수') || q.label.includes('날짜'));

        if (dateQ) {
          dateQuestionLabel = dateQ.label;
          const optionsList = dateQ.options ? dateQ.options.split(',') : [];
          
          if (optionsList.length > 0) {
            dateListContainer.innerHTML = optionsList.map(opt => `
              <button type="button" class="date-select-btn" data-value="${opt.trim()}">
                <span>${opt.trim()}</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            `).join('');

            // 기수 선택 이벤트 바인딩
            dateListContainer.querySelectorAll('.date-select-btn').forEach(btn => {
              btn.addEventListener('click', () => {
                selectedDateValue = btn.getAttribute('data-value');
                document.getElementById('selected-date-badge').innerText = selectedDateValue;
                goToStep(2);
              });
            });
            return;
          }
        }

        // 일정 문항이 없을 시 스텝 2로 즉시 점프
        goToStep(2);

      } catch (err) {
        console.error('설문 로딩 실패:', err);
        dateListContainer.innerHTML = `
          <p style="text-align:center; color:var(--accent); font-size:13px; padding: 20px;">
            일정을 불러오지 못했습니다. 다시 시도해 주세요.
          </p>
        `;
      }
    }

    // 3. 필드 분류 및 동적 생성
    // - 인적사항 (Step 2): 이름, 전화번호, 이메일, 연락처 단어가 라벨에 들어가거나 tel 타입인 것
    // - 추가 질문 (Step 3): 1단계와 2단계에 걸러지지 않은 나머지 질문들
    function renderFieldsBySteps() {
      const personalContainer = document.getElementById('personal-fields-container');
      const additionalContainer = document.getElementById('additional-fields-container');

      // 스텝 2 인적사항 문항 필터링
      const personalQuestions = surveyQuestions.filter(q => {
        if (q.label === dateQuestionLabel) return false; // 일정 제외
        const label = q.label.toLowerCase();
        return q.type === 'tel' || label.includes('이름') || label.includes('전화') || label.includes('연락') || label.includes('이메일') || label.includes('메일');
      });

      // 스텝 3 추가 질문 문항 필터링
      const additionalQuestions = surveyQuestions.filter(q => {
        if (q.label === dateQuestionLabel) return false; // 일정 제외
        const label = q.label.toLowerCase();
        const isPersonal = q.type === 'tel' || label.includes('이름') || label.includes('전화') || label.includes('연락') || label.includes('이메일') || label.includes('메일');
        return !isPersonal;
      });

      renderFields(personalContainer, personalQuestions);
      renderFields(additionalContainer, additionalQuestions);
    }

    // 4. 단일 컨테이너 필드 렌더링
    function renderFields(container, questions) {
      container.innerHTML = '';
      if (questions.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:13px; padding: 10px 0;">해당 단계의 입력 항목이 없습니다. 다음 단계를 진행해 주세요.</p>';
        return;
      }

      questions.forEach(q => {
        const group = document.createElement('div');
        group.className = 'form-group';

        const label = document.createElement('label');
        label.className = 'form-label';
        label.innerText = q.label + (q.required ? ' *' : '');
        group.appendChild(label);

        const inputId = `field_${q.id}`;

        if (q.type === 'textarea') {
          const textarea = document.createElement('textarea');
          textarea.className = 'form-textarea';
          textarea.id = inputId;
          textarea.placeholder = q.placeholder || '';
          textarea.required = q.required;
          group.appendChild(textarea);
        }
        else if (q.type === 'file') {
          const wrapper = document.createElement('div');
          wrapper.className = 'file-input-wrapper';
          wrapper.innerHTML = `
            <label class="file-input-btn" for="${inputId}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span id="${inputId}_btn_text">사진 선택하기 (선택 사항)</span>
            </label>
            <input type="file" id="${inputId}" accept="image/*" style="display: none;" ${q.required ? 'required' : ''}>
            <img id="${inputId}_preview" class="file-preview" alt="미리보기">
          `;
          
          setTimeout(() => {
            const fileInput = document.getElementById(inputId);
            const previewImg = document.getElementById(`${inputId}_preview`);
            const btnText = document.getElementById(`${inputId}_btn_text`);
            
            fileInput.addEventListener('change', (e) => {
              const file = e.target.files[0];
              if (file) {
                btnText.innerText = '사진 선택 완료';
                const reader = new FileReader();
                reader.onload = (ev) => {
                  previewImg.src = ev.target.result;
                  previewImg.style.display = 'block';
                };
                reader.readAsDataURL(file);
              } else {
                btnText.innerText = '사진 선택하기 (선택 사항)';
                previewImg.src = '';
                previewImg.style.display = 'none';
              }
            });
          }, 0);

          group.appendChild(wrapper);
        }
        else if (q.type === 'tel') {
          const input = document.createElement('input');
          input.type = 'tel';
          input.className = 'form-input';
          input.id = inputId;
          input.placeholder = q.placeholder || '010-0000-0000';
          input.required = q.required;
          input.maxLength = 13;

          input.addEventListener('input', (e) => {
            let val = e.target.value.replace(/[^0-9]/g, '');
            if (val.length > 3 && val.length <= 7) {
              val = val.slice(0, 3) + '-' + val.slice(3);
            } else if (val.length > 7) {
              val = val.slice(0, 3) + '-' + val.slice(3, 7) + '-' + val.slice(7, 11);
            }
            e.target.value = val;
          });

          group.appendChild(input);
        }
        else if (q.type === 'select') {
          // 혹시 인적사항/추가항목에 일반 select가 있을 경우 처리
          const select = document.createElement('select');
          select.className = 'form-select';
          select.id = inputId;
          select.required = q.required;

          const defaultOpt = document.createElement('option');
          defaultOpt.value = '';
          defaultOpt.disabled = true;
          defaultOpt.selected = true;
          defaultOpt.innerText = q.placeholder || '선택해 주세요';
          select.appendChild(defaultOpt);

          const optionsList = q.options ? q.options.split(',') : [];
          optionsList.forEach((optText) => {
            const opt = document.createElement('option');
            opt.value = optText.trim();
            opt.innerText = optText.trim();
            select.appendChild(opt);
          });
          group.appendChild(select);
        }
        else {
          const input = document.createElement('input');
          input.type = q.label.includes('이메일') || q.label.includes('메일') ? 'email' : 'text';
          input.className = 'form-input';
          input.id = inputId;
          input.placeholder = q.placeholder || '';
          input.required = q.required;
          group.appendChild(input);
        }

        container.appendChild(group);
      });
    }

    // 5. 단계 제어 및 유효성 검사
    function goToStep(step) {
      currentStep = step;
      updateStepUI();
    }

    function updateStepUI() {
      const step1Area = document.getElementById('step1-area');
      const step2Area = document.getElementById('step2-area');
      const step3Area = document.getElementById('step3-area');
      const modalFooter = document.getElementById('modal-footer');
      const btnPrevStep = document.getElementById('btnPrevStep');
      const btnNextStep = document.getElementById('btnNextStep');
      const btnSubmit = document.getElementById('btnSubmit');
      const modalTitle = document.getElementById('applyModalTitle');

      // Step indicator dots
      document.getElementById('dot-step1').className = `step-dot ${currentStep >= 1 ? 'active' : ''}`;
      document.getElementById('dot-step2').className = `step-dot ${currentStep >= 2 ? 'active' : ''}`;
      document.getElementById('dot-step3').className = `step-dot ${currentStep >= 3 ? 'active' : ''}`;

      // Areas display
      step1Area.style.display = currentStep === 1 ? 'block' : 'none';
      step2Area.style.display = currentStep === 2 ? 'block' : 'none';
      step3Area.style.display = currentStep === 3 ? 'block' : 'none';

      // Footer buttons display
      if (currentStep === 1) {
        modalFooter.style.display = 'none';
        modalTitle.innerText = '수강 일정 선택 (1/3)';
      } else if (currentStep === 2) {
        modalFooter.style.display = 'flex';
        btnPrevStep.style.display = 'inline-block';
        btnNextStep.style.display = 'inline-block';
        btnSubmit.style.display = 'none';
        modalTitle.innerText = '인적사항 입력 (2/3)';
        
        // 스텝 2 폼 렌더링
        renderFieldsBySteps();
      } else if (currentStep === 3) {
        modalFooter.style.display = 'flex';
        btnPrevStep.style.display = 'inline-block';
        btnNextStep.style.display = 'none';
        btnSubmit.style.display = 'inline-block';
        modalTitle.innerText = '추가 질문 답변 (3/3)';
      }
    }

    // 2단계 필수 입력값 검증 (HTML5 유효성 검사 가로채기)
    function validateStep2Fields() {
      const personalQuestions = surveyQuestions.filter(q => {
        if (q.label === dateQuestionLabel) return false;
        const label = q.label.toLowerCase();
        return q.type === 'tel' || label.includes('이름') || label.includes('전화') || label.includes('연락') || label.includes('이메일') || label.includes('메일');
      });

      for (const q of personalQuestions) {
        const el = document.getElementById(`field_${q.id}`);
        if (!el) continue;
        if (q.required && !el.value.trim()) {
          alert(`'${q.label}' 항목은 필수 입력 사항입니다.`);
          el.focus();
          return false;
        }
        if (el.type === 'email' && el.value.trim()) {
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(el.value.trim())) {
            alert('올바른 이메일 형식을 입력해 주세요.');
            el.focus();
            return false;
          }
        }
      }
      return true;
    }

    // Modal Control
    const applyModalOverlay = document.getElementById('applyModalOverlay');
    const btnOpenApplyModal = document.getElementById('btnOpenApplyModal');
    const btnCloseApplyModal = document.getElementById('btnCloseApplyModal');
    const btnCancelApply = document.getElementById('btnCancelApply');
    const btnPrevStep = document.getElementById('btnPrevStep');
    const btnNextStep = document.getElementById('btnNextStep');

    btnOpenApplyModal.addEventListener('click', () => {
      applyModalOverlay.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      loadSurveyQuestions();
    });

    const closeModalFunc = () => {
      applyModalOverlay.style.display = 'none';
      document.body.style.overflow = '';
    };

    btnCloseApplyModal.addEventListener('click', closeModalFunc);
    btnCancelApply.addEventListener('click', closeModalFunc);

    applyModalOverlay.addEventListener('click', (e) => {
      if (e.target === applyModalOverlay) closeModalFunc();
    });

    // 스텝 이동 이벤트
    btnPrevStep.addEventListener('click', () => {
      if (currentStep === 2) {
        // 만약 기수 날짜 선택 문항이 있는 상태이면 1단계로, 없으면 닫기
        if (dateQuestionLabel) {
          goToStep(1);
        } else {
          closeModalFunc();
        }
      } else if (currentStep === 3) {
        goToStep(2);
      }
    });

    btnNextStep.addEventListener('click', () => {
      if (currentStep === 2) {
        if (validateStep2Fields()) {
          goToStep(3);
        }
      }
    });

    // Form Submit (1단계 선택 날짜 + 2단계 인적사항 + 3단계 추가질문)
    const form = document.getElementById('applyForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const successPopup = document.getElementById('successPopup');
    const btnCloseSuccessPopup = document.getElementById('btnCloseSuccessPopup');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      btnSubmit.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = '제출 중...';

      try {
        const answers = {};
        let name = '';
        let phone = '';
        let photoUrl = '';
        let photoFile = null;

        // 1단계 일정 매핑
        if (dateQuestionLabel && selectedDateValue) {
          answers[dateQuestionLabel] = selectedDateValue;
        }

        // 전체 필드에서 데이터 수집
        for (const q of surveyQuestions) {
          if (q.label === dateQuestionLabel) continue;
          
          const inputId = `field_${q.id}`;
          const el = document.getElementById(inputId);
          if (!el) continue;

          if (q.type === 'file') {
            photoFile = el.files[0];
          } else {
            const val = el.value.trim();
            answers[q.label] = val;

            if (q.label.includes('이름')) name = val;
            if (q.label.includes('전화') || q.label.includes('연락처')) phone = val;
          }
        }

        // 대표 이름 및 전화번호 매핑 보장
        if (!name) {
          const firstTxt = surveyQuestions.find(q => q.label.includes('이름') || q.type === 'text');
          if (firstTxt) name = document.getElementById(`field_${firstTxt.id}`).value.trim();
        }
        if (!phone) {
          const firstTel = surveyQuestions.find(q => q.type === 'tel' || q.label.includes('전화'));
          if (firstTel) phone = document.getElementById(`field_${firstTel.id}`).value.trim();
        }

        if (!name) name = '익명 신청자';
        if (!phone) phone = '010-0000-0000';

        // 사진 파일 업로드
        if (photoFile) {
          const fileExt = photoFile.name.split('.').pop();
          const cleanFileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
          const filePath = `${cleanFileName}`;

          const { data: uploadData, error: uploadError } = await supabaseClient
            .storage
            .from('class_applications')
            .upload(filePath, photoFile);

          if (uploadError) throw new Error('사진 업로드 실패: ' + uploadError.message);

          const { data: urlData } = supabaseClient
            .storage
            .from('class_applications')
            .getPublicUrl(filePath);

          photoUrl = urlData.publicUrl;
          answers['사진 첨부'] = photoUrl;
        }

        // Supabase DB 제출
        const { data, error } = await supabaseClient
          .from('ryzin_class_applications')
          .insert([
            { 
              name: name, 
              phone: phone, 
              answers: answers,
              photo_url: photoUrl
            }
          ]);

        if (error) throw error;

        closeModalFunc();
        successPopup.style.display = 'flex';
        form.reset();

      } catch (err) {
        console.error('제출 에러:', err);
        alert('신청 접수 중 문제가 발생했습니다: ' + err.message);
      } finally {
        btnSubmit.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = '수강 신청 완료';
      }
    });

    btnCloseSuccessPopup.addEventListener('click', () => {
      successPopup.style.display = 'none';
    });

    // 초기화
    loadBannerImage();
  </script>
</body>
</html>
