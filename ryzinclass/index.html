<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>라이진 크리에이터 원데이 클래스 | Ryzin Class</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="누구나 무작정 따라하는 크리에이터 원데이 클래스! 라이진 클래스에서 새로운 크리에이터의 길을 시작하세요.">
  <meta property="og:title" content="라이진 크리에이터 원데이 클래스 | Ryzin Class">
  <meta property="og:description" content="누구나 무작정 따라하는 크리에이터 원데이 클래스! 라이진 클래스에서 새로운 크리에이터의 길을 시작하세요.">
  <meta property="og:image" content="https://vybrnhyaeugfwezbygdt.supabase.co/storage/v1/object/public/class_applications/detail_banner_1785226535425.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0052ff;
      --primary-hover: #0041cc;
      --accent: #ff2a5f;
      --accent-hover: #e01b4c;
      --bg-dark: #0f172a;
      --bg-light: #f1f5f9;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-light: #f8fafc;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --radius-sm: 8px;
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --font-primary: 'Inter', 'Noto Sans KR', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-light);
      font-family: var(--font-primary);
      color: var(--text-dark);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .mobile-wrapper {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: #ffffff;
      box-shadow: 0 0 32px rgba(0, 0, 0, 0.05);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: 84px;
    }

    .header-nav {
      position: sticky;
      top: 0;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      width: 100%;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    .nav-logo {
      font-size: 18px;
      font-weight: 900;
      color: #000000;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .detail-image-container {
      width: 100%;
      flex-grow: 1;
      background-color: #0c152b;
    }

    .detail-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .floating-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      max-width: 480px;
      width: 100%;
      background-color: #1e293b;
      color: #ffffff;
      z-index: 999;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .floating-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
    }

    .floating-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .floating-dday {
      font-size: 11px;
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .floating-title {
      font-size: 15px;
      font-weight: 700;
    }

    .floating-action-btn {
      background-color: var(--accent);
      color: #ffffff;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color 0.2s ease;
      touch-action: manipulation;
    }

    .floating-action-btn:hover {
      background-color: var(--accent-hover);
    }

    /* Modal Overlay (z-index 9999로 최상단 보장) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      align-items: flex-end;
      justify-content: center;
      z-index: 9999;
    }

    .modal-card {
      background-color: var(--card-bg);
      border-top-left-radius: var(--radius);
      border-top-right-radius: var(--radius);
      max-width: 480px;
      width: 100%;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border-top: 1px solid var(--border);
      animation: modalSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    @keyframes modalSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .modal-close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    /* Step Progress Indicator */
    .step-indicator {
      display: flex;
      padding: 12px 20px 0 20px;
      gap: 8px;
    }

    .step-dot {
      flex: 1;
      height: 4px;
      background-color: var(--border);
      border-radius: 2px;
      transition: background-color 0.3s ease;
    }

    .step-dot.active {
      background-color: var(--primary);
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      max-height: 65vh;
    }

    .date-select-btn {
      width: 100%;
      padding: 14px 16px;
      text-align: left;
      background-color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 14px;
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      touch-action: manipulation;
    }

    .date-select-btn:hover {
      border-color: var(--primary);
      background-color: #f0f5ff;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background-color: #f8fafc;
      color: var(--text-dark);
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 82, 255, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .file-input-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file-input-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #f1f5f9;
      color: #475569;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    .file-preview {
      display: none;
      width: 100%;
      max-height: 150px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    .modal-footer {
      padding: 16px 20px;
      background-color: #f8fafc;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .btn {
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #334155;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary:disabled {
      background-color: var(--text-muted);
      cursor: not-allowed;
    }

    .success-popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 20px;
    }

    .success-content {
      background-color: var(--card-bg);
      padding: 28px;
      border-radius: var(--radius);
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }

    .success-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .success-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="mobile-wrapper">
    <!-- Header Nav -->
    <header class="header-nav">
      <a href="#" class="nav-logo">RYZIN CLASS</a>
    </header>

    <!-- Detail Image Area -->
    <div class="detail-image-container">
      <img id="class-detail-banner-img" src="https://vybrnhyaeugfwezbygdt.supabase.co/storage/v1/object/public/class_applications/detail_banner_1785226535425.png" alt="크리에이터 원데이 클래스 상세 정보" class="detail-image">
    </div>

    <!-- Sticky Floating Bar -->
    <div class="floating-bar">
      <div class="floating-container">
        <div class="floating-info">
          <span class="floating-dday">마감까지 D-3</span>
          <span class="floating-title">크리에이터 원데이 클래스</span>
        </div>
        <button type="button" class="floating-action-btn" id="btnOpenApplyModal" onclick="openApplyModal(event)">수강신청</button>
      </div>
    </div>
  </div>

  <!-- Application Modal Sheet (form 태그 결합 해제하여 100% 안전 구동) -->
  <div class="modal-overlay" id="applyModalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title" id="applyModalTitle">수강 일정 선택 (1/3)</h2>
        <button type="button" class="modal-close-btn" id="btnCloseApplyModal" onclick="closeModalFunc(event)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- 진행 단계 바 -->
      <div class="step-indicator">
        <div class="step-dot active" id="dot-step1"></div>
        <div class="step-dot" id="dot-step2"></div>
        <div class="step-dot" id="dot-step3"></div>
      </div>

      <div class="modal-body">
        <!-- 1단계: 일정(기수) 선택 -->
        <div id="step1-area">
          <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">수강하실 기수 및 일정을 선택해 주세요.</p>
          <div id="date-list-container">
            <p style="text-align:center; color:var(--text-muted); font-size:13px; padding: 20px;">일정을 불러오는 중...</p>
          </div>
        </div>

        <!-- 2단계: 고정 인적사항 입력 (이름, 전화번호, 이메일 주소) -->
        <div id="step2-area" style="display: none;">
          <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">기본 인적사항을 입력해 주세요.</p>
          
          <div class="form-group">
            <label class="form-label" for="user-name">이름 *</label>
            <input type="text" class="form-input" id="user-name" placeholder="실명을 입력해 주세요" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="user-phone">전화번호 *</label>
            <input type="tel" class="form-input" id="user-phone" placeholder="010-0000-0000" maxlength="13" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="user-email">이메일 주소 *</label>
            <input type="email" class="form-input" id="user-email" placeholder="example@email.com" required>
          </div>
        </div>

        <!-- 3단계: 커스텀 추가 질문 답변 & 결제 안내 카드 -->
        <div id="step3-area" style="display: none;">
          <div style="background-color:#f1f5f9; padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:16px; font-size:12px; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <span style="font-size:10px; color:var(--primary); font-weight:800; display:block;">선택 일정</span>
              <span id="selected-date-badge" style="font-weight:700;">기수 정보</span>
            </div>
          </div>
          <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">추가 질문에 답변해 주세요.</p>
          <div id="additional-fields-container"></div>

          <!-- 결제 수강료 안내 카드 -->
          <div style="background-color: #eff6ff; border: 1px solid #bfdbfe; padding: 14px 16px; border-radius: var(--radius-sm); margin-top: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <span style="font-size: 11px; color: #3b82f6; font-weight: 800; display: block;">수강 신청 비용</span>
                <span style="font-size: 15px; font-weight: 800; color: #1e40af;">원데이 클래스 수강료</span>
              </div>
              <span style="font-size: 18px; font-weight: 900; color: var(--primary);">99,000원</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 하단 푸터 (2단계부터 노출) -->
      <div class="modal-footer" id="modal-footer" style="display: none;">
        <button type="button" class="btn btn-secondary" id="btnPrevStep" onclick="handlePrevStep(event)">이전</button>
        <button type="button" class="btn btn-primary" id="btnNextStep" onclick="handleNextStep(event)">다음 단계</button>
        <button type="button" class="btn btn-primary" id="btnSubmit" onclick="handleSubmit(event)" style="display: none;">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText">결제하기</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Success Popup -->
  <div class="success-popup" id="successPopup">
    <div class="success-content">
      <h2 class="success-title">수강신청 접수완료</h2>
      <p class="success-desc">신청서 작성이 완료되었습니다. 결제창으로 이동합니다.</p>
      <button type="button" class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="closeSuccessPopup()">확인</button>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://vybrnhyaeugfwezbygdt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FxH6HGkUaKfcJD9by_TLFQ_0PJk80J9';
    let supabaseClient = null;
    try {
      if (window.supabase && window.supabase.createClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (e) {
      console.warn('Supabase SDK 초기화 예외:', e);
    }

    let surveyQuestions = [];
    let currentStep = 1;
    let selectedDateValue = '';

    // 1. 배너 이미지 로드
    async function loadBannerImage() {
      const bannerImg = document.getElementById('class-detail-banner-img');
      const defaultBanner = 'https://vybrnhyaeugfwezbygdt.supabase.co/storage/v1/object/public/class_applications/detail_banner_1785226535425.png';
      
      try {
        if (supabaseClient) {
          const { data } = await supabaseClient
            .from('ryzin_class_settings')
            .select('value')
            .eq('key', 'detail_banner_url')
            .single();

          if (data && data.value) {
            bannerImg.src = data.value;
            return;
          }
        }
      } catch (e) {
        console.warn('DB 배너 이미지 조회 예외:', e);
      }

      bannerImg.src = defaultBanner;
    }

    // 2. 일정 설정 및 추가 질문 데이터 로딩
    async function loadSurveyQuestions() {
      const dateListContainer = document.getElementById('date-list-container');
      
      currentStep = 1;
      selectedDateValue = '';
      updateStepUI();

      try {
        let rawDates = '1기 - 2026년 8월 10일 (월) 19:00, 2기 - 2026년 8월 17일 (월) 19:00, 3기 - 2026년 8월 24일 (월) 19:00, 4기 - 2026년 8월 31일 (월) 19:00';
        
        try {
          if (supabaseClient) {
            const { data: settingsData } = await supabaseClient
              .from('ryzin_class_settings')
              .select('value')
              .eq('key', 'class_dates')
              .single();

            if (settingsData && settingsData.value) {
              rawDates = settingsData.value;
            }
          }
        } catch (e) {
          console.warn('일정 DB 로드 실패, 기본 일정 노출:', e);
        }

        const optionsList = rawDates ? rawDates.split(',').map(d => d.trim()).filter(Boolean) : [];

        if (optionsList.length > 0) {
          dateListContainer.innerHTML = optionsList.map(opt => `
            <button type="button" class="date-select-btn" onclick="selectDateOption('${opt}')">
              <span>${opt}</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          `).join('');
        } else {
          dateListContainer.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:13px; padding: 20px;">접수 가능한 일정이 현재 없습니다.</p>`;
        }

        // 2-2. 추가 질문 로드 (Fallback 보장)
        try {
          if (supabaseClient) {
            const { data: questionData } = await supabaseClient
              .from('ryzin_class_survey_questions')
              .select('*')
              .order('sort_order', { ascending: true });

            if (questionData && questionData.length > 0) {
              surveyQuestions = questionData;
            } else {
              throw new Error('질문 데이터 없음');
            }
          } else {
            throw new Error('SDK 미준비');
          }
        } catch (qErr) {
          console.warn('설문 질문 DB 로드 예외, 기본 템플릿 질문 노출:', qErr);
          surveyQuestions = [
            { id: 101, type: 'textarea', label: '크리에이터 원데이 클래스 수강 목적 및 지원 동기', placeholder: '클래스를 통해 배우고 싶거나 이루고자 하는 목표를 자유롭게 입력해 주세요.', required: true, sort_order: 1 },
            { id: 102, type: 'text', label: '운영 중인 SNS 채널 주소 (선택)', placeholder: '인스타그램, 유튜브, 블로그 등의 링크를 입력해 주세요.', required: false, sort_order: 2 },
            { id: 103, type: 'file', label: '참고 사진 또는 포트폴리오 첨부 (선택)', placeholder: '', required: false, sort_order: 3 }
          ];
        }

      } catch (err) {
        console.error('데이터 조회 오류:', err);
      }
    }

    // 3. 3단계 추가 커스텀 필드 동적 렌더링
    function renderStep3Fields() {
      const container = document.getElementById('additional-fields-container');
      if (!container) return;
      container.innerHTML = '';

      surveyQuestions.forEach(q => {
        const group = document.createElement('div');
        group.className = 'form-group';

        const label = document.createElement('label');
        label.className = 'form-label';
        label.innerText = q.label + (q.required ? ' *' : '');
        group.appendChild(label);

        const inputId = `field_${q.id}`;

        if (q.type === 'textarea') {
          const textarea = document.createElement('textarea');
          textarea.className = 'form-textarea';
          textarea.id = inputId;
          textarea.placeholder = q.placeholder || '';
          textarea.required = q.required;
          group.appendChild(textarea);
        }
        else if (q.type === 'file') {
          const wrapper = document.createElement('div');
          wrapper.className = 'file-input-wrapper';
          wrapper.innerHTML = `
            <label class="file-input-btn" for="${inputId}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span id="${inputId}_btn_text">사진 선택하기 (선택 사항)</span>
            </label>
            <input type="file" id="${inputId}" accept="image/*" style="display: none;" ${q.required ? 'required' : ''}>
            <img id="${inputId}_preview" class="file-preview" alt="미리보기">
          `;
          
          setTimeout(() => {
            const fileInput = document.getElementById(inputId);
            const previewImg = document.getElementById(`${inputId}_preview`);
            const btnText = document.getElementById(`${inputId}_btn_text`);
            if (!fileInput) return;
            
            fileInput.addEventListener('change', (e) => {
              const file = e.target.files[0];
              if (file) {
                btnText.innerText = '사진 선택 완료';
                const reader = new FileReader();
                reader.onload = (ev) => {
                  previewImg.src = ev.target.result;
                  previewImg.style.display = 'block';
                };
                reader.readAsDataURL(file);
              } else {
                btnText.innerText = '사진 선택하기 (선택 사항)';
                previewImg.src = '';
                previewImg.style.display = 'none';
              }
            });
          }, 0);

          group.appendChild(wrapper);
        }
        else {
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'form-input';
          input.id = inputId;
          input.placeholder = q.placeholder || '';
          input.required = q.required;
          group.appendChild(input);
        }

        container.appendChild(group);
      });
    }

    // 4. 연락처 하이픈 포맷 적용
    const phoneInput = document.getElementById('user-phone');
    if (phoneInput) {
      phoneInput.addEventListener('input', (e) => {
        let val = e.target.value.replace(/[^0-9]/g, '');
        if (val.length > 3 && val.length <= 7) {
          val = val.slice(0, 3) + '-' + val.slice(3);
        } else if (val.length > 7) {
          val = val.slice(0, 3) + '-' + val.slice(3, 7) + '-' + val.slice(7, 11);
        }
        e.target.value = val;
      });
    }

    // 5. 단계 제어 및 UI 갱신
    function goToStep(step) {
      currentStep = step;
      updateStepUI();
    }

    function updateStepUI() {
      const step1Area = document.getElementById('step1-area');
      const step2Area = document.getElementById('step2-area');
      const step3Area = document.getElementById('step3-area');
      const modalFooter = document.getElementById('modal-footer');
      const btnPrevStep = document.getElementById('btnPrevStep');
      const btnNextStep = document.getElementById('btnNextStep');
      const btnSubmit = document.getElementById('btnSubmit');
      const modalTitle = document.getElementById('applyModalTitle');

      const dot1 = document.getElementById('dot-step1');
      const dot2 = document.getElementById('dot-step2');
      const dot3 = document.getElementById('dot-step3');

      if (dot1) dot1.className = `step-dot ${currentStep >= 1 ? 'active' : ''}`;
      if (dot2) dot2.className = `step-dot ${currentStep >= 2 ? 'active' : ''}`;
      if (dot3) dot3.className = `step-dot ${currentStep >= 3 ? 'active' : ''}`;

      if (step1Area) step1Area.style.display = currentStep === 1 ? 'block' : 'none';
      if (step2Area) step2Area.style.display = currentStep === 2 ? 'block' : 'none';
      if (step3Area) step3Area.style.display = currentStep === 3 ? 'block' : 'none';

      if (currentStep === 1) {
        if (modalFooter) modalFooter.style.display = 'none';
        if (modalTitle) modalTitle.innerText = '수강 일정 선택 (1/3)';
      } else if (currentStep === 2) {
        if (modalFooter) modalFooter.style.display = 'flex';
        if (btnPrevStep) btnPrevStep.style.display = 'inline-block';
        if (btnNextStep) btnNextStep.style.display = 'inline-block';
        if (btnSubmit) btnSubmit.style.display = 'none';
        if (modalTitle) modalTitle.innerText = '인적사항 입력 (2/3)';
      } else if (currentStep === 3) {
        if (modalFooter) modalFooter.style.display = 'flex';
        if (btnPrevStep) btnPrevStep.style.display = 'inline-block';
        if (btnNextStep) btnNextStep.style.display = 'none';
        if (btnSubmit) btnSubmit.style.display = 'inline-block';
        if (modalTitle) modalTitle.innerText = '추가 질문 및 결제 (3/3)';
        
        renderStep3Fields();
      }
    }

    // 2단계 인적사항 유효성 검사
    function validateStep2() {
      const name = document.getElementById('user-name').value.trim();
      const phone = document.getElementById('user-phone').value.trim();
      const email = document.getElementById('user-email').value.trim();

      if (!name) {
        alert('이름을 입력해 주세요.');
        document.getElementById('user-name').focus();
        return false;
      }
      if (!phone || phone.length < 10) {
        alert('올바른 연락처 전화번호를 입력해 주세요.');
        document.getElementById('user-phone').focus();
        return false;
      }
      if (!email) {
        alert('이메일 주소를 입력해 주세요.');
        document.getElementById('user-email').focus();
        return false;
      }
      
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        alert('올바른 이메일 형식을 입력해 주세요.');
        document.getElementById('user-email').focus();
        return false;
      }
      return true;
    }

    // 전역 이벤트 핸들러 (100% 인라인 터치 클릭 보장)
    window.openApplyModal = function(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const overlay = document.getElementById('applyModalOverlay');
      if (overlay) {
        overlay.style.display = 'flex';
      }
      document.body.style.overflow = 'hidden';
      try {
        loadSurveyQuestions();
      } catch (err) {
        console.warn('설문 질문 로딩 예외:', err);
      }
    };

    window.closeModalFunc = function(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const overlay = document.getElementById('applyModalOverlay');
      if (overlay) {
        overlay.style.display = 'none';
      }
      document.body.style.overflow = '';
    };

    window.handleOverlayClick = function(e) {
      if (e.target.id === 'applyModalOverlay') {
        window.closeModalFunc(e);
      }
    };

    window.selectDateOption = function(dateValue) {
      selectedDateValue = dateValue;
      const badge = document.getElementById('selected-date-badge');
      if (badge) badge.innerText = selectedDateValue;
      goToStep(2);
    };

    window.handlePrevStep = function(e) {
      if (e) e.preventDefault();
      if (currentStep === 2) {
        goToStep(1);
      } else if (currentStep === 3) {
        goToStep(2);
      }
    };

    window.handleNextStep = function(e) {
      if (e) e.preventDefault();
      if (currentStep === 2) {
        if (validateStep2()) {
          goToStep(3);
        }
      }
    };

    window.handleSubmit = async function(e) {
      if (e) e.preventDefault();

      const btnSubmit = document.getElementById('btnSubmit');
      const btnSpinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');
      const successPopup = document.getElementById('successPopup');

      if (btnSubmit) btnSubmit.disabled = true;
      if (btnSpinner) btnSpinner.style.display = 'inline-block';
      if (btnText) btnText.textContent = '제출 중...';

      try {
        const answers = {};
        const name = document.getElementById('user-name').value.trim();
        const phone = document.getElementById('user-phone').value.trim();
        const email = document.getElementById('user-email').value.trim();
        let photoUrl = '';
        let photoFile = null;

        answers['수강 일정 선택'] = selectedDateValue;
        answers['이름'] = name;
        answers['전화번호'] = phone;
        answers['이메일 주소'] = email;

        for (const q of surveyQuestions) {
          const inputId = `field_${q.id}`;
          const el = document.getElementById(inputId);
          if (!el) continue;

          if (q.type === 'file') {
            photoFile = el.files[0];
          } else {
            const val = el.value.trim();
            answers[q.label] = val;
          }
        }

        // 사진 파일 스토리지 업로드 (SDK 지원 시)
        if (photoFile && supabaseClient) {
          try {
            const fileExt = photoFile.name.split('.').pop();
            const cleanFileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

            const { data: uploadData, error: uploadError } = await supabaseClient
              .storage
              .from('class_applications')
              .upload(cleanFileName, photoFile);

            if (!uploadError) {
              const { data: urlData } = supabaseClient
                .storage
                .from('class_applications')
                .getPublicUrl(cleanFileName);

              photoUrl = urlData.publicUrl;
              answers['사진 첨부'] = photoUrl;
            }
          } catch (pErr) {
            console.warn('사진 업로드 예외:', pErr);
          }
        }

        // 데이터 Insert
        if (supabaseClient) {
          await supabaseClient
            .from('ryzin_class_applications')
            .insert([
              { 
                name: name, 
                phone: phone, 
                answers: answers,
                photo_url: photoUrl
              }
            ]);
        }

        window.closeModalFunc();
        if (successPopup) successPopup.style.display = 'flex';

        // 신청 완료 시 페이앱 결제 페이지로 자동 이동
        setTimeout(() => {
          window.location.href = 'https://www.payapp.kr/L/z4hUXF';
        }, 1200);

      } catch (err) {
        console.error('제출 오류:', err);
        alert('신청 접수 중 문제가 발생했습니다: ' + err.message);
      } finally {
        if (btnSubmit) btnSubmit.disabled = false;
        if (btnSpinner) btnSpinner.style.display = 'none';
        if (btnText) btnText.textContent = '수강 신청 완료';
      }
    };

    window.closeSuccessPopup = function() {
      const successPopup = document.getElementById('successPopup');
      if (successPopup) successPopup.style.display = 'none';
      window.location.href = 'https://www.payapp.kr/L/z4hUXF';
    };

    // 초기화
    loadBannerImage();
  </script>
</body>
</html>
