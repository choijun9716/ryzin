<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>라이진 크리에이터 원데이 클래스 | Ryzin Class</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="누구나 무작정 따라하는 크리에이터 원데이 클래스! 라이진 클래스에서 새로운 크리에이터의 길을 시작하세요.">
  <meta property="og:title" content="라이진 크리에이터 원데이 클래스 | Ryzin Class">
  <meta property="og:description" content="누구나 무작정 따라하는 크리에이터 원데이 클래스! 라이진 클래스에서 새로운 크리에이터의 길을 시작하세요.">
  <meta property="og:image" content="https://vybrnhyaeugfwezbygdt.supabase.co/storage/v1/object/public/class_applications/class_detail_banner.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #0052ff;
      --primary-hover: #0041cc;
      --accent: #ff2a5f;
      --accent-hover: #e01b4c;
      --bg-dark: #0f172a;
      --bg-light: #f1f5f9;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-light: #f8fafc;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --radius-sm: 8px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --font-primary: 'Inter', 'Noto Sans KR', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-light);
      font-family: var(--font-primary);
      color: var(--text-dark);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .mobile-wrapper {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: #ffffff;
      box-shadow: 0 0 32px rgba(0, 0, 0, 0.05);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: 84px;
    }

    .header-nav {
      position: sticky;
      top: 0;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      width: 100%;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    .nav-logo {
      font-size: 18px;
      font-weight: 900;
      color: #000000;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .detail-image-container {
      width: 100%;
      flex-grow: 1;
      background-color: #0c152b;
    }

    .detail-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .floating-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      max-width: 480px;
      width: 100%;
      background-color: #1e293b;
      color: #ffffff;
      z-index: 90;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .floating-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
    }

    .floating-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .floating-dday {
      font-size: 11px;
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .floating-title {
      font-size: 15px;
      font-weight: 700;
    }

    .floating-action-btn {
      background-color: var(--accent);
      color: #ffffff;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .floating-action-btn:hover {
      background-color: var(--accent-hover);
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }

    .modal-card {
      background-color: var(--card-bg);
      border-top-left-radius: var(--radius);
      border-top-right-radius: var(--radius);
      max-width: 480px;
      width: 100%;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border-top: 1px solid var(--border);
      animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    @keyframes modalSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .modal-close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
    }

    /* 1단계 날짜 리스트 스타일 */
    .date-select-btn {
      width: 100%;
      padding: 14px 16px;
      text-align: left;
      background-color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 14px;
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .date-select-btn:hover {
      border-color: var(--primary);
      background-color: #f0f5ff;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .form-select,
    .form-input,
    .form-textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background-color: #f8fafc;
      color: var(--text-dark);
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-select:focus,
    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 82, 255, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .file-input-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file-input-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #f1f5f9;
      color: #475569;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-input-btn:hover {
      background-color: #e2e8f0;
      border-color: #94a3b8;
    }

    .file-preview {
      display: none;
      width: 100%;
      max-height: 150px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    .modal-footer {
      padding: 16px 20px;
      background-color: #f8fafc;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #334155;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary:disabled {
      background-color: var(--text-muted);
      cursor: not-allowed;
    }

    .success-popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 1100;
      padding: 20px;
    }

    .success-content {
      background-color: var(--card-bg);
      padding: 28px;
      border-radius: var(--radius);
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }

    .success-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .success-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="mobile-wrapper">
    <!-- Header Nav -->
    <header class="header-nav">
      <a href="#" class="nav-logo">RYZIN CLASS</a>
    </header>

    <!-- Detail Image Area (통 상세 이미지) -->
    <div class="detail-image-container">
      <img id="class-detail-banner-img" src="../assets/ryzinclass_banner.png" alt="크리에이터 원데이 클래스 상세 정보" class="detail-image">
    </div>

    <!-- Sticky Floating Bar -->
    <div class="floating-bar">
      <div class="floating-container">
        <div class="floating-info">
          <span class="floating-dday">마감까지 D-3</span>
          <span class="floating-title">크리에이터 원데이 클래스</span>
        </div>
        <button class="floating-action-btn" id="btnOpenApplyModal">수강신청</button>
      </div>
    </div>
  </div>

  <!-- Application Modal Sheet -->
  <div class="modal-overlay" id="applyModalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="applyModalTitle">수강 일정 선택</h2>
        <button class="modal-close-btn" id="btnCloseApplyModal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="applyForm">
        <div class="modal-body">
          <!-- 1단계: 날짜 기수 리스트 선택 영역 -->
          <div id="step1-area">
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">수강하실 기수 및 일정을 선택해 주세요.</p>
            <div id="date-list-container">
              <p style="text-align:center; color:var(--text-muted); font-size:13px; padding: 20px;">일정을 불러오는 중...</p>
            </div>
          </div>

          <!-- 2단계: 나머지 정보 입력 영역 -->
          <div id="step2-area" style="display: none;">
            <!-- 선택한 기수 요약 바 -->
            <div style="background-color:#f1f5f9; padding:12px; border-radius:var(--radius-sm); margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <span style="font-size:10px; color:var(--primary); font-weight:800; display:block;">선택한 수강 일정</span>
                <span id="selected-date-badge" style="font-size:13px; font-weight:700;">기수 정보</span>
              </div>
              <button type="button" id="btn-back-to-step1" style="background:none; border:none; color:var(--primary); font-size:12px; font-weight:700; text-decoration:underline; cursor:pointer; padding: 4px;">변경</button>
            </div>
            
            <!-- 동적 설문 항목 렌더링 영역 -->
            <div id="dynamic-form-fields"></div>
          </div>
        </div>

        <div class="modal-footer" id="modal-footer" style="display: none;">
          <button type="button" class="btn btn-secondary" id="btnCancelApply">취소</button>
          <button type="submit" class="btn btn-primary" id="btnSubmit">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">수강 신청 완료</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Success Popup -->
  <div class="success-popup" id="successPopup">
    <div class="success-content">
      <h2 class="success-title">수강신청 완료</h2>
      <p class="success-desc">신청서 작성이 성공적으로 완료되었습니다. 확인 후 곧 연락드리겠습니다.</p>
      <button class="btn btn-primary" style="width: 100%; justify-content: center;" id="btnCloseSuccessPopup">확인</button>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://vybrnhyaeugfwezbygdt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FxH6HGkUaKfcJD9by_TLFQ_0PJk80J9';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Global survey states
    let surveyQuestions = [];
    let selectedDateValue = '';
    let dateQuestionLabel = '';

    // 1. 배너 이미지 로드 (Storage 우선, 로컬 Fallback)
    function loadBannerImage() {
      const bannerImg = document.getElementById('class-detail-banner-img');
      const storageUrl = `${SUPABASE_URL}/storage/v1/object/public/class_applications/class_detail_banner.png?t=${Date.now()}`;
      
      bannerImg.src = storageUrl;
      bannerImg.onerror = () => {
        bannerImg.onerror = null;
        bannerImg.src = '../assets/ryzinclass_banner.png';
      };
    }

    // 2. 동적 설문 리스트 로드 및 단계별 구조 분기
    async function loadSurveyQuestions() {
      const dateListContainer = document.getElementById('date-list-container');
      const step1Area = document.getElementById('step1-area');
      const step2Area = document.getElementById('step2-area');
      const modalFooter = document.getElementById('modal-footer');
      const modalTitle = document.getElementById('applyModalTitle');

      // Reset Step
      step1Area.style.display = 'block';
      step2Area.style.display = 'none';
      modalFooter.style.display = 'none';
      modalTitle.innerText = '수강 일정 선택';
      selectedDateValue = '';
      dateQuestionLabel = '';

      try {
        const { data, error } = await supabaseClient
          .from('ryzin_class_survey_questions')
          .select('*')
          .order('sort_order', { ascending: true });

        if (error) throw error;
        
        surveyQuestions = data || [];

        // 2-1. 기수 선택 문항 찾기 (type === 'select')
        const dateQuestion = surveyQuestions.find(q => q.type === 'select');

        if (dateQuestion) {
          dateQuestionLabel = dateQuestion.label;
          const optionsList = dateQuestion.options ? dateQuestion.options.split(',') : [];
          
          if (optionsList.length > 0) {
            // 1단계 날짜 리스트 카드 렌더링
            dateListContainer.innerHTML = optionsList.map(opt => `
              <button type="button" class="date-select-btn" data-value="${opt.trim()}">
                <span>${opt.trim()}</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            `).join('');

            // 기수 선택 클릭 이벤트 바인딩
            dateListContainer.querySelectorAll('.date-select-btn').forEach(btn => {
              btn.addEventListener('click', () => {
                selectedDateValue = btn.getAttribute('data-value');
                goToStep2(selectedDateValue);
              });
            });
            return;
          }
        }

        // 만약 기수 선택박스 질문이 없다면 바로 2단계 형태로 모든 설문 렌더링
        goToStep2('');

      } catch (err) {
        console.error('설문 로드 에러:', err);
        dateListContainer.innerHTML = `
          <p style="text-align:center; color:var(--accent); font-size:13px; padding: 20px;">
            일정을 불러오지 못했습니다. 다시 시도해 주세요.
          </p>
        `;
      }
    }

    // 3. 2단계(정보 입력) 화면으로 전환
    function goToStep2(dateVal) {
      const step1Area = document.getElementById('step1-area');
      const step2Area = document.getElementById('step2-area');
      const modalFooter = document.getElementById('modal-footer');
      const modalTitle = document.getElementById('applyModalTitle');
      const selectedDateBadge = document.getElementById('selected-date-badge');
      const dynamicFieldsContainer = document.getElementById('dynamic-form-fields');

      modalTitle.innerText = '수강 신청 정보 입력';

      if (dateVal) {
        selectedDateBadge.innerText = dateVal;
        step1Area.style.display = 'none';
        step2Area.style.display = 'block';
        modalFooter.style.display = 'flex';

        // 1단계 기수 선택 문항을 제외한 나머지 문항들만 2단계에 렌더링
        const otherQuestions = surveyQuestions.filter(q => q.type !== 'select');
        renderFields(dynamicFieldsContainer, otherQuestions);
      } else {
        // 기수 문항이 아예 없을 때: 1단계를 건너뛰고 전체 렌더링
        step1Area.style.display = 'none';
        step2Area.style.display = 'block';
        modalFooter.style.display = 'flex';
        // 요약 바 숨김 처리
        selectedDateBadge.parentElement.parentElement.style.display = 'none';
        renderFields(dynamicFieldsContainer, surveyQuestions);
      }
    }

    // 4. 나머지 폼 필드 동적 렌더링
    function renderFields(container, questions) {
      container.innerHTML = '';
      if (questions.length === 0) return;

      questions.forEach(q => {
        const group = document.createElement('div');
        group.className = 'form-group';

        const label = document.createElement('label');
        label.className = 'form-label';
        label.innerText = q.label + (q.required ? ' *' : '');
        group.appendChild(label);

        const inputId = `field_${q.id}`;

        if (q.type === 'textarea') {
          const textarea = document.createElement('textarea');
          textarea.className = 'form-textarea';
          textarea.id = inputId;
          textarea.placeholder = q.placeholder || '';
          textarea.required = q.required;
          group.appendChild(textarea);
        }
        else if (q.type === 'file') {
          const wrapper = document.createElement('div');
          wrapper.className = 'file-input-wrapper';
          wrapper.innerHTML = `
            <label class="file-input-btn" for="${inputId}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span id="${inputId}_btn_text">사진 선택하기 (선택 사항)</span>
            </label>
            <input type="file" id="${inputId}" accept="image/*" style="display: none;" ${q.required ? 'required' : ''}>
            <img id="${inputId}_preview" class="file-preview" alt="미리보기">
          `;
          
          setTimeout(() => {
            const fileInput = document.getElementById(inputId);
            const previewImg = document.getElementById(`${inputId}_preview`);
            const btnText = document.getElementById(`${inputId}_btn_text`);
            
            fileInput.addEventListener('change', (e) => {
              const file = e.target.files[0];
              if (file) {
                btnText.innerText = '사진 선택 완료';
                const reader = new FileReader();
                reader.onload = (ev) => {
                  previewImg.src = ev.target.result;
                  previewImg.style.display = 'block';
                };
                reader.readAsDataURL(file);
              } else {
                btnText.innerText = '사진 선택하기 (선택 사항)';
                previewImg.src = '';
                previewImg.style.display = 'none';
              }
            });
          }, 0);

          group.appendChild(wrapper);
        }
        else if (q.type === 'tel') {
          const input = document.createElement('input');
          input.type = 'tel';
          input.className = 'form-input';
          input.id = inputId;
          input.placeholder = q.placeholder || '010-0000-0000';
          input.required = q.required;
          input.maxLength = 13;

          input.addEventListener('input', (e) => {
            let val = e.target.value.replace(/[^0-9]/g, '');
            if (val.length > 3 && val.length <= 7) {
              val = val.slice(0, 3) + '-' + val.slice(3);
            } else if (val.length > 7) {
              val = val.slice(0, 3) + '-' + val.slice(3, 7) + '-' + val.slice(7, 11);
            }
            e.target.value = val;
          });

          group.appendChild(input);
        }
        else {
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'form-input';
          input.id = inputId;
          input.placeholder = q.placeholder || '';
          input.required = q.required;
          group.appendChild(input);
        }

        container.appendChild(group);
      });
    }

    // Modal Control
    const applyModalOverlay = document.getElementById('applyModalOverlay');
    const btnOpenApplyModal = document.getElementById('btnOpenApplyModal');
    const btnCloseApplyModal = document.getElementById('btnCloseApplyModal');
    const btnCancelApply = document.getElementById('btnCancelApply');
    const btnBackToStep1 = document.getElementById('btn-back-to-step1');

    const openModalFunc = () => {
      applyModalOverlay.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      loadSurveyQuestions();
    };

    const closeModalFunc = () => {
      applyModalOverlay.style.display = 'none';
      document.body.style.overflow = '';
    };

    btnOpenApplyModal.addEventListener('click', openModalFunc);
    btnCloseApplyModal.addEventListener('click', closeModalFunc);
    btnCancelApply.addEventListener('click', closeModalFunc);

    // 2단계에서 1단계로 돌아가기 (기수 재선택)
    btnBackToStep1.addEventListener('click', () => {
      document.getElementById('step1-area').style.display = 'block';
      document.getElementById('step2-area').style.display = 'none';
      document.getElementById('modal-footer').style.display = 'none';
      document.getElementById('applyModalTitle').innerText = '수강 일정 선택';
    });

    applyModalOverlay.addEventListener('click', (e) => {
      if (e.target === applyModalOverlay) closeModalFunc();
    });

    // Form Submit (동적 답변 + 1단계 기수 선택 병합 제출)
    const form = document.getElementById('applyForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const successPopup = document.getElementById('successPopup');
    const btnCloseSuccessPopup = document.getElementById('btnCloseSuccessPopup');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      btnSubmit.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = '제출 중...';

      try {
        const answers = {};
        let name = '';
        let phone = '';
        let photoUrl = '';
        let photoFile = null;

        // 1단계 날짜 선택 값 대입
        if (dateQuestionLabel && selectedDateValue) {
          answers[dateQuestionLabel] = selectedDateValue;
        }

        // 2단계 수집 데이터 병합
        const otherQuestions = surveyQuestions.filter(q => q.type !== 'select');
        for (const q of otherQuestions) {
          const inputId = `field_${q.id}`;
          const el = document.getElementById(inputId);
          if (!el) continue;

          if (q.type === 'file') {
            photoFile = el.files[0];
          } else {
            const val = el.value.trim();
            answers[q.label] = val;

            if (q.label === '이름') name = val;
            if (q.label === '전화번호') phone = val;
          }
        }

        // Fallback 매핑
        if (!name) {
          const firstTxt = surveyQuestions.find(q => q.type === 'text');
          if (firstTxt) name = document.getElementById(`field_${firstTxt.id}`).value.trim();
        }
        if (!phone) {
          const firstTel = surveyQuestions.find(q => q.type === 'tel');
          if (firstTel) phone = document.getElementById(`field_${firstTel.id}`).value.trim();
        }

        if (!name) name = '익명 신청자';
        if (!phone) phone = '010-0000-0000';

        // 스토리지 사진 업로드
        if (photoFile) {
          const fileExt = photoFile.name.split('.').pop();
          const cleanFileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
          const filePath = `${cleanFileName}`;

          const { data: uploadData, error: uploadError } = await supabaseClient
            .storage
            .from('class_applications')
            .upload(filePath, photoFile);

          if (uploadError) throw new Error('사진 업로드 실패: ' + uploadError.message);

          const { data: urlData } = supabaseClient
            .storage
            .from('class_applications')
            .getPublicUrl(filePath);

          photoUrl = urlData.publicUrl;
          answers['사진 첨부'] = photoUrl;
        }

        // 데이터 삽입
        const { data, error } = await supabaseClient
          .from('ryzin_class_applications')
          .insert([
            { 
              name: name, 
              phone: phone, 
              answers: answers,
              photo_url: photoUrl
            }
          ]);

        if (error) throw error;

        closeModalFunc();
        successPopup.style.display = 'flex';
        form.reset();

      } catch (err) {
        console.error('제출 에러:', err);
        alert('신청 접수 중 문제가 발생했습니다: ' + err.message);
      } finally {
        btnSubmit.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = '수강 신청 완료';
      }
    });

    btnCloseSuccessPopup.addEventListener('click', () => {
      successPopup.style.display = 'none';
    });

    // 초기화
    loadBannerImage();
  </script>
</body>
</html>
