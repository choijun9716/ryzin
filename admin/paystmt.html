<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>지급명세서 — RYZIN</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:   #0a0a0a;
      --ink-2: #3d3d3d;
      --ink-3: #7a7a7a;
      --ink-4: #b0b0b0;
      --line:  #e8e8e8;
      --bg:    #f7f7f7;
      --white: #ffffff;
      --f: 'DM Sans', 'Noto Sans KR', system-ui, sans-serif;
      --r4: 4px; --r8: 8px; --r12: 12px; --r16: 16px;
    }

    html { -webkit-font-smoothing: antialiased; }

    body {
      font-family: var(--f);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ─── TOPBAR ─── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: rgba(247,247,247,0.85);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 56px;
    }

    .topbar-logo {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ink);
      text-transform: uppercase;
    }

    .topbar-actions { display: flex; gap: 6px; }

    .tbtn {
      font-family: var(--f);
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1;
      padding: 0 14px;
      height: 34px;
      border-radius: var(--r8);
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink-2);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color .15s, background .15s, color .15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      white-space: nowrap;
      text-decoration: none;
    }
    .tbtn:hover { border-color: var(--ink-3); color: var(--ink); }
    .tbtn.fill  { background: var(--ink); border-color: var(--ink); color: var(--white); }
    .tbtn.fill:hover { background: var(--ink-2); border-color: var(--ink-2); }

    /* ─── PAGE WRAPPER ─── */
    .page {
      width: 100%;
      max-width: 760px;
      padding: 40px 24px 80px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* ─── HERO BAND ─── */
    .hero {
      background: var(--ink);
      color: var(--white);
      border-radius: var(--r16) var(--r16) 0 0;
      padding: 36px 36px 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .hero-left {}
    .hero-eyebrow {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 10px;
    }
    .hero-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--white);
    }

    .hero-right { text-align: right; }
    .hero-brand {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 6px;
    }
    .hero-date {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.75);
    }

    /* ─── META BAND ─── */
    .meta-band {
      background: var(--white);
      padding: 22px 36px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 0 0 20px;
      border-left: 1px solid var(--line);
    }
    .meta-item:first-child { padding-left: 0; border-left: none; }

    .meta-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-4);
    }
    .meta-val {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
    }

    /* ─── TABLE SECTION ─── */
    .table-band {
      background: var(--white);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-4);
      padding: 20px 36px 10px;
      border-bottom: 1px solid var(--line);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    thead th {
      padding: 11px 12px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-4);
      background: var(--white);
      border-bottom: 1px solid var(--line);
      text-align: center;
    }
    thead th:first-child { text-align: left; padding-left: 36px; }
    thead th:last-child  { padding-right: 36px; }

    tbody td {
      padding: 13px 12px;
      color: var(--ink-2);
      font-weight: 400;
      border-bottom: 1px solid var(--line);
      text-align: center;
    }
    tbody td:first-child { text-align: left; padding-left: 36px; font-weight: 600; color: var(--ink); }
    tbody td:last-child  { padding-right: 36px; font-weight: 700; color: var(--ink); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .1s; }
    tbody tr:hover td { background: #fafafa; }

    .tc { text-align: center !important; }
    .tr { text-align: right  !important; }
    .tl { text-align: left   !important; }
    .muted { color: var(--ink-4) !important; font-weight: 400 !important; }

    /* ─── TOTALS BAND ─── */
    .totals-band {
      background: #f0f0f0;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 18px 36px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }

    .total-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-start;
      padding-left: 20px;
      border-left: 1px solid var(--line);
    }
    .total-item:first-child { padding-left: 0; border-left: none; }

    .total-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-4);
    }
    .total-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .total-val.highlight { font-size: 20px; }

    /* ─── FOOTER BAND ─── */
    .footer-band {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 0 0 var(--r16) var(--r16);
      padding: 24px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-notice {
      font-size: 11.5px;
      color: var(--ink-4);
      line-height: 1.7;
    }
    .footer-notice strong { color: var(--ink-3); font-weight: 500; }

    .stamp-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .stamp-caption {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--ink-4);
      text-transform: uppercase;
    }
    .seal-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .seal-img {
      width: 68px;
      height: 68px;
      object-fit: contain;
      display: block;
    }
    .topbar-logo-img {
      height: 28px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      background: var(--ink);
      color: var(--white);
      font-size: 13px;
      font-weight: 500;
      padding: 12px 20px;
      border-radius: 100px;
      pointer-events: none;
      transition: opacity .2s, transform .25s cubic-bezier(.34,1.56,.64,1);
      z-index: 9999;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── MOBILE ─── */
    @media (max-width: 600px) {
      .topbar { padding: 0 16px; height: 52px; }
      .tbtn span { display: none; } /* 텍스트 숨기고 아이콘만 */
      .tbtn { padding: 0 12px; }

      .page { padding: 16px 12px 60px; gap: 1px; }

      .hero {
        padding: 28px 20px 24px;
        border-radius: var(--r12) var(--r12) 0 0;
        flex-direction: column;
        gap: 20px;
        align-items: flex-start;
      }
      .hero-title { font-size: 26px; }
      .hero-right { text-align: left; }

      .meta-band {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 16px 12px;
      }
      .meta-item {
        padding-left: 8px;
        border-left: 1px solid var(--line);
      }
      .meta-item:first-child { padding-left: 0; border-left: none; }
      .meta-label { font-size: 9.5px; letter-spacing: 0.05em; }
      .meta-val { font-size: 11.5px; word-break: break-all; }

      .section-label {
        padding: 18px 20px 14px;
        margin-bottom: 14px;
      }

      /* 테이블 → 카드 */
      table, thead, tbody, tfoot, th, td, tr { display: block; }
      thead { display: none; }

      tbody tr {
        margin: 0 12px 14px;
        border: 1px solid var(--line);
        border-radius: var(--r8);
        overflow: hidden;
      }
      tbody tr:first-child { margin-top: 4px; }
      tbody tr:last-child { margin-bottom: 16px; }

      tbody td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px !important;
        text-align: right !important;
        border-bottom: 1px solid var(--line) !important;
        font-size: 13px;
        color: var(--ink-2);
      }
      tbody td:last-child { border-bottom: none !important; }
      tbody tr td:first-child {
        background: #f9f9f9;
        font-size: 14px;
        font-weight: 700 !important;
        color: var(--ink) !important;
        justify-content: flex-start;
        text-align: left !important;
      }
      tbody td::before {
        content: attr(data-label);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-4);
        flex-shrink: 0;
      }
      tbody td:first-child::before { display: none; }

      /* 총지급액, 3.3% 공제, 실지급액 오른쪽 정렬 */
      .totals-band {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 18px 20px;
      }
      .total-item {
        padding-left: 0;
        border-left: none;
        border-top: 1px solid var(--line);
        padding-top: 12px;
        align-items: flex-end;
        text-align: right;
      }
      .total-item:first-child { border-top: none; padding-top: 0; }
      .total-val.highlight { font-size: 24px; }

      .footer-band {
        flex-direction: column;
        gap: 20px;
        align-items: flex-start;
        padding: 20px;
        border-radius: 0 0 var(--r12) var(--r12);
      }
      .stamp-wrap { align-self: flex-end; }
    }

    /* ─── PRINT ─── */
    @media print {
      body { background: white; }
      .topbar, .toast { display: none !important; }
      .page { padding: 0; max-width: 100%; }
      .hero { border-radius: 0 !important; }
      .footer-band { border-radius: 0 !important; }
      @page { size: A4; margin: 12mm 14mm; }
    }
  </style>
</head>

  <div class="toast" id="toast"></div>

  <script>
    /* decode URL-safe base64 → object */
    function decode(s) {
      if (!s) return null;
      try {
        let b = s.replace(/-/g,'+').replace(/_/g,'/');
        while (b.length%4) b+='=';
        const parsed = JSON.parse(decodeURIComponent(
          Array.prototype.map.call(atob(b), c =>
            '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)
          ).join('')
        ));

        // 단축 스키마 (n: recipientName, b: birthDate, ph: phone, p: paymentDate, i: [[date, detail, amount], ...])
        if (parsed && (parsed.n !== undefined || parsed.i !== undefined)) {
          const recipientName = parsed.n || '쇼호스트';
          const birthDate = parsed.b || '';
          const phone = parsed.ph || '';
          const paymentDate = parsed.p || '';
          const items = (parsed.i || []).map(row => {
            const date = row[0] || '';
            const detail = row[1] || '';
            const amount = typeof row[2] === 'number' ? row[2] : (parseInt(row[2], 10) || 0);
            const tax = Math.floor(amount * 0.033);
            const netAmount = amount - tax;
            return { name: recipientName, date, detail, amount, tax, netAmount };
          });
          const totalAmount = items.reduce((s, it) => s + it.amount, 0);
          const totalTax = items.reduce((s, it) => s + it.tax, 0);
          const totalNet = totalAmount - totalTax;

          return {
            paymentDate,
            recipientName,
            birthDate,
            phone,
            company: { name: '라이진', bizNo: '821-29-01197', ceo: '채이준', email: 'choijun@ryzincorp.com' },
            items,
            totals: { amount: totalAmount, tax: totalTax, netAmount: totalNet }
          };
        }

        return parsed;
      } catch { return null; }
    }

    const SAMPLE = {
      paymentDate: '2026-05-29',
      recipientName: '임란희',
      company: { name:'라이진', bizNo:'821-29-01197', ceo:'채이준', email:'choijun@ryzincorp.com' },
      items: [{name:'임란희',date:'2026-04-09',startTime:'20:00',endTime:'21:00',detail:'쏘랩',amount:200000,tax:6600,netAmount:193400}],
      totals: { amount:200000, tax:6600, netAmount:193400 }
    };

    const raw = decode(new URLSearchParams(location.search).get('d'));
    const d   = (raw?.items?.length) ? raw : SAMPLE;
    const fmt = n => (n||0).toLocaleString('ko-KR');

    /* meta */
    const rawBirth = (d.birthDate || '').toString().replace(/[^0-9]/g, '');
    const cleanBirth = rawBirth.length >= 6 ? rawBirth.slice(0, 6) : (d.birthDate || '—');
    document.getElementById('recipient-name').textContent = d.recipientName || d.items[0]?.name || '—';
    document.getElementById('birth-date').textContent     = cleanBirth       || '—';
    document.getElementById('phone-no').textContent        = d.phone         || '—';
    document.getElementById('payment-date').textContent    = d.paymentDate   || '—';

    /* table */
    const tbody = document.getElementById('table-body');
    d.items.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="tl" data-label="브랜드">${item.detail || item.name || ''}</td>
        <td class="tc" data-label="방송일">${item.date || ''}</td>
        <td class="tr" data-label="지급액">${fmt(item.amount)}</td>
        <td class="tr muted" data-label="3.3% 공제">${fmt(item.tax)}</td>
        <td class="tr" data-label="실지급액">${fmt(item.netAmount)}</td>
      `;
      tbody.appendChild(tr);
    });

    /* totals */
    const tg = document.getElementById('total-gross');
    const tt = document.getElementById('total-tax');
    const tn = document.getElementById('total-net');
    tg.textContent = fmt(d.totals?.amount);
    tt.textContent = fmt(d.totals?.tax);
    tn.textContent = fmt(d.totals?.netAmount);

    /* toast */
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }

    document.getElementById('btn-print').onclick = () => window.print();
  </script>
</body>
</html>
