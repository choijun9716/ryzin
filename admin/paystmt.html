<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지급명세서 - RYZIN</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      --text-main: #111111;
      --border-dark: #000000;
      --header-bg: #000000;
      --header-text: #ffffff;
      --stamp-color: #d93025;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: #f4f5f7;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* 상단 액션 툴바 (인쇄 시 숨김) */
    .toolbar {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      padding: 14px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .toolbar-title {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 8px;
      border: 1px solid #d0d5dd;
      background: #ffffff;
      color: #344054;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #f9fafb;
      border-color: #b8c1cc;
    }

    .btn-primary {
      background: #000000;
      color: #ffffff;
      border-color: #000000;
    }

    .btn-primary:hover {
      background: #222222;
      border-color: #222222;
    }

    /* 지급명세서 A4 용지 컨테이너 */
    .statement-container {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      padding: 50px 55px;
      border-radius: 4px;
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.07);
      position: relative;
      min-height: 600px;
    }

    /* 명세서 헤더 */
    .statement-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      padding-top: 10px;
    }

    .statement-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #000000;
      text-align: center;
    }

    .brand-logo {
      position: absolute;
      right: 0;
      top: 0;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #000000;
    }

    /* 회사 및 지급 정보 */
    .company-info {
      margin-bottom: 25px;
      font-size: 14px;
      line-height: 1.75;
      color: #000000;
    }

    .info-row {
      display: flex;
      gap: 8px;
    }

    .info-label {
      font-weight: 700;
      min-width: 110px;
    }

    .info-value {
      font-weight: 500;
    }

    /* 테이블 스타일 */
    .statement-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 25px;
      font-size: 13px;
    }

    .statement-table th,
    .statement-table td {
      border: 1.5px solid #000000;
      padding: 10px 8px;
      vertical-align: middle;
    }

    .statement-table th {
      background-color: #000000;
      color: #ffffff;
      font-weight: 700;
      text-align: center;
      font-size: 13px;
    }

    .statement-table td {
      background-color: #ffffff;
      color: #000000;
      font-weight: 500;
    }

    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .text-bold { font-weight: 700 !important; }

    .totals-row td {
      font-weight: 700;
      background-color: #ffffff;
    }

    /* 하단 연관 안내 및 직인 */
    .statement-footer {
      margin-top: 30px;
    }

    .notice-text {
      font-size: 12.5px;
      font-weight: 500;
      color: #111111;
      margin-bottom: 45px;
    }

    .sign-section {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      margin-top: 20px;
    }

    .sign-text {
      font-size: 14.5px;
      font-weight: 600;
      color: #000000;
      letter-spacing: 0.5px;
    }

    /* 직인 도장 SVG */
    .official-stamp {
      width: 58px;
      height: 58px;
      display: inline-block;
      user-select: none;
    }

    /* 토스트 메시지 */
    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #111111;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 9999;
    }

    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 인쇄 전용 스타일 (@media print) */
    @media print {
      body {
        background-color: #ffffff;
        padding: 0;
      }
      .toolbar, .toast-msg {
        display: none !important;
      }
      .statement-container {
        box-shadow: none;
        border-radius: 0;
        padding: 40px 30px;
        max-width: 100%;
        width: 100%;
      }
      @page {
        size: A4 portrait;
        margin: 15mm 10mm;
      }
    }
  </style>
</head>
<body>

  <!-- 인쇄 및 공유 액션 툴바 -->
  <div class="toolbar">
    <div class="toolbar-title">
      <span>라이진 쇼호스트 지급명세서</span>
    </div>
    <div class="toolbar-actions">
      <button class="btn" id="btn-copy-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        링크 복사
      </button>
      <button class="btn" id="btn-copy-text">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        전송 문구 복사
      </button>
      <button class="btn btn-primary" id="btn-print">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        PDF 저장 / 인쇄
      </button>
    </div>
  </div>

  <!-- A4 지급명세서 본문 컨테이너 -->
  <div class="statement-container" id="statement-card">
    <div class="statement-header">
      <h1 class="statement-title">지급명세서</h1>
      <div class="brand-logo">RYZIN</div>
    </div>

    <div class="company-info">
      <div class="info-row"><span class="info-label">회사명:</span><span class="info-value" id="comp-name">라이진</span></div>
      <div class="info-row"><span class="info-label">사업자등록번호:</span><span class="info-value" id="comp-bizno">821-29-01197</span></div>
      <div class="info-row"><span class="info-label">대표자명:</span><span class="info-value" id="comp-ceo">채이준</span></div>
      <div class="info-row"><span class="info-label">지급일:</span><span class="info-value" id="payment-date">2026-05-29</span></div>
    </div>

    <table class="statement-table">
      <thead>
        <tr>
          <th style="width: 11%;">성명</th>
          <th style="width: 15%;">방송일</th>
          <th style="width: 11%;">시작시간</th>
          <th style="width: 11%;">종료시간</th>
          <th style="width: 14%;">업무상세</th>
          <th style="width: 13%;">총 지급액(원)</th>
          <th style="width: 12.5%;">3.3% 공제(원)</th>
          <th style="width: 12.5%;">실지급액(원)</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- 동적 파싱 행 출력 -->
      </tbody>
      <tfoot>
        <tr class="totals-row">
          <td colspan="5" class="text-center text-bold">합계</td>
          <td class="text-right text-bold" id="total-amount">0</td>
          <td class="text-right text-bold" id="total-tax">0</td>
          <td class="text-right text-bold" id="total-net">0</td>
        </tr>
      </tfoot>
    </table>

    <div class="statement-footer">
      <div class="notice-text">
        ※ 지급에 문제가 있을 경우 <span id="comp-email">choijun@ryzincorp.com</span> 으로 연락해 주세요.
      </div>
      <div class="sign-section">
        <span class="sign-text">위 금액을 이상과 같이 지급함.</span>
        <!-- 라이진 채이준 직인 도장 SVG -->
        <svg class="official-stamp" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="5" width="90" height="90" rx="16" stroke="#D93025" stroke-width="4.5"/>
          <rect x="9" y="9" width="82" height="82" rx="12" stroke="#D93025" stroke-width="1.8"/>
          <!-- 직인 한자/한글 도장 형태 "라이진 채이준 인" -->
          <text x="50" y="38" font-family="'Pretendard', sans-serif" font-size="20" font-weight="900" fill="#D93025" text-anchor="middle" letter-spacing="1">라이진</text>
          <text x="50" y="62" font-family="'Pretendard', sans-serif" font-size="18" font-weight="900" fill="#D93025" text-anchor="middle" letter-spacing="1">채이준</text>
          <text x="50" y="80" font-family="'Pretendard', sans-serif" font-size="13" font-weight="800" fill="#D93025" text-anchor="middle" letter-spacing="2">(인)</text>
        </svg>
      </div>
    </div>
  </div>

  <div class="toast-msg" id="toast">메시지가 복사되었습니다.</div>

  <script>
    // URL 파라미터 디코더 (독립 인라인 실행)
    function decodePayslipData(encodedStr) {
      if (!encodedStr) return null;
      try {
        let base64 = encodedStr.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) {
          base64 += '=';
        }
        const jsonStr = decodeURIComponent(Array.prototype.map.call(atob(base64), c => {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonStr);
      } catch (e) {
        console.error('Payslip decode error:', e);
        return null;
      }
    }

    // 기본 예시 데이터 (URL 파라미터가 없을 때 표출)
    const SAMPLE_PAYSLIP = {
      paymentDate: '2026-05-29',
      recipientName: '임란희',
      company: {
        name: '라이진',
        bizNo: '821-29-01197',
        ceo: '채이준',
        email: 'choijun@ryzincorp.com'
      },
      items: [
        {
          name: '임란희',
          date: '2026-04-09',
          startTime: '20:00',
          endTime: '21:00',
          detail: '쏘랩',
          amount: 200000,
          tax: 6600,
          netAmount: 193400
        }
      ],
      totals: {
        amount: 200000,
        tax: 6600,
        netAmount: 193400
      }
    };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function formatNumber(num) {
      return (num || 0).toLocaleString('ko-KR');
    }

    // URL 파라미터 디코딩
    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('d');
    
    let payslipData = SAMPLE_PAYSLIP;

    if (dataParam) {
      const decoded = decodePayslipData(dataParam);
      if (decoded && decoded.items && decoded.items.length > 0) {
        payslipData = decoded;
      }
    }

    // 데이터 DOM 바인딩
    document.getElementById('comp-name').innerText = payslipData.company?.name || '라이진';
    document.getElementById('comp-bizno').innerText = payslipData.company?.bizNo || '821-29-01197';
    document.getElementById('comp-ceo').innerText = payslipData.company?.ceo || '채이준';
    document.getElementById('comp-email').innerText = payslipData.company?.email || 'choijun@ryzincorp.com';
    document.getElementById('payment-date').innerText = payslipData.paymentDate || new Date().toISOString().split('T')[0];

    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';

    payslipData.items.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="text-center">${item.name || ''}</td>
        <td class="text-center">${item.date || ''}</td>
        <td class="text-center">${item.startTime || ''}</td>
        <td class="text-center">${item.endTime || ''}</td>
        <td class="text-center">${item.detail || ''}</td>
        <td class="text-right">${formatNumber(item.amount)}</td>
        <td class="text-right">${formatNumber(item.tax)}</td>
        <td class="text-right">${formatNumber(item.netAmount)}</td>
      `;
      tbody.appendChild(tr);
    });

    // 합계 바인딩
    document.getElementById('total-amount').innerText = formatNumber(payslipData.totals?.amount || 0);
    document.getElementById('total-tax').innerText = formatNumber(payslipData.totals?.tax || 0);
    document.getElementById('total-net').innerText = formatNumber(payslipData.totals?.netAmount || 0);

    // 이벤트 리스너 설정
    document.getElementById('btn-print').addEventListener('click', () => {
      window.print();
    });

    document.getElementById('btn-copy-link').addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href).then(() => {
        showToast('명세서 링크가 클립보드에 복사되었습니다.');
      }).catch(() => {
        showToast('복사에 실패했습니다.');
      });
    });

    document.getElementById('btn-copy-text').addEventListener('click', () => {
      const recipient = payslipData.recipientName || payslipData.items[0]?.name || '쇼호스트';
      const paymentDate = payslipData.paymentDate || '';
      const totalNet = formatNumber(payslipData.totals?.netAmount || 0);
      const link = window.location.href;

      const messageText = `[라이진] ${recipient} 님, 방송 지급명세서가 도착했습니다.\n\n` +
        `· 지급일: ${paymentDate}\n` +
        `· 실지급액: ${totalNet}원\n\n` +
        `아래 링크를 클릭하여 상세 지급명세서를 확인하실 수 있습니다:\n${link}`;

      navigator.clipboard.writeText(messageText).then(() => {
        showToast('안내 문구가 클립보드에 복사되었습니다.');
      }).catch(() => {
        showToast('복사에 실패했습니다.');
      });
    });
  </script>
</body>
</html>
