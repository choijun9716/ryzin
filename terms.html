            <div class="nav-actions" style="display:flex; align-items:center; gap:8px;">

                    <button id="langToggleBtn" class="btn btn-pill-outline"
                        style="padding:8px 12px; font-size:0.85rem; min-width:48px;">KO</button>
                    <div id="langMenu" class="lang-menu"
                        style="display:none; position:absolute; top:110%; right:0; background:#111; border:1px solid rgba(255,255,255,0.1); border-radius:8px; overflow:hidden; z-index:100; min-width:60px;">
                        <a href="#" data-lang="ko"
                            style="display:block; padding:8px; color:#fff; text-align:center; text-decoration:none; transition:background 0.2s;">KO</a>
                        <a href="#" data-lang="en"

                    </div>
                </div>
                <button class="mobile-menu-btn"><i data-feather="menu"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main style="padding-top: 140px; padding-bottom: 80px; min-height: 70vh;">
        <div class="container container-md" style="max-width: 800px; margin: 0 auto; padding: 0 20px;">
            <div style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 24px; margin-bottom: 40px;">
                <h1 id="legalTitle" style="color: #fff; font-size: 32px; font-weight: 800; font-family: 'Pretendard', sans-serif;">로딩 중...</h1>
                <p id="effectiveDate" style="color: #888; font-size: 14px; margin-top: 12px; font-family: 'Pretendard', sans-serif;"></p>
            </div>
            
            <div id="legalContent" style="color: #ccc; line-height: 1.8; font-size: 15px; font-family: 'Pretendard', sans-serif;">
                <!-- terms.json 데이터가 여기에 렌더링됩니다. -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="minimal-footer">
        <div class="container">
            <div class="footer-flex">
                <div class="f-brand">
                    <img src="./assets/logo.png" alt="RYZIN" loading="lazy"
                        style="height: 32px; width: auto; opacity: 0.8; margin-bottom: 8px;">
                    <p class="text-muted mt-2" data-i18n="f_info">
                        대표 : 채이준 <br>
                        사업자 등록번호 : 821-29-011-97<br>
                        주소 : 경기도 하남시 미사강변동로 100-1 미사역 파라곤스퀘어 2064-2<br>
                        이메일 : choijun@ryzincorp.com</p>
                </div>
                <div class="f-links">
                    <a href="https://www.instagram.com/ryzin_live?igsh=MW9pMHp3dHF5aXVueA%3D%3D&utm_source=qr"
                        data-i18n="f_insta">인스타그램</a>
                    <a href="https://blog.naver.com/ryzin_live" data-i18n="f_blog">블로그</a>
                    <a href="./career/jobs/" data-i18n="f_career">채용</a>
                    <a href="#" data-i18n="f_apply_showhost">쇼호스트 지원</a>
                </div>
            </div>
            <div class="footer-divider"></div>
            <div class="footer-bottom">
                <p class="text-muted" data-i18n="f_copy">© 2025 RYZIN Production. All rights reserved.</p>
                <div class="f-legal">
                    <a href="./terms.html" data-i18n="f_terms">이용약관</a>
                    <a href="./privacy.html" class="text-pure" data-i18n="f_privacy">개인정보처리방침</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Main Logic for loading JSON and dynamic rendering -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const dataUrl = "./terms.json";
            fetch(dataUrl)
                .then(res => {
                    if (!res.ok) throw new Error("네트워크 응답 실패");
                    return res.json();
                })
                .then(data => {
                    document.getElementById("legalTitle").innerText = data.title;
                    document.title = `${data.title} | 라이진 스튜디오`;
                    document.getElementById("effectiveDate").innerText = data.effectiveDate;
                    
                    let html = "";
                    data.sections.forEach(sec => {
                        html += `
                            <div style="margin-bottom: 35px;">
                                <h3 style="color: #fff; font-size: 18px; font-weight: 700; margin-bottom: 15px;">${sec.heading}</h3>
                                ${sec.paragraphs.map(p => `<p style="margin-bottom: 10px; color: rgba(255,255,255,0.7);">${p}</p>`).join('')}
                            </div>
                        `;
                    });
                    document.getElementById("legalContent").innerHTML = html;
                })
                .catch(err => {
                    console.error("데이터 로드 실패:", err);
                    document.getElementById("legalTitle").innerText = "이용약관";
                    document.getElementById("legalContent").innerText = "내용을 불러오는 도중 오류가 발생했습니다. terms.json 파일 구성을 확인해 주세요.";
                });
        });
    </script>

    <!-- UI Interaction and multi-language script -->
    <script defer src="script.js"></script>
</body>
</html>
