<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RYZIN 3D 로또 방송 리모컨 컨트롤러 (Remote Controller)</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Controller Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="controller-page">

  <div class="controller-container">
    <!-- Header -->
    <header class="controller-header">
      <div class="brand">
        <i class="fa-solid fa-gamepad brand-icon"></i>
        <h1>RYZIN LOTTO REMOTE</h1>
      </div>
      <div class="status-badge" id="sync-status">
        <span class="status-dot"></span> 동기화 연결됨
      </div>
    </header>

    <!-- Quick Action Links & Display View Launcher -->
    <div class="launcher-banner">
      <a href="display.html" target="_blank" class="btn-launch">
        <i class="fa-solid fa-tv"></i> OBS 송출 화면 (display.html) 새 창 열기
      </a>
      <span class="tip-text">이 리모컨에서 클릭하면 OBS 송출 화면에서 즉시 3D 공이 굴러갑니다.</span>
    </div>

    <!-- Chroma Key Color Switcher -->
    <section class="ctrl-card">
      <h2><i class="fa-solid fa-palette"></i> OBS 크로마키 배경 선택</h2>
      <div class="chroma-grid">
        <button class="ctrl-bg-btn active" data-bg="greenscreen" style="--btn-color: #00FF00;">
          <span class="dot"></span> 그린스크린
        </button>
        <button class="ctrl-bg-btn" data-bg="bluescreen" style="--btn-color: #0000FF;">
          <span class="dot"></span> 블루스크린
        </button>
        <button class="ctrl-bg-btn" data-bg="transparent" style="--btn-color: #555;">
          <span class="dot"></span> 투명 배경
        </button>
        <button class="ctrl-bg-btn" data-bg="studio" style="--btn-color: #1e1b4b;">
          <span class="dot"></span> 3D 스튜디오
        </button>
      </div>
    </section>

    <!-- Interactive 1-45 Number Board -->
    <section class="ctrl-card">
      <div class="card-header-row">
        <h2><i class="fa-solid fa-grid-2"></i> 번호 클릭 즉시 3D 공 구르기</h2>
        <span class="drawn-count" id="drawn-count-text">추첨 0 / 7</span>
      </div>
      <div class="ctrl-number-grid" id="ctrl-number-grid">
        <!-- 1 to 45 buttons generated by JS -->
      </div>
    </section>

    <!-- Controls & Camera Settings -->
    <section class="ctrl-card">
      <h2><i class="fa-solid fa-sliders"></i> 추첨 및 3D 제어</h2>
      
      <div class="main-actions">
        <button id="btn-ctrl-one" class="btn-ctrl accent">
          <i class="fa-solid fa-bolt"></i> 1개 추첨 (Space)
        </button>
        <button id="btn-ctrl-all" class="btn-ctrl primary">
          <i class="fa-solid fa-play"></i> 전체 자동 추첨
        </button>
        <button id="btn-ctrl-reset" class="btn-ctrl danger">
          <i class="fa-solid fa-rotate-left"></i> 초기화 (R)
        </button>
      </div>

      <div class="ctrl-settings-grid">
        <div class="setting-item">
          <label><i class="fa-solid fa-camera"></i> 3D 시점 선택:</label>
          <select id="select-ctrl-camera">
            <option value="cinematic">🎬 시네마틱 추적 뷰</option>
            <option value="front">📺 정면 방송 뷰</option>
            <option value="track">🎢 트랙 밀착 뷰</option>
            <option value="top">🔝 믹싱 챔버 탑 뷰</option>
          </select>
        </div>
        <div class="setting-item">
          <label><i class="fa-solid fa-stopwatch"></i> 추첨 속도 (초): <span id="val-ctrl-speed">2.5</span>초</label>
          <input type="range" id="input-ctrl-speed" min="1.5" max="5" step="0.5" value="2.5">
        </div>
      </div>
    </section>

    <!-- Sound Toggle -->
    <div class="bottom-tools">
      <button id="btn-ctrl-sound" class="btn-tool-ctrl">
        <i class="fa-solid fa-volume-high"></i> 사운드 토글
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/remote.js"></script>
  <script src="js/control_app.js"></script>
</body>
</html>
