<!DOCTYPE html>
<html lang="ko" class="embed-mode-active">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ryzin Live Widget Viewer</title>
  <link rel="icon" type="image/png" href="/favicon.png">

  <!-- HLS.js for m3u8 playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <link rel="stylesheet" href="live.css?v=202608052153">
  <style>
    /* 임베드 독립 뷰어 전용 100% 가득 참 무적 CSS 스펙 */
    html, body {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: #000 !important;
      display: block !important;
    }

    .live-container {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      margin: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
    }

    /* 임베드 모드에서는 위젯 배너 및 스플래시 제거 */
    #live-floating-banner, #btn-close-widget, #btn-close-live, #splash-screen {
      display: none !important;
    }
  </style>

  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>

<body class="embed-mode-active embed-active-full">

  <div class="live-container">
    <!-- 비디오 영역 -->
    <div class="video-wrapper">
      <video id="live-video" autoplay muted playsinline autopictureinpicture="true"></video>

      <!-- 썸네일 오버레이 (어드민에서 방송 시작 시 숨김 처리됨) -->
      <div id="thumbnail-overlay" class="thumbnail-overlay">
        <img id="thumbnail-img" class="thumbnail-img" src="" alt="Live Thumbnail" style="display:none;">
        <div class="thumbnail-content">
          <div id="live-start-text" class="live-start-text"></div>
        </div>
      </div>

      <!-- 방송 진행 중 예비 썸네일 오버레이 (ON 설정 시 표시) -->
      <div id="standby-overlay" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; z-index:4; background:#000; align-items:center; justify-content:center; overflow:hidden;">
        <img id="standby-img" src="" alt="Standby Thumbnail" style="width:100%; height:100%; object-fit:cover;">
      </div>

      <!-- 하단 그라데이션 오버레이 (텍스트 가독성) -->
      <div class="bottom-gradient"></div>
    </div>

    <!-- UI 레이어 (비디오 위에 띄워지는 정보들) -->
    <div class="ui-layer">
      <!-- 상단 방송 정보 -->
      <div class="header">
        <div class="brand-info">
          <img src="https://ui-avatars.com/api/?name=R&background=0D8ABC&color=fff" alt="Brand Logo" class="brand-logo">
          <div class="text-side">
            <h1 class="brand-name"></h1>
            <p class="broadcast-title"></p>
          </div>
        </div>
        <!-- 대기/LIVE 뱃지 + 시청자수 (프로필 아래 인라인 배치) -->
        <div class="video-overlay">
          <div class="live-badge">LIVE</div>
          <div class="view-count"><span id="view-count">0명 시청중</span></div>
        </div>
      </div>

      <!-- 깜짝딜 타이머 배너 (제목 아래 가운데 배치) -->
      <div style="display:flex; justify-content:center; width:100%; pointer-events:none; padding-top:4px;">
        <div id="surprise-deal-timer"
          style="display:none; background:rgba(225,29,72,0.95); color:white; padding:8px 16px; border-radius:24px; font-weight:bold; font-size:14px; align-items:center; gap:6px; box-shadow:0 4px 12px rgba(225,29,72,0.4); animation: pulse 2s infinite; pointer-events:auto;">
          <span id="surprise-deal-text">깜짝딜 종료까지 00:00</span>
        </div>
      </div>

      <!-- 소통왕/구매인증 전체 당첨 축하 플로팅 배너 -->
      <div style="display:flex; justify-content:center; width:100%; pointer-events:none; padding-top:6px;">
        <div id="winner-alert-overlay"
          style="display:none; background:linear-gradient(135deg, #fab005, #ff8787); color:white; padding:8px 18px; border-radius:24px; font-weight:bold; font-size:14px; align-items:center; gap:8px; box-shadow:0 4px 15px rgba(250,176,5,0.4); animation: pulse 2s infinite; pointer-events:auto; z-index:9999;">
          <span id="winner-emoji-span" style="font-size:15px; line-height:1;">🏆</span>
          <span id="winner-text-span">소통왕 당첨: <span id="winner-name-span"
              style="text-decoration:underline; font-weight:900; font-size:14px; margin-right:2px; color:#fff;"></span>님!
            축하드립니다!</span>
        </div>
      </div>

      <!-- 상품 모달 (숨김 상태) -->
      <div id="product-modal" class="product-modal hidden">
        <div class="modal-header">
          <h2>방송 중 특가 상품</h2>
          <button id="btn-close-modal" class="btn-close">✕</button>
        </div>
        <div class="modal-body" id="modal-products-list">
          <!-- JS에서 렌더링됨 -->
        </div>
      </div>

      <!-- 채팅 영역 -->
      <div class="chat-section">
        <div class="chat-messages" id="chat-messages">
          <!-- JS에서 렌더링됨 -->
        </div>
      </div>

      <!-- 사이드 액션 버튼 (우측 하단 플로팅) -->
      <div class="side-actions">
        <button class="action-btn" id="btn-like">
          <span class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
              </path>
            </svg>
          </span>
          <span class="label" id="like-count">0</span>
        </button>
      </div>

      <!-- 닉네임 설정 모달 -->
      <div id="nickname-modal" class="nickname-modal" style="display:none;">
        <div class="nickname-modal-content">
          <h3>라이브 채팅 참여하기</h3>
          <p>채팅에 사용할 닉네임을 설정해주세요.</p>
          <input type="text" id="nickname-input" placeholder="닉네임 입력" autocomplete="off">
          <button id="btn-set-nickname">입장하기</button>
        </div>
      </div>

      <!-- 하단 플로팅 롤링 상품 배너 -->
      <div id="bottom-product-banner" class="bottom-product-banner" style="display:none;">
        <div class="banner-product-viewport">
          <div class="banner-product-track" id="banner-product-track">
            <!-- JS로 동적 렌더링 -->
          </div>
        </div>
        <div class="banner-more-btn" id="banner-more-btn">
          <span class="more-count" id="banner-more-count">0</span>
          <span class="more-text">더보기</span>
        </div>
      </div>

      <!-- 입력 영역 (최하단) -->
      <div class="input-section" id="chat-section-wrap" style="display:none;">
        <div class="input-wrapper">
          <input type="text" id="input-message" placeholder="채팅에 참여하세요..." autocomplete="off">
          <button id="btn-send">전송</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 소통왕 당첨자 주소지 입력 모달 팝업 -->
  <div id="winner-address-modal" class="modal-overlay" style="display: none; z-index: 1000000;">
    <div class="modal-content" style="max-width: 360px; padding: 24px; border-radius: 20px;">
      <div class="modal-header" style="margin-bottom: 16px;">
        <h2 style="font-size: 18px; font-weight: 800; color: #0f172a;">축하합니다! 소통왕 당첨</h2>
        <button id="close-winner-modal" class="close-btn">&times;</button>
      </div>
      <p style="font-size: 13px; color: #64748b; margin-bottom: 16px; line-height: 1.5;">
        선물 배송을 위한 정보를 입력해주세요.
      </p>
      <form id="winner-address-form" style="display: flex; flex-direction: column; gap: 12px;">
        <div>
          <label style="font-size: 12px; font-weight: 700; color: #334155; display: block; margin-bottom: 4px;">수령인 성함</label>
          <input type="text" id="winner-name-input" required placeholder="성함을 입력하세요" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; box-sizing: border-box;">
        </div>
        <div>
          <label style="font-size: 12px; font-weight: 700; color: #334155; display: block; margin-bottom: 4px;">연락처</label>
          <input type="tel" id="winner-phone-input" required placeholder="010-0000-0000" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; box-sizing: border-box;">
        </div>
        <div>
          <label style="font-size: 12px; font-weight: 700; color: #334155; display: block; margin-bottom: 4px;">배송지 주소</label>
          <textarea id="winner-address-input" required placeholder="상세 주소를 입력하세요" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; height: 60px; resize: none; box-sizing: border-box;"></textarea>
        </div>
        <button type="submit" style="background: #ef4444; color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px;">
          배송 정보 제출하기
        </button>
      </form>
    </div>
  </div>

  <!-- Supabase Config & JS Logic -->
  <script src="/supabase_config.js"></script>
  <script src="live.js?v=202608052153"></script>
</body>

</html>
