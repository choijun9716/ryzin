<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ryzin Live Commerce</title>
  
  <!-- HLS.js for m3u8 playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <link rel="stylesheet" href="live.css?v=1782885505996">
</head>
<body>
  <div class="live-container">
    <!-- 비디오 영역 -->
    <div class="video-wrapper">
      <video id="live-video" autoplay muted playsinline></video>
      <div class="video-overlay">
        <div class="live-badge">LIVE</div>
        <div class="view-count"><span id="view-count"></span></div>
      </div>
      
      <!-- 하단 그라데이션 오버레이 (텍스트 가독성) -->
      <div class="bottom-gradient"></div>
    </div>

    <!-- UI 레이어 (비디오 위에 띄워지는 정보들) -->
    <div class="ui-layer">
      <!-- 상단 방송 정보 -->
      <div class="header">
        <div class="brand-info">
          <img src="https://ui-avatars.com/api/?name=R&background=0D8ABC&color=fff" alt="Brand Logo" class="brand-logo">
          <div>
            <h1 class="brand-name"></h1>
            <p class="broadcast-title"></p>
          </div>
        </div>
      </div>

      <!-- 상품 모달 (숨김 상태) -->
      <div id="product-modal" class="product-modal hidden">
        <div class="modal-header">
          <h2>방송 중 특가 상품</h2>
          <button id="btn-close-modal" class="btn-close">✕</button>
        </div>
        <div class="modal-body" id="modal-products-list">
          <!-- JS에서 렌더링됨 -->
        </div>
      </div>

      <!-- 채팅 영역 -->
      <div class="chat-section">
        <div class="chat-messages" id="chat-messages">
          <!-- JS에서 렌더링됨 -->
        </div>
      </div>

      <!-- 사이드 액션 버튼 (우측 하단 플로팅) -->
      <div class="side-actions">
        <button class="action-btn" id="btn-shop">
          <span class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          </span>
          <span class="label">상품</span>
        </button>
      </div>

      <!-- 닉네임 설정 모달 -->
      <div id="nickname-modal" class="nickname-modal" style="display:none;">
        <div class="nickname-modal-content">
          <h3>라이브 채팅 참여하기</h3>
          <p>채팅에 사용할 닉네임을 설정해주세요.</p>
          <input type="text" id="nickname-input" placeholder="닉네임 입력 (예: 라이진)" autocomplete="off">
          <button id="btn-set-nickname">입장하기</button>
        </div>
      </div>

      <!-- 입력 영역 (최하단) -->
      <div class="input-section" id="chat-section-wrap" style="display:none;">
        <div class="input-wrapper">
          <input type="text" id="chat-input" placeholder="실시간 채팅에 참여하세요..." autocomplete="off">
          <button id="btn-send">전송</button>
        </div>
      </div>
    </div>
  </div>

  <script src="live.js?v=1782885642439"></script>
</body>
</html>
