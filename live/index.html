  <script>
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const isAdminPreview = urlParams.get('admin') === '1';
      const isEmbedParam = urlParams.get('embed') === '1';
      const isWidgetParam = urlParams.get('widget') === '1';
      const isInsideIframe = window.self !== window.top;
      
      // iframe 내부이거나 widget/embed 파라미터가 있으면 무조건 부모 크기에 100% 가득 핏
      if (isInsideIframe || isEmbedParam || isWidgetParam) {
        document.write('<style>html, body { width: 100% !important; height: 100% !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; background: transparent !important; } .live-container { width: 100% !important; height: 100% !important; max-width: none !important; max-height: none !important; border-radius: 0 !important; box-shadow: none !important; margin: 0 !important; position: absolute !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; }</style>');
        document.documentElement.classList.add('embed-mode-active');
      }

      const liveId = window.INJECTED_LIVE_ID || urlParams.get('id') || 'live01';
      const cached = JSON.parse(localStorage.getItem(`ryzin_live_config_${liveId}`) || '{}');
      
      // 어드민 미리보기이거나 스플래시 비활성화 상태면 즉시 가림
      if (isAdminPreview || cached.showSplash === false || isEmbedParam || isWidgetParam || isInsideIframe) {
        document.write('<style>#splash-screen { display: none !important; }</style>');
      }
    } catch(e) {}
  </script>

                style="width:100%; padding:12px 16px; border:1px solid #cbd5e1; border-radius:12px; font-size:14px; color:#0f172a; background:#f8fafc; outline:none; transition:all 0.2s; box-sizing:border-box;"
                onfocus="this.style.borderColor='#0f172a'; this.style.boxShadow='0 0 0 3px rgba(15,23,42,0.15)'"
                onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'">
            </div>
            <div>
              <label
                style="font-size:12px; font-weight:700; color:#475569; display:block; margin-bottom:6px; letter-spacing:-0.3px;">전화번호</label>
              <input type="text" id="lead-phone" placeholder="예: 010-1234-5678"
                style="width:100%; padding:12px 16px; border:1px solid #cbd5e1; border-radius:12px; font-size:14px; color:#0f172a; background:#f8fafc; outline:none; transition:all 0.2s; box-sizing:border-box;"
                onfocus="this.style.borderColor='#0f172a'; this.style.boxShadow='0 0 0 3px rgba(15,23,42,0.15)'"
                onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'">
            </div>
          </div>
          <button id="btn-submit-lead"
            style="width:100%; padding:14px; background:#0f172a; color:#ffffff; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(15,23,42,0.25); transition:all 0.2s; outline:none;"
            onmouseover="this.style.background='#1e293b'" onmouseout="this.style.background='#0f172a'"
            onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">
            문의 접수하기
          </button>
        </div>
      </div>

    </div>
