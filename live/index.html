<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ryzin Live Commerce</title>

  <!-- HLS.js for m3u8 playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <link rel="stylesheet" href="live.css?v=1783004444000">
</head>

<body>
  <div class="live-container">
    <!-- 비디오 영역 -->
    <div class="video-wrapper">
      <video id="live-video" autoplay muted playsinline></video>

      <!-- 썸네일 오버레이 (어드민에서 방송 시작 시 숨김 처리됨) -->
      <div id="thumbnail-overlay" class="thumbnail-overlay">
        <img id="thumbnail-img" class="thumbnail-img" src="" alt="Live Thumbnail" style="display:none;">
        <div class="thumbnail-content">
          <div id="live-start-text" class="live-start-text"></div>
        </div>
      </div>


      <!-- 하단 그라데이션 오버레이 (텍스트 가독성) -->
      <div class="bottom-gradient"></div>
    </div>

    <!-- UI 레이어 (비디오 위에 띄워지는 정보들) -->
    <div class="ui-layer">
      <!-- 상단 방송 정보 -->
      <div class="header">
        <div class="brand-info">
          <img src="https://ui-avatars.com/api/?name=R&background=0D8ABC&color=fff" alt="Brand Logo" class="brand-logo">
          <div class="text-side">
            <h1 class="brand-name"></h1>
            <p class="broadcast-title"></p>
          </div>
        </div>
        <!-- 대기/LIVE 뱃지 + 시청자수 (프로필 아래 인라인 배치) -->
        <div class="video-overlay">
          <div class="live-badge">LIVE</div>
          <div class="view-count"><span id="view-count"></span></div>
        </div>
      </div>

      <!-- 깜짝딜 타이머 배너 (제목 아래 가운데 배치) -->
      <div style="display:flex; justify-content:center; width:100%; pointer-events:none; padding-top:4px;">
        <div id="surprise-deal-timer"
          style="display:none; background:rgba(225,29,72,0.95); color:white; padding:8px 16px; border-radius:24px; font-weight:bold; font-size:14px; align-items:center; gap:6px; box-shadow:0 4px 12px rgba(225,29,72,0.4); animation: pulse 2s infinite; pointer-events:auto;">

          <span id="surprise-deal-text">깜짝딜 종료까지 00:00</span>
        </div>
      </div>

      <!-- 상품 모달 (숨김 상태) -->
      <div id="product-modal" class="product-modal hidden">
        <div class="modal-header">
          <h2>방송 중 특가 상품</h2>
          <button id="btn-close-modal" class="btn-close">✕</button>
        </div>
        <div class="modal-body" id="modal-products-list">
          <!-- JS에서 렌더링됨 -->
        </div>
      </div>

      <!-- 채팅 영역 -->
      <div class="chat-section">
        <div class="chat-messages" id="chat-messages">
          <!-- JS에서 렌더링됨 -->
        </div>
      </div>

      <!-- 사이드 액션 버튼 (우측 하단 플로팅) -->
      <div class="side-actions">

        <button class="action-btn" id="btn-like">
          <span class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
              </path>
            </svg>
          </span>
          <span class="label" id="like-count">0</span>
        </button>
      </div>

      <!-- 닉네임 설정 모달 -->
      <div id="nickname-modal" class="nickname-modal" style="display:none;">
        <div class="nickname-modal-content">
          <h3>라이브 채팅 참여하기</h3>
          <p>채팅에 사용할 닉네임을 설정해주세요.</p>
          <input type="text" id="nickname-input" placeholder="닉네임 입력 (예: 라이진)" autocomplete="off">
          <button id="btn-set-nickname">입장하기</button>
        </div>
      </div>

      <!-- 하단 플로팅 롤링 상품 배너 -->
      <div id="bottom-product-banner" class="bottom-product-banner" style="display:none;">
        <div class="banner-product-viewport">
          <div class="banner-product-track" id="banner-product-track">
            <!-- JS로 동적 렌더링 -->
          </div>
        </div>
        <div class="banner-more-btn" id="banner-more-btn">
          <span class="more-count" id="banner-more-count">0</span>
          <span class="more-text">더보기</span>
        </div>
      </div>

      <!-- 입력 영역 (최하단) -->
      <div class="input-section" id="chat-section-wrap" style="display:none;">
        <div class="input-wrapper">
          <input type="text" id="chat-input" placeholder="실시간 채팅에 참여하세요..." autocomplete="off">
          <button id="btn-send">전송</button>
        </div>
      </div>
    </div>

    <!-- 닉네임 설정 모달 (독립 레이어로 끄집어냄) -->
    <div id="nickname-modal" class="nickname-modal" style="display:none; pointer-events:auto; z-index:9999;">
      <div class="nickname-modal-content">
        <h3>라이브 채팅 참여하기</h3>
        <p>채팅에 사용할 닉네임을 설정해주세요.</p>
        <input type="text" id="nickname-input" placeholder="닉네임 입력 (예: 라이진)" autocomplete="off">
        <button id="btn-set-nickname">입장하기</button>
      </div>
    </div>
  </div>

  <!-- Supabase JS SDK & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase_config.js"></script>
  <script src="live.js?v=1783004444000"></script>
</body>

</html>
