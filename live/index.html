<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ryzin Live Commerce</title>

  <!-- HLS.js for m3u8 playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <link rel="stylesheet" href="live.css?v=1783502397298">
</head>

<body>
  <div class="live-container">
    <!-- 비디오 영역 -->
    <div class="video-wrapper">
      <video id="live-video" autoplay muted playsinline></video>

      <!-- 썸네일 오버레이 (어드민에서 방송 시작 시 숨김 처리됨) -->
      <div id="thumbnail-overlay" class="thumbnail-overlay">
        <img id="thumbnail-img" class="thumbnail-img" src="" alt="Live Thumbnail" style="display:none;">
        <div class="thumbnail-content">
          <div id="live-start-text" class="live-start-text"></div>
        </div>
      </div>


      <!-- 하단 그라데이션 오버레이 (텍스트 가독성) -->
      <div class="bottom-gradient"></div>
    </div>

    <!-- UI 레이어 (비디오 위에 띄워지는 정보들) -->
    <div class="ui-layer">
      <!-- 상단 방송 정보 -->
      <div class="header">
        <div class="brand-info">
          <img src="https://ui-avatars.com/api/?name=R&background=0D8ABC&color=fff" alt="Brand Logo" class="brand-logo">
          <div class="text-side">
            <h1 class="brand-name"></h1>
            <p class="broadcast-title"></p>
          </div>
        </div>
        <!-- 대기/LIVE 뱃지 + 시청자수 (프로필 아래 인라인 배치) -->
        <div class="video-overlay">
          <div class="live-badge">LIVE</div>
          <div class="view-count"><span id="view-count"></span></div>
        </div>
      </div>

      <!-- 깜짝딜 타이머 배너 (제목 아래 가운데 배치) -->
      <div style="display:flex; justify-content:center; width:100%; pointer-events:none; padding-top:4px;">
        <div id="surprise-deal-timer"
          style="display:none; background:rgba(225,29,72,0.95); color:white; padding:8px 16px; border-radius:24px; font-weight:bold; font-size:14px; align-items:center; gap:6px; box-shadow:0 4px 12px rgba(225,29,72,0.4); animation: pulse 2s infinite; pointer-events:auto;">

          <span id="surprise-deal-text">깜짝딜 종료까지 00:00</span>
        </div>
      </div>

      <!-- 소통왕/구매인증 전체 당첨 축하 플로팅 배너 (깜짝딜 배너 밑에 배치) -->
      <div style="display:flex; justify-content:center; width:100%; pointer-events:none; padding-top:6px;">
        <div id="winner-alert-overlay"
          style="display:none; background:linear-gradient(135deg, #fab005, #ff8787); color:white; padding:8px 18px; border-radius:24px; font-weight:bold; font-size:14px; align-items:center; gap:8px; box-shadow:0 4px 15px rgba(250,176,5,0.4); animation: pulse 2s infinite; pointer-events:auto; z-index:9999;">
          <span id="winner-emoji-span" style="font-size:15px; line-height:1;">🏆</span>
          <span id="winner-text-span">소통왕 당첨: <span id="winner-name-span" style="text-decoration:underline; font-weight:900; font-size:14px; margin-right:2px; color:#fff;"></span>님! 축하드립니다! 🎉</span>
        </div>
      </div>

      <!-- 상품 모달 (숨김 상태) -->
      <div id="product-modal" class="product-modal hidden">
        <div class="modal-header">
          <h2>방송 중 특가 상품</h2>
          <button id="btn-close-modal" class="btn-close">✕</button>
        </div>
        <div class="modal-body" id="modal-products-list">
          <!-- JS에서 렌더링됨 -->
        </div>
      </div>

      <!-- 채팅 영역 -->
      <div class="chat-section">
        <div class="chat-messages" id="chat-messages">
          <!-- JS에서 렌더링됨 -->
        </div>
      </div>

      <!-- 사이드 액션 버튼 (우측 하단 플로팅) -->
      <div class="side-actions">

        <button class="action-btn" id="btn-like">
          <span class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
              </path>
            </svg>
          </span>
          <span class="label" id="like-count">0</span>
        </button>
      </div>

      <!-- 닉네임 설정 모달 -->
      <div id="nickname-modal" class="nickname-modal" style="display:none;">
        <div class="nickname-modal-content">
          <h3>라이브 채팅 참여하기</h3>
          <p>채팅에 사용할 닉네임을 설정해주세요.</p>
          <input type="text" id="nickname-input" placeholder="닉네임 입력 (예: 라이진)" autocomplete="off">
          <button id="btn-set-nickname">입장하기</button>
        </div>
      </div>

      <!-- 하단 플로팅 롤링 상품 배너 -->
      <div id="bottom-product-banner" class="bottom-product-banner" style="display:none;">
        <div class="banner-product-viewport">
          <div class="banner-product-track" id="banner-product-track">
            <!-- JS로 동적 렌더링 -->
          </div>
        </div>
        <div class="banner-more-btn" id="banner-more-btn">
          <span class="more-count" id="banner-more-count">0</span>
          <span class="more-text">더보기</span>
        </div>
      </div>

      <!-- 입력 영역 (최하단) -->
      <div class="input-section" id="chat-section-wrap" style="display:none;">
        <div class="input-wrapper">
          <input type="text" id="chat-input" placeholder="실시간 채팅에 참여하세요..." autocomplete="off">
          <button id="btn-send">전송</button>
        </div>
      </div>

      <!-- 닉네임 설정 모달 (독립 레이어로 끄집어냄) -->
      <div id="nickname-modal" class="nickname-modal" style="display:none; pointer-events:auto; z-index:9999;">
        <div class="nickname-modal-content">
          <h3>라이브 채팅 참여하기</h3>
          <p>채팅에 사용할 닉네임을 설정해주세요.</p>
          <input type="text" id="nickname-input" placeholder="닉네임 입력 (예: 라이진)" autocomplete="off">
          <button id="btn-set-nickname">입장하기</button>
        </div>
      </div>    <!-- 당첨자 배송지 주소 수집 모달창 -->
    <div id="winner-address-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); justify-content:center; align-items:center; z-index:100000; padding:20px;">
      <div style="background:#ffffff; width:100%; max-width:360px; border-radius:24px; padding:24px; box-shadow:0 10px 30px rgba(0,0,0,0.25); position:relative; animation: slideUp 0.3s ease-out; color:#1a1a1a;">
        <button id="btn-close-address-modal" style="position:absolute; top:20px; right:20px; background:none; border:none; font-size:20px; font-weight:700; color:#888; cursor:pointer;">✕</button>
        <h3 id="winner-modal-title" style="margin:0 0 8px 0; font-size:18px; font-weight:800; color:#d9480f; display:flex; align-items:center; gap:6px;">
          <span>🎉 당첨을 축하드립니다!</span>
        </h3>
        <p style="font-size:12px; color:#666; margin:0 0 20px 0; line-height:1.5;">
          경품 배송을 위해 정확한 배송지 정보를 입력해 주세요. 입력하신 정보는 안전하게 보관됩니다.
        </p>
        <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:20px;">
          <div>
            <label style="font-size:11px; font-weight:800; color:#495057; display:block; margin-bottom:4px;">이름 (수령인)</label>
            <input type="text" id="address-name" placeholder="실명을 입력해 주세요" style="width:100%; padding:10px 14px; border:1.5px solid #dee2e6; border-radius:10px; font-size:13px; outline:none; transition:all 0.2s; box-sizing:border-box;">
          </div>
          <div>
            <label style="font-size:11px; font-weight:800; color:#495057; display:block; margin-bottom:4px;">전화번호</label>
            <input type="text" id="address-phone" placeholder="예: 010-1234-5678" style="width:100%; padding:10px 14px; border:1.5px solid #dee2e6; border-radius:10px; font-size:13px; outline:none; transition:all 0.2s; box-sizing:border-box;">
          </div>
          <div>
            <label style="font-size:11px; font-weight:800; color:#495057; display:block; margin-bottom:4px;">상세 배송지 주소</label>
            <input type="text" id="address-main" placeholder="상세 주소를 입력해 주세요" style="width:100%; padding:10px 14px; border:1.5px solid #dee2e6; border-radius:10px; font-size:13px; outline:none; transition:all 0.2s; box-sizing:border-box;">
          </div>
        </div>
        <button id="btn-submit-address" style="width:100%; padding:14px; background:linear-gradient(135deg, #fab005, #ff8787); color:#fff; border:none; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; box-shadow:0 4px 12px rgba(250,176,5,0.3); transition:all 0.2s;">
          배송 정보 제출하기
        </button>
      </div>
    </div>

    </div>

  <!-- Supabase JS SDK & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase_config.js"></script>
  <script src="live.js?v=1783502397298"></script>
</body>

</html>
