<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ryzin Live Commerce</title>
  
  <!-- HLS.js for m3u8 playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <link rel="stylesheet" href="live.css?v=1782881056870">
</head>
<body>
  <div class="live-container">
    <!-- 비디오 영역 -->
    <div class="video-wrapper">
      <video id="live-video" autoplay muted playsinline></video>
      <div class="video-overlay">
        <div class="live-badge">LIVE</div>
        <div class="view-count"><span id="view-count">1,204명 시청중</span></div>
        <button id="btn-mute" class="btn-mute" title="소리 켜기/끄기">🔇</button>
      </div>
      
      <!-- 하단 그라데이션 오버레이 (텍스트 가독성) -->
      <div class="bottom-gradient"></div>
    </div>

    <!-- UI 레이어 (비디오 위에 띄워지는 정보들) -->
    <div class="ui-layer">
      <!-- 상단 방송 정보 -->
      <div class="header">
        <div class="brand-info">
          <img src="https://ui-avatars.com/api/?name=R&background=0D8ABC&color=fff" alt="Brand Logo" class="brand-logo">
          <div>
            <h1 class="brand-name">Ryzin Corp</h1>
            <p class="broadcast-title">단독 특가 라이브 방송 중!</p>
          </div>
        </div>
      </div>

      <!-- 상품 모달 (숨김 상태) -->
      <div id="product-modal" class="product-modal hidden">
        <div class="modal-header">
          <h2>방송 중 특가 상품</h2>
          <button id="btn-close-modal" class="btn-close">✕</button>
        </div>
        <div class="modal-body" id="modal-products-list">
          <!-- JS에서 렌더링됨 -->
        </div>
      </div>

      <!-- 채팅 영역 -->
      <div class="chat-section">
        <div class="chat-messages" id="chat-messages">
          <!-- JS에서 렌더링됨 -->
        </div>
      </div>

      <!-- 사이드 액션 버튼 (우측 하단 플로팅) -->
      <div class="side-actions">
        <button class="action-btn" id="btn-shop">
          <span class="icon">🛍️</span>
          <span class="label">상품</span>
        </button>
        <button class="action-btn" id="btn-like">
          <span class="icon">❤️</span>
          <span class="label" id="like-count">12K</span>
        </button>
      </div>

      <!-- 입력 영역 (최하단) -->
      <div class="input-section">
        <div class="input-wrapper">
          <input type="text" id="chat-input" placeholder="실시간 채팅에 참여하세요..." autocomplete="off">
          <button id="btn-send">전송</button>
        </div>
      </div>
    </div>
  </div>

  <script src="live.js?v=1782881056870"></script>
</body>
</html>
