    <!-- Newsroom Script -->
    <script>
        // 모바일 디바이스 예전 더미 캐시 강제 자폭 삭제
        try {
            localStorage.removeItem('ryzin_news_data');
            localStorage.removeItem('ryzin_hp_news');
        } catch(e) {}

        document.addEventListener('DOMContentLoaded', async () => {
            const newsGrid = document.getElementById('newsGrid');
            const newsModal = document.getElementById('newsModal');
            const newsModalContent = document.getElementById('newsModalContent');
            const closeNewsModal = document.getElementById('closeNewsModal');

            let newsList = [];
            let activeCategory = 'all';
            let searchQuery = '';

            // 뉴스 데이터 로드 (Supabase 고속 DB/CDN 우선 연동)
            // 모바일 예전 더미 캐시 자동 강제 삭제 & 청소
            try {
                const oldCache = localStorage.getItem('ryzin_news_data') || localStorage.getItem('ryzin_hp_news');
                if (oldCache && oldCache.includes('파이낸셜뉴스')) {
                    localStorage.removeItem('ryzin_news_data');
                    localStorage.removeItem('ryzin_hp_news');
                }
            } catch(e) {}

            const defaultNewsList = [
                {
                    "id": "news-001",
                    "category": "언론보도",
                    "categoryEn": "PRESS",
                    "title": "라이진 스튜디오, 자사몰 라이브커머스 송출 서비스 '라이진커넥트' 출시",
                    "date": "2026.08.03",
                    "publisher": "CBCNEWS",
                    "summary": "라이진 스튜디오가 자사몰 브랜드 커머스 라이브 송출 솔루션인 '라이진커넥트'를 정식 출시하고 미디어 커머스 영역 확장에 나섭니다.",
                    "image": "assets/001.jpg",
                    "url": "https://blog.naver.com/ryzin_live",
                    "content": "미디어 커머스 기업 라이진 스튜디오(RYZIN Studio)가 자사몰 브랜드 커머스 라이브 송출 솔루션 '라이진커넥트'를 정식 출시했다고 3일 밝혔다.<br><br>라이진커넥트는 브랜드 자사몰 내에 라이브 방송 플랫폼을 직접 연동하여 고화질 라이브 송출과 실시간 구매 전환을 동시에 유도하는 차세대 미디어 솔루션입니다."
                }
            ];

            try {
                // 1차: Supabase DB homepage_settings (key = 'news') 직접 fetch (최우선 어드민 실시간 연동)
                const hpRes = await fetch('https://vybrnhyaeugfwezbygdt.supabase.co/rest/v1/homepage_settings?key=eq.news&select=*', {
                    headers: {
                        'apikey': 'sb_publishable_FxH6HGkUaKfcJD9by_TLFQ_0PJk80J9',
                        'Authorization': 'Bearer sb_publishable_FxH6HGkUaKfcJD9by_TLFQ_0PJk80J9'
                    }
                }).catch(() => null);

                if (hpRes && hpRes.ok) {
                    const hpData = await hpRes.json();
                    if (hpData && hpData[0] && hpData[0].value) {
                        let val = hpData[0].value;
                        if (typeof val === 'string') {
                            try { val = JSON.parse(val); } catch(e) {}
                        }
                        if (Array.isArray(val) && val.length > 0) {
                            newsList = val;
                        }
                    }
                }

                // 2차: news.json 버저닝 파일 로드
                if (!newsList || newsList.length === 0) {
                    const res = await fetch('./news.json?v=' + Date.now()).catch(() => null);
                    if (res && res.ok) {
                        const fetchedNews = await res.json();
                        if (fetchedNews && Array.isArray(fetchedNews) && fetchedNews.length > 0) {
                            newsList = fetchedNews;
                        }
                    }
                }

                // 3차: fallback default list
                if (!newsList || newsList.length === 0) {
                    newsList = defaultNewsList;
                }
            } catch(e) {
                console.error('뉴스 데이터 로딩 예외:', e);
                newsList = defaultNewsList;
            }

            renderNews();

            function renderNews() {
                if (!newsList || newsList.length === 0) {
                    newsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: rgba(255,255,255,0.5); padding: 60px;">등록된 보도자료가 없습니다.</div>';
                    return;
                }

                const filtered = newsList.filter(item => {
                    const matchCategory = activeCategory === 'all' || !activeCategory || !item.category || (item.category.trim() === activeCategory.trim());
                    const matchSearch = !searchQuery || 
                        (item.title && item.title.toLowerCase().includes(searchQuery.toLowerCase())) || 
                        (item.summary && item.summary.toLowerCase().includes(searchQuery.toLowerCase())) ||
                        (item.publisher && item.publisher.toLowerCase().includes(searchQuery.toLowerCase()));
                    return matchCategory && matchSearch;
                });

                if (filtered.length === 0) {
                    newsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: rgba(255,255,255,0.5); padding: 80px 0;">해당 조건의 보도자료가 없습니다.</div>';
                    return;
                }

                newsGrid.innerHTML = filtered.map(item => `
                    <div class="news-card" data-id="${item.id}" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.3s ease;">
                        <div style="width: 100%; height: 210px; overflow: hidden; position: relative;">
                            <img src="${item.image || 'assets/001.jpg'}" alt="${item.title}" loading="lazy" decoding="async" style="width: 100%; height: 100%; object-fit: cover; object-position: center ${item.imagePosition || '50%'}; transition: transform 0.4s ease;">
                            <span style="position: absolute; top: 12px; left: 12px; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); color: #ff8730; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);">
                                ${item.category || '언론보도'}
                            </span>
                        </div>
                        <div style="padding: 24px; display: flex; flex-direction: column; flex-grow: 1;">
                            <div style="display: flex; justify-content: space-between; align-items: center; color: rgba(255, 255, 255, 0.5); font-size: 0.82rem; margin-bottom: 12px;">
                                <span>${item.publisher}</span>
                                <span>${item.date}</span>
                            </div>
                            <h3 style="color: #fff; font-size: 1.15rem; font-weight: 700; line-height: 1.45; margin-bottom: 12px;">
                                ${item.title}
                            </h3>
                            <p style="color: rgba(255, 255, 255, 0.65); font-size: 0.9rem; line-height: 1.6; margin-bottom: 20px; flex-grow: 1;">
                                ${item.summary}
                            </p>
                            <div style="display: flex; align-items: center; color: #ff8730; font-size: 0.88rem; font-weight: 600;">
                                보도자료 보기 <i data-feather="arrow-right" style="width: 14px; height: 14px; margin-left: 6px;"></i>
                            </div>
                        </div>
                    </div>
                `).join('');

                if (window.feather) feather.replace();

                // 호버 및 클릭 이벤트
                document.querySelectorAll('.news-card').forEach(card => {
                    card.addEventListener('mouseenter', () => {
                        card.style.transform = 'translateY(-6px)';
                        const img = card.querySelector('img');
                        if (img) img.style.transform = 'scale(1.05)';
                    });
                    card.addEventListener('mouseleave', () => {
                        card.style.transform = 'translateY(0)';
                        const img = card.querySelector('img');
                        if (img) img.style.transform = 'scale(1.0)';
                    });
                    card.addEventListener('click', () => {
                        const id = card.dataset.id;
                        const newsItem = newsList.find(n => n.id === id);
                        if (newsItem) {
                            newsModalContent.innerHTML = `
                                <div style="margin-bottom: 12px; display: flex; align-items: center; gap: 10px;">
                                    <span style="background: rgba(255, 135, 48, 0.2); color: #ff8730; border: 1px solid rgba(255, 135, 48, 0.3); font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 12px;">${newsItem.category}</span>
                                    <span style="color: rgba(255,255,255,0.5); font-size: 0.85rem;">${newsItem.publisher} | ${newsItem.date}</span>
                                </div>
                                <h2 style="font-size: 1.4rem; font-weight: 800; line-height: 1.45; margin-bottom: 20px; color: #fff;">${newsItem.title}</h2>
                                ${newsItem.image ? `<img src="${newsItem.image}" alt="${newsItem.title}" style="width: 100%; height: auto; max-height: 320px; object-fit: cover; object-position: center ${newsItem.imagePosition || '50%'}; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1);">` : ''}
                                <div style="color: rgba(255,255,255,0.85); font-size: 0.95rem; line-height: 1.8; margin-bottom: 24px;">
                                    ${newsItem.content}
                                </div>
                                ${newsItem.url ? `
                                    <div style="text-align: right; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 16px;">
                                        <a href="${newsItem.url}" target="_blank" rel="noopener" class="btn" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: #ff8730; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem;">
                                            원문 기사 보기 <i data-feather="external-link" style="width: 16px; height: 16px;"></i>
                                        </a>
                                    </div>
                                ` : ''}
                            `;
                            newsModal.style.display = 'flex';
                            if (window.feather) feather.replace();
                        }
                    });
                });
            }

            if (closeNewsModal) {
                closeNewsModal.addEventListener('click', () => { newsModal.style.display = 'none'; });
            }
            window.addEventListener('click', (e) => { if (e.target === newsModal) newsModal.style.display = 'none'; });
        });
    </script>
